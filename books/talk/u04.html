 <section id="ask"><h2>❓ Ask and answer</h2><div class="chat qa"><button class="c" data-a="audio/u04_q0.mp3"><b style="background:#6b1d2b">Q</b><span>Can you help me?</span></button><button class="c r" data-a="audio/u04_a0.mp3"><b style="background:#2b7bd6">A</b><span>Of course!</span></button><button class="c" data-a="audio/u04_q1.mp3"><b style="background:#6b1d2b">Q</b><span>What are you looking for?</span></button><button class="c r" data-a="audio/u04_a1.mp3"><b style="background:#2b7bd6">A</b><span>My red pencil.</span></button><button class="c" data-a="audio/u04_q2.mp3"><b style="background:#6b1d2b">Q</b><span>Do you understand?</span></button><button class="c r" data-a="audio/u04_a2.mp3"><b style="background:#2b7bd6">A</b><span>No, not really.</span></button><button class="c" data-a="audio/u04_q3.mp3"><b style="background:#6b1d2b">Q</b><span>Can you say it again?</span></button><button class="c r" data-a="audio/u04_a3.mp3"><b style="background:#2b7bd6">A</b><span>Yes. Listen carefully.</span></button><button class="c" data-a="audio/u04_q4.mp3"><b style="background:#6b1d2b">Q</b><span>Is it difficult?</span></button><button class="c r" data-a="audio/u04_a4.mp3"><b style="background:#2b7bd6">A</b><span>Yes, a little.</span></button><button class="c" data-a="audio/u04_q5.mp3"><b style="background:#6b1d2b">Q</b><span>Is it okay now?</span></button><button class="c r" data-a="audio/u04_a5.mp3"><b style="background:#2b7bd6">A</b><span>Yes! Thank you.</span></button></div><button class="all" data-group="qa">▶ Play all</button></section>
