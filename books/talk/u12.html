 <section id="say"><h2>💬 Useful phrases</h2><div class="says"><button class="s" data-a="audio/u12_p0.mp3"><img class="" src="../img/1f44d.webp" alt="" loading="lazy"><span>Yes!</span><i>🔊</i></button><button class="s" data-a="audio/u12_p1.mp3"><img class="" src="../img/1f44e.webp" alt="" loading="lazy"><span>No.</span><i>🔊</i></button><button class="s" data-a="audio/u12_p2.mp3"><img class="" src="../img/1f914.webp" alt="" loading="lazy"><span>Maybe.</span><i>🔊</i></button><button class="s" data-a="audio/u12_p3.mp3"><img class="" src="../img/1f642.webp" alt="" loading="lazy"><span>I think so.</span><i>🔊</i></button><button class="s" data-a="audio/u12_p4.mp3"><img class="" src="../img/1f643.webp" alt="" loading="lazy"><span>I don't think so.</span><i>🔊</i></button><button class="s" data-a="audio/u12_p5.mp3"><img class="" src="../img/2705.webp" alt="" loading="lazy"><span>That's right!</span><i>🔊</i></button><button class="s" data-a="audio/u12_p6.mp3"><img class="" src="../img/274c.webp" alt="" loading="lazy"><span>That's wrong.</span><i>🔊</i></button><button class="s" data-a="audio/u12_p7.mp3"><img class="" src="../img/1f91d.webp" alt="" loading="lazy"><span>I agree.</span><i>🔊</i></button></div><button class="all" data-group="says">▶ Play all phrases</button></section>
 <section id="ask"><h2>❓ Ask and answer</h2><div class="chat qa"><button class="c" data-a="audio/u12_q0.mp3"><b style="background:#6b1d2b">Q</b><span>Is it raining?</span></button><button class="c r" data-a="audio/u12_a0.mp3"><b style="background:#2b7bd6">A</b><span>Yes, it is.</span></button><button class="c" data-a="audio/u12_q1.mp3"><b style="background:#6b1d2b">Q</b><span>Is an elephant small?</span></button><button class="c r" data-a="audio/u12_a1.mp3"><b style="background:#2b7bd6">A</b><span>No, it isn't.</span></button><button class="c" data-a="audio/u12_q2.mp3"><b style="background:#6b1d2b">Q</b><span>Can you play football?</span></button><button class="c r" data-a="audio/u12_a2.mp3"><b style="background:#2b7bd6">A</b><span>Yes, I can.</span></button><button class="c" data-a="audio/u12_q3.mp3"><b style="background:#6b1d2b">Q</b><span>Can a fish fly?</span></button><button class="c r" data-a="audio/u12_a3.mp3"><b style="background:#2b7bd6">A</b><span>No, it can't.</span></button><button class="c" data-a="audio/u12_q4.mp3"><b style="background:#6b1d2b">Q</b><span>Is it your birthday?</span></button><button class="c r" data-a="audio/u12_a4.mp3"><b style="background:#2b7bd6">A</b><span>Maybe. Guess!</span></button><button class="c" data-a="audio/u12_q5.mp3"><b style="background:#6b1d2b">Q</b><span>Is an apple red?</span></button><button class="c r" data-a="audio/u12_a5.mp3"><b style="background:#2b7bd6">A</b><span>Yes, sometimes.</span></button></div><button class="all" data-group="qa">▶ Play all</button></section>
 <section id="talk"><h2>🎭 Mini talks</h2><h3>Talk 1</h3><div class="chat t0"><button class="c " data-a="audio/u12_t0_0.mp3"><b style="background:#8e4fc4">Mia</b><span>Is this your bag?</span></button><button class="c r" data-a="audio/u12_t0_1.mp3"><b style="background:#2f8f4a">Omar</b><span>No, it isn't. It's Leo's bag.</span></button><button class="c " data-a="audio/u12_t0_2.mp3"><b style="background:#8e4fc4">Mia</b><span>Oh, okay.</span></button><button class="c r" data-a="audio/u12_t0_3.mp3"><b style="background:#2f8f4a">Omar</b><span>My bag is blue.</span></button></div><button class="all" data-group="t0">▶ Play talk 1</button><h3>Talk 2</h3><div class="chat t1"><button class="c r" data-a="audio/u12_t1_0.mp3"><b style="background:#2f8f4a">Omar</b><span>Do you think it will rain?</span></button><button class="c " data-a="audio/u12_t1_1.mp3"><b style="background:#8e4fc4">Mia</b><span>I think so. Look at the clouds.</span></button><button class="c r" data-a="audio/u12_t1_2.mp3"><b style="background:#2f8f4a">Omar</b><span>Let's take an umbrella.</span></button><button class="c " data-a="audio/u12_t1_3.mp3"><b style="background:#8e4fc4">Mia</b><span>Good idea!</span></button></div><button class="all" data-group="t1">▶ Play talk 2</button><h3>Talk 3</h3><div class="chat t2"><button class="c " data-a="audio/u12_t2_0.mp3"><b style="background:#8e4fc4">Mia</b><span>Two plus two is five.</span></button><button class="c r" data-a="audio/u12_t2_1.mp3"><b style="background:#2f8f4a">Omar</b><span>That's wrong! It's four.</span></button><button class="c " data-a="audio/u12_t2_2.mp3"><b style="background:#8e4fc4">Mia</b><span>Oh yes, you're right.</span></button><button class="c r" data-a="audio/u12_t2_3.mp3"><b style="background:#2f8f4a">Omar</b><span>Ha ha!</span></button></div><button class="all" data-group="t2">▶ Play talk 3</button></section><nav class="pn"><a class="nav" href="u11.html">‹ Sorry and Excuse Me</a><a class="nav home" href="./">All units</a><a class="nav" hre
