 <section id="say"><h2>💬 Useful phrases</h2><div class="says"><button class="s" data-a="audio/u05_p0.mp3"><img class="" src="../img/1f6bb.webp" alt="" loading="lazy"><span>Can I go to the toilet?</span><i>🔊</i></button><button class="s" data-a="audio/u05_p1.mp3"><img class="" src="../img/1f4fa.webp" alt="" loading="lazy"><span>Can I watch TV?</span><i>🔊</i></button><button class="s" data-a="audio/u05_p2.mp3"><img class="" src="../img/1f3ae.webp" alt="" loading="lazy"><span>Can I play outside?</span><i>🔊</i></button><button class="s" data-a="audio/u05_p3.mp3"><img class="" src="../img/1f36b.webp" alt="" loading="lazy"><span>Can I have a snack?</span><i>🔊</i></button><button class="s" data-a="audio/u05_p4.mp3"><img class="" src="../img/1f9d1-200d-1f91d-200d-1f9d1.webp" alt="" loading="lazy"><span>Can my friend come over?</span><i>🔊</i></button><button class="s" data-a="audio/u05_p5.mp3"><img class="" src="../img/1f4a7.webp" alt="" loading="lazy"><span>May I have some water?</span><i>🔊</i></button><button class="s" data-a="audio/u05_p6.mp3"><img class="" src="../img/1f44d.webp" alt="" loading="lazy"><span>Yes, you can.</span><i>🔊</i></button><button class="s" data-a="audio/u05_p7.mp3"><img class="" src="../img/1f645.webp" alt="" loading="lazy"><span>Sorry, not now.</span><i>🔊</i></button></div><button class="all" data-group="says">▶ Play all phrases</button></section>
 <section id="ask"><h2>❓ Ask and answer</h2><div class="chat qa"><button class="c" data-a="audio/u05_q0.mp3"><b style="background:#6b1d2b">Q</b><span>Can I watch TV?</span></button><button class="c r" data-a="audio/u05_a0.mp3"><b style="background:#2b7bd6">A</b><span>Yes, for one hour.</span></button><button class="c" data-a="audio/u05_q1.mp3"><b style="background:#6b1d2b">Q</b><span>Can I play a game?</span></button><button class="c r" data-a="audio/u05_a1.mp3"><b style="background:#2b7bd6">A</b><span>Not now. Do your homework first.</span></button><button class="c" data-a="audio/u05_q2.mp3"><b style="background:#6b1d2b">Q</b><span>Can I ride my bike?</span></button><button class="c r" data-a="audio/u05_a2.mp3"><b style="background:#2b7bd6">A</b><span>Yes, but wear your helmet.</span></button><button class="c" data-a="audio/u05_q3.mp3"><b style="background:#6b1d2b">Q</b><span>Can I have ice cream?</span></button><button class="c r" data-a="audio/u05_a3.mp3"><b style="background:#2b7bd6">A</b><span>After dinner, okay?</span></button><button class="c" data-a="audio/u05_q4.mp3"><b style="background:#6b1d2b">Q</b><span>Can Leo come over?</span></button><button class="c r" data-a="audio/u05_a4.mp3"><b style="background:#2b7bd6">A</b><span>Yes, he can.</span></button><button class="c" data-a="audio/u05_q5.mp3"><b style="background:#6b1d2b">Q</b><span>Can I stay up late?</span></button><button class="c r" data-a="audio/u05_a5.mp3"><b style="background:#2b7bd6">A</b><span>Sorry, it's bedtime.</span></button></div><button class="all" data-group="qa">▶ Play all</button></section>
 <section id="talk"><h2>🎭 Mini talks</h2><h3>Talk 1</h3><div class="chat t0"><button class="c " data-a="audio/u05_t0_0.mp3"><b style="background:#2f8f4a">Omar</b><span>Dad, can I play outside?</span></button><button class="c r" data-a="audio/u05_t0_1.mp3"><b style="background:#2b7bd6">Dad</b><span>Did you finish your homework?</span></button><button class="c " data-a="audio/u05_t0_2.mp3"><b style="background:#2f8f4a">Omar</b><span>Yes, I did!</span></button><button class="c r" data-a="audio/u05_t0_3.mp3"><b style="background:#2b7bd6">Dad</b><span>Okay. Yes, you can.</span></button></div><button class="all" data-group="t0">▶ Play talk 1</button><h3>Talk 2</h3><div class="chat t1"><button class="c " data-a="audio/u05_t1_0.mp3"><b style="background:#2f8f4a">Omar</b><span>Can I have a snack?</span></button><button class="c r" data-a="audio/u05_t1_1.mp3"><b style="background:#2b7bd6">Dad</b><span>Sure. An apple or a banana?</span></button><button class="c " data-a="audio/u05_t1_2.mp3"><b style="background:#2f8f4a">Omar</b><span>A banana, please.</span></button><button class="c r" data-a="audio/u05_t1_3.mp3"><b style="background:#2b7bd6">Dad</b><span>Here you go.</span></button></div><button class="all" data-group="t1">▶ Play talk 2</button><h3>Talk 3</h3><div class="chat t2"><button class="c " data-a="audio/u05_t2_0.mp3"><b style="background:#2f8f4a">Omar</b><span>Can I watch TV now?</span></button><button class="c r" data-a="audio/u05_t2_1.mp3"><b style="background:#2b7bd6">Dad</b><span>Sorry, not now. It's dinner time.</span></button><button class="c " data-a="audio/u05_t2_2.mp3"><b style="background:#2f8f4a">Omar</b><span>Okay. After dinner?</span></button><button class="c r" data-a="audio/u05_t2_3.mp3"><b style="background:#2b7bd6">Dad</b><span>Yes, after dinner.</span></button></div><button class="all" data-group="t2">▶ Play talk 3</button></section><nav class="pn"><a class="nav" href="u04.html">‹ Can You Help Me?</a><a class="nav home" href="./">All units</a><a cla
