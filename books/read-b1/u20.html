 <section id="words"><h2>🔤 Key words</h2><div class="words"><button class="w" data-a="audio/u20_w0.mp3"><img class="" src="../img/1f33b.webp" alt="" loading="lazy"><span>garden</span></button><button class="w" data-a="audio/u20_w1.mp3"><img class="" src="../img/1f9e4.webp" alt="" loading="lazy"><span>gloves</span></button><button class="w" data-a="audio/u20_w2.mp3"><img class="" src="../img/1fab1.webp" alt="" loading="lazy"><span>soil</span></button><button class="w" data-a="audio/u20_w3.mp3"><img class="" src="../img/1f345.webp" alt="" loading="lazy"><span>vegetable</span></button><button class="w" data-a="audio/u20_w4.mp3"><img class="" src="../img/1f327-fe0f.webp" alt="" loading="lazy"><span>weed</span></button><button class="w" data-a="audio/u20_w5.mp3"><img class="" src="../img/1f41d.webp" alt="" loading="lazy"><span>insect</span></button><button class="w" data-a="audio/u20_w6.mp3"><img class="" src="../img/1f475.webp" alt="" loading="lazy"><span>neighbour</span></button><button class="w" data-a="audio/u20_w7.mp3"><img class="" src="../img/1f9fa.webp" alt="" loading="lazy"><span>harvest</span></button></div><button class="all" data-group="words">▶ Play all words</button><p class="tip">💭 Think: What could you grow in a small garden?</p></section>
 <section id="story"><h2>📖 Read the story</h2><div class="says story"><button class="s" data-a="audio/u20_p0.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f331.webp" alt="" loading="lazy"><span>Behind Leo's school, there was an empty piece of land full of rubbish and weeds. Every day, Leo walked past it and thought it was ugly. One day, he saw an elderly woman there, pulling weeds with her gloves. Her name was Mrs. Amal, and she was his neighbour.</span><i>🔊</i></button><button class="s" data-a="audio/u20_p1.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f475.webp" alt="" loading="lazy"><span>&quot;I used to be a farmer,&quot; Mrs. Amal said. &quot;I want to turn this land into a garden for the school, but I'm too old to do it alone.&quot; Leo offered to help. The next day, he brought three friends. They called themselves the Secret Garden Club.</span><i>🔊</i></button><button class="s" data-a="audio/u20_p2.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f9e4.webp" alt="" loading="lazy"><span>Every Wednesday after school, the club met at the garden. First, they removed the rubbish and weeds. Then Mrs. Amal taught them how to prepare the soil. They planted tomatoes, cucumbers, mint and sunflowers. The work was hard, but it was fun.</span><i>🔊</i></button><button class="s" data-a="audio/u20_p3.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f41d.webp" alt="" loading="lazy"><span>Leo learned a lot. He learned that some insects, like bees and ladybirds, are good for gardens. He learned that plants need water early in the morning, not in the hot afternoon. He also learned that patience is important, because plants grow slowly.</span><i>🔊</i></button><button class="s" data-a="audio/u20_p4.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f345.webp" alt="" loading="lazy"><span>Three months later, the garden was green and full of colour. The club harvested their first tomatoes and shared them with the school canteen. Other students wanted to join, and soon the club had twenty members.</span><i>🔊</i></button><button class="s" data-a="audio/u20_p5.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f33b.webp" alt="" loading="lazy"><span>At the end of the year, the head teacher put a sign at the entrance: &quot;Mrs. Amal's Garden&quot;. Mrs. Amal cried with happiness. &quot;I thought I was too old to start something new,&quot; she told Leo. &quot;You helped me discover that it's never too late.&quot;</span><i>🔊</i></button></div><button class="all" data-group="story">▶ Read the whole story</button><p class="tip">🎧 Listen and follow. Then read it aloud by yourself!</p></section><nav class="pn"><a class="nav" href="u19.html">‹ Space Camp</a><a class="nav home" href="./">All units</a><span></span></nav></main><script src="../assets/listen.js"></script></body></html>
