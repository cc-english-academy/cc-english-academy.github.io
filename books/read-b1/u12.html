 <section id="words"><h2>🔤 Key words</h2><div class="words"><button class="w" data-a="audio/u12_w0.mp3"><img class="" src="../img/1f4bb.webp" alt="" loading="lazy"><span>online</span></button><button class="w" data-a="audio/u12_w1.mp3"><img class="" src="../img/1f3ae.webp" alt="" loading="lazy"><span>game</span></button><button class="w" data-a="audio/u12_w2.mp3"><img class="" src="../img/1f512.webp" alt="" loading="lazy"><span>password</span></button><button class="w" data-a="audio/u12_w3.mp3"><img class="" src="../img/1f575-fe0f.webp" alt="" loading="lazy"><span>stranger</span></button><button class="w" data-a="audio/u12_w4.mp3"><img class="" src="../img/26a0-fe0f.webp" alt="" loading="lazy"><span>warning</span></button><button class="w" data-a="audio/u12_w5.mp3"><img class="" src="../img/1f4f8.webp" alt="" loading="lazy"><span>photo</span></button><button class="w" data-a="audio/u12_w6.mp3"><img class="" src="../img/1f6ab.webp" alt="" loading="lazy"><span>block</span></button><button class="w" data-a="audio/u12_w7.mp3"><img class="" src="../img/1f5e3-fe0f.webp" alt="" loading="lazy"><span>trust</span></button></div><button class="all" data-group="words">▶ Play all words</button><p class="tip">💭 Think: How can we stay safe on the internet?</p></section>
 <section id="story"><h2>📖 Read the story</h2><div class="says story"><button class="s" data-a="audio/u12_p0.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f3ae.webp" alt="" loading="lazy"><span>Leo loved playing an online game where players built cities together. One day, a player called &quot;Max_12&quot; sent him a message. Max said he was twelve years old, just like Leo, and that he loved football too.</span><i>🔊</i></button><button class="s" data-a="audio/u12_p1.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f4ac.webp" alt="" loading="lazy"><span>Every evening, Max and Leo played together and chatted. Max was funny and always gave Leo free coins in the game. After two weeks, Leo felt that Max was a real friend, even though they had never met.</span><i>🔊</i></button><button class="s" data-a="audio/u12_p2.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/26a0-fe0f.webp" alt="" loading="lazy"><span>Then Max started asking strange questions. &quot;Which school do you go to? Can you send me a photo of yourself?&quot; One evening, he asked for Leo's password. &quot;I can give you a hundred more coins,&quot; he wrote. &quot;Just don't tell your parents.&quot;</span><i>🔊</i></button><button class="s" data-a="audio/u12_p3.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f914.webp" alt="" loading="lazy"><span>Leo felt uncomfortable. He remembered a lesson at school: a real friend never asks you to keep secrets from your parents. He also remembered that people online can lie about their age and their name. He decided to talk to his mum.</span><i>🔊</i></button><button class="s" data-a="audio/u12_p4.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f469.webp" alt="" loading="lazy"><span>His mum listened carefully and didn't get angry. She told him he had done the right thing. Together, they took screenshots of the messages, blocked Max and reported him to the game company. Later, the company told them that Max was not a child at all.</span><i>🔊</i></button><button class="s" data-a="audio/u12_p5.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f512.webp" alt="" loading="lazy"><span>Leo still plays the game, but now he only plays with friends he knows in real life. He never shares his password, his address or his photos. &quot;If something online feels wrong,&quot; he tells his little brother, &quot;always tell a grown-up.&quot;</span><i>🔊</i></button></div><button class="all" data-group="story">▶ Read the whole story</button><p class="tip">🎧 Listen and follow. Then read it aloud by yourself!</p></section><nav class="pn"><a class="nav" href="u11.html">‹ A New Country</a><a class="nav home" href="./">All units</a><a class="nav" href="u13.html">The Talent Show ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
