 <section id="words"><h2>🔤 Key words</h2><div class="words"><button class="w" data-a="audio/u18_w0.mp3"><img class="" src="../img/1f3fa.webp" alt="" loading="lazy"><span>vase</span></button><button class="w" data-a="audio/u18_w1.mp3"><img class="" src="../img/1f494.webp" alt="" loading="lazy"><span>break</span></button><button class="w" data-a="audio/u18_w2.mp3"><img class="" src="../img/1f648.webp" alt="" loading="lazy"><span>hide</span></button><button class="w" data-a="audio/u18_w3.mp3"><img class="" src="../img/1f925.webp" alt="" loading="lazy"><span>lie</span></button><button class="w" data-a="audio/u18_w4.mp3"><img class="" src="../img/1f61f.webp" alt="" loading="lazy"><span>guilty</span></button><button class="w" data-a="audio/u18_w5.mp3"><img class="" src="../img/1f5e3-fe0f.webp" alt="" loading="lazy"><span>truth</span></button><button class="w" data-a="audio/u18_w6.mp3"><img class="" src="../img/1f932.webp" alt="" loading="lazy"><span>honest</span></button><button class="w" data-a="audio/u18_w7.mp3"><img class="" src="../img/1fac2.webp" alt="" loading="lazy"><span>forgive</span></button></div><button class="all" data-group="words">▶ Play all words</button><p class="tip">💭 Think: Is it always easy to tell the truth? Why?</p></section>
 <section id="story"><h2>📖 Read the story</h2><div class="says story"><button class="s" data-a="audio/u18_p0.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f3fa.webp" alt="" loading="lazy"><span>In Omar's living room, there was a beautiful blue vase. It had belonged to his great-grandmother, and his mother loved it more than anything else in the house. She always told the children not to play near it.</span><i>🔊</i></button><button class="s" data-a="audio/u18_p1.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/26bd.webp" alt="" loading="lazy"><span>One afternoon, Omar was alone at home, and he started kicking a small ball in the living room. He knew it was against the rules, but he thought nobody would see. Suddenly, the ball hit the table, and the vase fell to the floor. Crash!</span><i>🔊</i></button><button class="s" data-a="audio/u18_p2.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f648.webp" alt="" loading="lazy"><span>Omar's heart stopped. The vase was in five pieces. He panicked, picked up the pieces and hid them in a bag under his bed. When his mother came home and asked where the vase was, Omar said, &quot;Maybe the cat knocked it over.&quot;</span><i>🔊</i></button><button class="s" data-a="audio/u18_p3.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f61f.webp" alt="" loading="lazy"><span>That night, Omar couldn't sleep. He felt terrible. His mother was sad, and the cat was in trouble for something it hadn't done. The lie felt heavier than any punishment. At two o'clock in the morning, he got out of bed.</span><i>🔊</i></button><button class="s" data-a="audio/u18_p4.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f5e3-fe0f.webp" alt="" loading="lazy"><span>He took the bag to his mother's room and woke her up. With tears in his eyes, he told her the whole truth. His mother was quiet for a long time. Then she hugged him. &quot;I'm sad about the vase,&quot; she said, &quot;but I'm proud of you for being honest.&quot;</span><i>🔊</i></button><button class="s" data-a="audio/u18_p5.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f932.webp" alt="" loading="lazy"><span>The next weekend, Omar and his mother glued the vase back together. It still had lines where it had broken, but his mother put it back on the table. &quot;Now it reminds me of something even more special,&quot; she said, &quot;the day my son chose the truth.&quot;</span><i>🔊</i></button></div><button class="all" data-group="story">▶ Read the whole story</button><p class="tip">🎧 Listen and follow. Then read it aloud by yourself!</p></section><nav class="pn"><a class="nav" href="u17.html">‹ The Time Capsule</a><a class="nav home" href="./">All units</a><a class="nav" href="u19.html">Space Camp ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
