 <section id="words"><h2>🔤 Key words</h2><div class="words"><button class="w" data-a="audio/u11_w0.mp3"><img class="" src="../img/2708-fe0f.webp" alt="" loading="lazy"><span>move</span></button><button class="w" data-a="audio/u11_w1.mp3"><img class="" src="../img/1f5e3-fe0f.webp" alt="" loading="lazy"><span>language</span></button><button class="w" data-a="audio/u11_w2.mp3"><img class="" src="../img/1f61f.webp" alt="" loading="lazy"><span>lonely</span></button><button class="w" data-a="audio/u11_w3.mp3"><img class="" src="../img/1f3eb.webp" alt="" loading="lazy"><span>classmate</span></button><button class="w" data-a="audio/u11_w4.mp3"><img class="" src="../img/1f372.webp" alt="" loading="lazy"><span>dish</span></button><button class="w" data-a="audio/u11_w5.mp3"><img class="" src="../img/1f91d.webp" alt="" loading="lazy"><span>welcome</span></button><button class="w" data-a="audio/u11_w6.mp3"><img class="" src="../img/1f4da.webp" alt="" loading="lazy"><span>culture</span></button><button class="w" data-a="audio/u11_w7.mp3"><img class="" src="../img/1f60a.webp" alt="" loading="lazy"><span>fit in</span></button></div><button class="all" data-group="words">▶ Play all words</button><p class="tip">💭 Think: How would you feel if you moved to a new country?</p></section>
 <section id="story"><h2>📖 Read the story</h2><div class="says story"><button class="s" data-a="audio/u11_p0.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/2708-fe0f.webp" alt="" loading="lazy"><span>When Mia was eleven, her family moved from Canada to Saudi Arabia because of her father's new job. Everything was different: the weather, the food, the language and the school. On her first day, Mia felt very lonely.</span><i>🔊</i></button><button class="s" data-a="audio/u11_p1.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f61f.webp" alt="" loading="lazy"><span>She didn't know anyone, and she couldn't understand Arabic. At lunchtime, she sat alone and ate her sandwich quietly. She missed her old friends and her grandmother. That night, she told her mum that she wanted to go home.</span><i>🔊</i></button><button class="s" data-a="audio/u11_p2.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f91d.webp" alt="" loading="lazy"><span>The next day, a girl with a pink hijab sat next to her. &quot;Hi, I'm Sara,&quot; she said in English. &quot;Do you want to have lunch with us?&quot; Sara introduced Mia to her friends, and they asked her lots of questions about Canada and snow.</span><i>🔊</i></button><button class="s" data-a="audio/u11_p3.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f372.webp" alt="" loading="lazy"><span>Over the next few weeks, Sara taught Mia some Arabic words, like &quot;shukran&quot; for thank you. Mia taught her friends how to make pancakes with maple syrup. Sara's mother invited Mia's family for dinner, and Mia tried kabsa for the first time. She loved it!</span><i>🔊</i></button><button class="s" data-a="audio/u11_p4.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f4da.webp" alt="" loading="lazy"><span>Mia started to enjoy learning about her new culture. She visited the old city, rode a camel and learned to write her name in Arabic. She still missed Canada sometimes, but she didn't feel lonely anymore.</span><i>🔊</i></button><button class="s" data-a="audio/u11_p5.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f60a.webp" alt="" loading="lazy"><span>A year later, a new boy joined their class. He looked nervous and sat alone at lunchtime. Mia remembered how she had felt. She walked over and smiled. &quot;Hi, I'm Mia,&quot; she said. &quot;Do you want to have lunch with us?&quot;</span><i>🔊</i></button></div><button class="all" data-group="story">▶ Read the whole story</button><p class="tip">🎧 Listen and follow. Then read it aloud by yourself!</p></section><nav class="pn"><a class="nav" href="u10.html">‹ The Big Storm</a><a class="nav home" href="./">All units</a><a class="nav" href="u12.html">The Online Friend ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
