 <section id="words"><h2>🔤 Key words</h2><div class="words"><button class="w" data-a="audio/u05_w0.mp3"><img class="" src="../img/1f3d9-fe0f.webp" alt="" loading="lazy"><span>city</span></button><button class="w" data-a="audio/u05_w1.mp3"><img class="" src="../img/1f5fa-fe0f.webp" alt="" loading="lazy"><span>map</span></button><button class="w" data-a="audio/u05_w2.mp3"><img class="" src="../img/1f687.webp" alt="" loading="lazy"><span>station</span></button><button class="w" data-a="audio/u05_w3.mp3"><img class="" src="../img/1f46e.webp" alt="" loading="lazy"><span>police officer</span></button><button class="w" data-a="audio/u05_w4.mp3"><img class="" src="../img/1f628.webp" alt="" loading="lazy"><span>frightened</span></button><button class="w" data-a="audio/u05_w5.mp3"><img class="" src="../img/1f4cd.webp" alt="" loading="lazy"><span>address</span></button><button class="w" data-a="audio/u05_w6.mp3"><img class="" src="../img/1f50b.webp" alt="" loading="lazy"><span>battery</span></button><button class="w" data-a="audio/u05_w7.mp3"><img class="" src="../img/1f9e0.webp" alt="" loading="lazy"><span>calm</span></button></div><button class="all" data-group="words">▶ Play all words</button><p class="tip">💭 Think: What would you do if you got lost in a big city?</p></section>
 <section id="story"><h2>📖 Read the story</h2><div class="says story"><button class="s" data-a="audio/u05_p0.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f3d9-fe0f.webp" alt="" loading="lazy"><span>Mia and her family were on holiday in London. On the third day, they visited a busy market full of shops, music and food. There were so many people that it was difficult to walk. Mia stopped to look at some colourful bracelets.</span><i>🔊</i></button><button class="s" data-a="audio/u05_p1.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f628.webp" alt="" loading="lazy"><span>When she turned around, her family had gone. She looked left and right, but she could only see strangers. Her heart started beating very fast. She tried to call her mother, but her phone battery was dead.</span><i>🔊</i></button><button class="s" data-a="audio/u05_p2.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f9e0.webp" alt="" loading="lazy"><span>Mia felt frightened, but she remembered what her dad always said: &quot;If you get lost, stay calm and find someone in a uniform.&quot; She took a deep breath and looked around. Near the entrance of the market, she saw a police officer.</span><i>🔊</i></button><button class="s" data-a="audio/u05_p3.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f46e.webp" alt="" loading="lazy"><span>&quot;Excuse me,&quot; she said politely. &quot;I've lost my family. Can you help me?&quot; The officer, whose name was Ken, smiled. He asked for her name, her parents' names and the name of their hotel. Luckily, Mia remembered all of it.</span><i>🔊</i></button><button class="s" data-a="audio/u05_p4.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f4de.webp" alt="" loading="lazy"><span>Officer Ken used his radio to contact the other officers. Meanwhile, he bought Mia a hot chocolate. Fifteen minutes later, her parents arrived, running and out of breath. Her mother hugged her so tightly that Mia could hardly breathe.</span><i>🔊</i></button><button class="s" data-a="audio/u05_p5.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f4cd.webp" alt="" loading="lazy"><span>Back at the hotel, Mia's dad wrote the hotel's address and his phone number on a card and put it in her pocket. &quot;Just in case,&quot; he said. Mia promised to stay close next time. It was a scary afternoon, but she was proud that she had stayed calm.</span><i>🔊</i></button></div><button class="all" data-group="story">▶ Read the whole story</button><p class="tip">🎧 Listen and follow. Then read it aloud by yourself!</p></section><nav class="pn"><a class="nav" href="u04.html">‹ The Football Final</a><a class="nav home" href="./">All units</a><a class="nav" href="u06.html">The Robot Teacher ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
