 <section id="words"><h2>🔤 Key words</h2><div class="words"><button class="w" data-a="audio/u01_w0.mp3"><img class="" src="../img/1f4f1.webp" alt="" loading="lazy"><span>borrow</span></button><button class="w" data-a="audio/u01_w1.mp3"><img class="" src="../img/1f50d.webp" alt="" loading="lazy"><span>search</span></button><button class="w" data-a="audio/u01_w2.mp3"><img class="" src="../img/1f630.webp" alt="" loading="lazy"><span>panic</span></button><button class="w" data-a="audio/u01_w3.mp3"><img class="" src="../img/1f392.webp" alt="" loading="lazy"><span>backpack</span></button><button class="w" data-a="audio/u01_w4.mp3"><img class="" src="../img/1f926.webp" alt="" loading="lazy"><span>forget</span></button><button class="w" data-a="audio/u01_w5.mp3"><img class="" src="../img/1f575-fe0f.webp" alt="" loading="lazy"><span>clue</span></button><button class="w" data-a="audio/u01_w6.mp3"><img class="" src="../img/1f64f.webp" alt="" loading="lazy"><span>apologise</span></button><button class="w" data-a="audio/u01_w7.mp3"><img class="" src="../img/1f62e-200d-1f4a8.webp" alt="" loading="lazy"><span>relieved</span></button></div><button class="all" data-group="words">▶ Play all words</button><p class="tip">💭 Think: Have you ever lost something important? What did you do?</p></section>
 <section id="story"><h2>📖 Read the story</h2><div class="says story"><button class="s" data-a="audio/u01_p0.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f4f1.webp" alt="" loading="lazy"><span>On Monday morning, Omar arrived at school and put his hand in his pocket. His phone wasn't there. He felt his heart beating fast. It was a new phone, and his parents had bought it for his birthday only two weeks ago.</span><i>🔊</i></button><button class="s" data-a="audio/u01_p1.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f630.webp" alt="" loading="lazy"><span>Omar started to panic. He searched his desk, his backpack and even the bin. Nothing. &quot;Someone has taken it,&quot; he thought. He looked around the classroom and wondered which of his classmates could be the thief.</span><i>🔊</i></button><button class="s" data-a="audio/u01_p2.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f469-200d-1f3eb.webp" alt="" loading="lazy"><span>Ms. Lina saw that he was upset. &quot;What's wrong, Omar?&quot; she asked kindly. When he explained, she told him to stay calm. &quot;Let's think about it carefully,&quot; she said. &quot;When did you last use your phone?&quot;</span><i>🔊</i></button><button class="s" data-a="audio/u01_p3.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f68c.webp" alt="" loading="lazy"><span>Omar closed his eyes and tried to remember. He had called his mum from the bus. Then he had put the phone on the seat next to him because he was reading a comic. That was the clue he needed!</span><i>🔊</i></button><button class="s" data-a="audio/u01_p4.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f4de.webp" alt="" loading="lazy"><span>Ms. Lina called the bus company. Ten minutes later, they called back. The driver had found a phone on the back seat, and it was safe in his office. Omar felt so relieved that he almost jumped out of his chair.</span><i>🔊</i></button><button class="s" data-a="audio/u01_p5.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f64f.webp" alt="" loading="lazy"><span>That afternoon, Omar collected his phone. He also felt bad because he had thought that a classmate had stolen it. He learned two lessons that day: always check your things before you leave, and never blame people without a reason.</span><i>🔊</i></button></div><button class="all" data-group="story">▶ Read the whole story</button><p class="tip">🎧 Listen and follow. Then read it aloud by yourself!</p></section><nav class="pn"><span></span><a class="nav home" href="./">All units</a><a class="nav" href="u02.html">The Science Fair ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
