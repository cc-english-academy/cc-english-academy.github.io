 <section id="words"><h2>🔤 Key words</h2><div class="words"><button class="w" data-a="audio/u17_w0.mp3"><img class="" src="../img/1f4e6.webp" alt="" loading="lazy"><span>time capsule</span></button><button class="w" data-a="audio/u17_w1.mp3"><img class="" src="../img/1f52e.webp" alt="" loading="lazy"><span>future</span></button><button class="w" data-a="audio/u17_w2.mp3"><img class="" src="../img/1f4dd.webp" alt="" loading="lazy"><span>letter</span></button><button class="w" data-a="audio/u17_w3.mp3"><img class="" src="../img/1f573-fe0f.webp" alt="" loading="lazy"><span>bury</span></button><button class="w" data-a="audio/u17_w4.mp3"><img class="" src="../img/1f4f7.webp" alt="" loading="lazy"><span>photograph</span></button><button class="w" data-a="audio/u17_w5.mp3"><img class="" src="../img/1f393.webp" alt="" loading="lazy"><span>graduate</span></button><button class="w" data-a="audio/u17_w6.mp3"><img class="" src="../img/1f622.webp" alt="" loading="lazy"><span>emotional</span></button><button class="w" data-a="audio/u17_w7.mp3"><img class="" src="../img/23f3.webp" alt="" loading="lazy"><span>decade</span></button></div><button class="all" data-group="words">▶ Play all words</button><p class="tip">💭 Think: What would you put in a box for the future?</p></section>
 <section id="story"><h2>📖 Read the story</h2><div class="says story"><button class="s" data-a="audio/u17_p0.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f4e6.webp" alt="" loading="lazy"><span>On the last day of primary school, Ms. Lina brought a big metal box into the classroom. &quot;This is a time capsule,&quot; she explained. &quot;Each of you will put something special inside. We'll bury it in the school garden and open it in ten years.&quot;</span><i>🔊</i></button><button class="s" data-a="audio/u17_p1.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f4dd.webp" alt="" loading="lazy"><span>The students were excited. Sara put in a photograph of her class, a friendship bracelet and a letter to herself. In the letter, she wrote about her dreams: she wanted to be a doctor, visit Japan and learn to play the guitar.</span><i>🔊</i></button><button class="s" data-a="audio/u17_p2.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f573-fe0f.webp" alt="" loading="lazy"><span>Other students put in drawings, toys, a newspaper and even a video game. Then the whole class went into the garden and buried the box under the old palm tree. Ms. Lina wrote the date on a small stone: &quot;Open in 10 years.&quot;</span><i>🔊</i></button><button class="s" data-a="audio/u17_p3.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/23f3.webp" alt="" loading="lazy"><span>A decade passed. Sara grew up, finished school and went to university to study medicine. She never forgot about the time capsule. Ten years later, she received a message from Ms. Lina: &quot;It's time! Come to the school on Saturday.&quot;</span><i>🔊</i></button><button class="s" data-a="audio/u17_p4.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f622.webp" alt="" loading="lazy"><span>On Saturday, twenty young adults stood around the palm tree. They laughed when they saw how small the school looked now. When they opened the box, everything was still there. People became emotional as they read their letters and remembered their childhood.</span><i>🔊</i></button><button class="s" data-a="audio/u17_p5.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f3b8.webp" alt="" loading="lazy"><span>Sara opened her letter and smiled. She was studying to be a doctor, and she had visited Japan last summer. But she had never learned the guitar. That evening, she bought one. &quot;It's not too late,&quot; she thought. &quot;Dreams don't have a time limit.&quot;</span><i>🔊</i></button></div><button class="all" data-group="story">▶ Read the whole story</button><p class="tip">🎧 Listen and follow. Then read it aloud by yourself!</p></section><nav class="pn"><a class="nav" href="u16.html">‹ The Mountain Climb</a><a class="nav home" href="./">All units</a><a class="nav" href="u18.html">The Broken Vase ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
