 <section id="words"><h2>🔤 Key words</h2><div class="words"><button class="w" data-a="audio/u10_w0.mp3"><img class="" src="../img/26c8-fe0f.webp" alt="" loading="lazy"><span>storm</span></button><button class="w" data-a="audio/u10_w1.mp3"><img class="" src="../img/26a1.webp" alt="" loading="lazy"><span>lightning</span></button><button class="w" data-a="audio/u10_w2.mp3"><img class="" src="../img/1f50c.webp" alt="" loading="lazy"><span>power cut</span></button><button class="w" data-a="audio/u10_w3.mp3"><img class="" src="../img/1f56f-fe0f.webp" alt="" loading="lazy"><span>candle</span></button><button class="w" data-a="audio/u10_w4.mp3"><img class="" src="../img/1f30a.webp" alt="" loading="lazy"><span>flood</span></button><button class="w" data-a="audio/u10_w5.mp3"><img class="" src="../img/1f4fb.webp" alt="" loading="lazy"><span>radio</span></button><button class="w" data-a="audio/u10_w6.mp3"><img class="" src="../img/1f3e0.webp" alt="" loading="lazy"><span>safe</span></button><button class="w" data-a="audio/u10_w7.mp3"><img class="" src="../img/1f0cf.webp" alt="" loading="lazy"><span>board game</span></button></div><button class="all" data-group="words">▶ Play all words</button><p class="tip">💭 Think: What do you do at home when there is no electricity?</p></section>
 <section id="story"><h2>📖 Read the story</h2><div class="says story"><button class="s" data-a="audio/u10_p0.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/26c8-fe0f.webp" alt="" loading="lazy"><span>It was a Friday evening when the storm arrived. The sky turned dark grey, and the wind started to blow so hard that the trees bent. Omar watched from the window as heavy rain hit the glass. Then a flash of lightning lit up the whole street.</span><i>🔊</i></button><button class="s" data-a="audio/u10_p1.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f50c.webp" alt="" loading="lazy"><span>Suddenly, all the lights went off. The TV stopped, the fridge went quiet and the house became completely dark. &quot;It's a power cut,&quot; said Dad calmly. Omar's little sister started to cry because she was afraid of the dark.</span><i>🔊</i></button><button class="s" data-a="audio/u10_p2.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f56f-fe0f.webp" alt="" loading="lazy"><span>Dad found some candles and a torch in the kitchen. Mum turned on an old radio that used batteries. The news said that the storm would last all night and that people should stay at home. Some streets near the river had flooded.</span><i>🔊</i></button><button class="s" data-a="audio/u10_p3.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f0cf.webp" alt="" loading="lazy"><span>At first, Omar was bored. He couldn't play video games or watch films, and his phone had only ten percent battery. Then Dad took out an old board game from the cupboard. Omar hadn't played it for years.</span><i>🔊</i></button><button class="s" data-a="audio/u10_p4.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f602.webp" alt="" loading="lazy"><span>They sat on the floor around the candles and played for three hours. Dad told funny stories about when he was a boy, and Mum made sandwiches because the cooker didn't work. Even Omar's sister stopped crying and started laughing.</span><i>🔊</i></button><button class="s" data-a="audio/u10_p5.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/2600-fe0f.webp" alt="" loading="lazy"><span>In the morning, the storm had gone, and the electricity came back. Omar was surprised that he felt a little sad. &quot;Can we have a no-screen night every week?&quot; he asked. Now, every Friday, the family turns off their phones and plays games together.</span><i>🔊</i></button></div><button class="all" data-group="story">▶ Read the whole story</button><p class="tip">🎧 Listen and follow. Then read it aloud by yourself!</p></section><nav class="pn"><a class="nav" href="u09.html">‹ Saving the Turtles</a><a class="nav home" href="./">All units</a><a class="nav" href="u11.html">A New Country ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
