 <section id="words"><h2>🔤 Key words</h2><div class="words"><button class="w" data-a="audio/u06_w0.mp3"><img class="" src="../img/1f916.webp" alt="" loading="lazy"><span>robot</span></button><button class="w" data-a="audio/u06_w1.mp3"><img class="" src="../img/1f4bb.webp" alt="" loading="lazy"><span>program</span></button><button class="w" data-a="audio/u06_w2.mp3"><img class="" src="../img/2753.webp" alt="" loading="lazy"><span>answer</span></button><button class="w" data-a="audio/u06_w3.mp3"><img class="" src="../img/1f602.webp" alt="" loading="lazy"><span>joke</span></button><button class="w" data-a="audio/u06_w4.mp3"><img class="" src="../img/2764-fe0f.webp" alt="" loading="lazy"><span>feelings</span></button><button class="w" data-a="audio/u06_w5.mp3"><img class="" src="../img/1f50b.webp" alt="" loading="lazy"><span>charge</span></button><button class="w" data-a="audio/u06_w6.mp3"><img class="" src="../img/1f9d1-200d-1f3eb.webp" alt="" loading="lazy"><span>human</span></button><button class="w" data-a="audio/u06_w7.mp3"><img class="" src="../img/1f914.webp" alt="" loading="lazy"><span>wonder</span></button></div><button class="all" data-group="words">▶ Play all words</button><p class="tip">💭 Think: Would you like to have a robot teacher? Why?</p></section>
 <section id="story"><h2>📖 Read the story</h2><div class="says story"><button class="s" data-a="audio/u06_p0.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f916.webp" alt="" loading="lazy"><span>One Monday, Sara's class had a surprise. Their teacher was away, and a robot was standing in front of the board. &quot;Good morning, students. My name is T-100,&quot; it said in a strange voice. &quot;Today I will teach you mathematics.&quot;</span><i>🔊</i></button><button class="s" data-a="audio/u06_p1.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f4bb.webp" alt="" loading="lazy"><span>At first, everyone loved it. T-100 knew the answer to every question in less than a second. It could do difficult sums, speak ten languages and draw perfect circles. It never got tired, and it never got angry.</span><i>🔊</i></button><button class="s" data-a="audio/u06_p2.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f610.webp" alt="" loading="lazy"><span>But after a few days, the students started to feel bored. T-100 always explained things in the same way. When Sara didn't understand a sum, the robot just repeated the same words more slowly. It didn't try a different idea.</span><i>🔊</i></button><button class="s" data-a="audio/u06_p3.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f622.webp" alt="" loading="lazy"><span>On Thursday, Sara's friend Noor started crying because her cat was ill. T-100 said, &quot;Crying does not help. Please open your books to page forty.&quot; Nobody said anything, but everyone felt that something important was missing.</span><i>🔊</i></button><button class="s" data-a="audio/u06_p4.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f9d1-200d-1f3eb.webp" alt="" loading="lazy"><span>The next week, their teacher, Mr. Adam, came back. He told a silly joke, and the whole class laughed. When Sara didn't understand, he drew a picture and used apples to explain. When Noor was sad, he sat with her and listened.</span><i>🔊</i></button><button class="s" data-a="audio/u06_p5.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f914.webp" alt="" loading="lazy"><span>Sara wrote about it in her diary: &quot;Robots are clever, and they can help us learn facts. But a good teacher understands people. A robot can know everything, but it can't care about you.&quot; She wondered if robots would ever learn to care.</span><i>🔊</i></button></div><button class="all" data-group="story">▶ Read the whole story</button><p class="tip">🎧 Listen and follow. Then read it aloud by yourself!</p></section><nav class="pn"><a class="nav" href="u05.html">‹ Lost in the City</a><a class="nav home" href="./">All units</a><a class="nav" href="u07.html">Grandfather's Watch ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
