 <section id="words"><h2>🔤 Key words</h2><div class="words"><button class="w" data-a="audio/u14_w0.mp3"><img class="" src="../img/1f4d6.webp" alt="" loading="lazy"><span>novel</span></button><button class="w" data-a="audio/u14_w1.mp3"><img class="" src="../img/1f4c5.webp" alt="" loading="lazy"><span>overdue</span></button><button class="w" data-a="audio/u14_w2.mp3"><img class="" src="../img/2709-fe0f.webp" alt="" loading="lazy"><span>letter</span></button><button class="w" data-a="audio/u14_w3.mp3"><img class="" src="../img/1f575-fe0f.webp" alt="" loading="lazy"><span>mystery</span></button><button class="w" data-a="audio/u14_w4.mp3"><img class="" src="../img/1f3e0.webp" alt="" loading="lazy"><span>owner</span></button><button class="w" data-a="audio/u14_w5.mp3"><img class="" src="../img/1f9d3.webp" alt="" loading="lazy"><span>elderly</span></button><button class="w" data-a="audio/u14_w6.mp3"><img class="" src="../img/1f50e.webp" alt="" loading="lazy"><span>discover</span></button><button class="w" data-a="audio/u14_w7.mp3"><img class="" src="../img/1f38a.webp" alt="" loading="lazy"><span>surprise</span></button></div><button class="all" data-group="words">▶ Play all words</button><p class="tip">💭 Think: What could you find inside an old book?</p></section>
 <section id="story"><h2>📖 Read the story</h2><div class="says story"><button class="s" data-a="audio/u14_p0.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f4d6.webp" alt="" loading="lazy"><span>Omar loved the school library, especially the dusty old books on the top shelf. One day, he borrowed a novel called &quot;The Silver Ship&quot;. The pages were yellow, and the book smelled old. On the first page, there was a date stamp: 1985.</span><i>🔊</i></button><button class="s" data-a="audio/u14_p1.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/2709-fe0f.webp" alt="" loading="lazy"><span>As Omar was reading at home, an envelope fell out of the book. Inside, there was a letter written in blue ink. It said: &quot;Dear reader, if you find this letter, please write to me. I want to know if children still love this story. — Hassan, age 11.&quot;</span><i>🔊</i></button><button class="s" data-a="audio/u14_p2.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f575-fe0f.webp" alt="" loading="lazy"><span>Omar was amazed. The letter was almost forty years old! There was an address at the bottom. Omar showed the letter to Ms. Lina, the librarian. &quot;What a mystery!&quot; she said. &quot;Why don't you write back? Maybe Hassan still lives there.&quot;</span><i>🔊</i></button><button class="s" data-a="audio/u14_p3.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/270d-fe0f.webp" alt="" loading="lazy"><span>That weekend, Omar wrote a long letter. He told Hassan about himself, his school and how much he was enjoying &quot;The Silver Ship&quot;. He posted it, but he didn't really expect an answer. Weeks passed, and he almost forgot about it.</span><i>🔊</i></button><button class="s" data-a="audio/u14_p4.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f4ec.webp" alt="" loading="lazy"><span>Then, one morning, Ms. Lina called him to the library. An elderly man with white hair was sitting at a table. &quot;Hello, Omar,&quot; he said with a big smile. &quot;I'm Hassan. I was eleven when I wrote that letter. Now I'm fifty-one!&quot;</span><i>🔊</i></button><button class="s" data-a="audio/u14_p5.mp3" style="font-weight:400;line-height:1.55"><img class="" src="../img/1f38a.webp" alt="" loading="lazy"><span>Hassan had become a writer, and &quot;The Silver Ship&quot; was the book that made him want to write stories. He gave Omar a signed copy of his own new book. Now Omar has started writing his own stories, and he always hides a letter inside his favourite library books.</span><i>🔊</i></button></div><button class="all" data-group="story">▶ Read the whole story</button><p class="tip">🎧 Listen and follow. Then read it aloud by yourself!</p></section><nav class="pn"><a class="nav" href="u13.html">‹ The Talent Show</a><a class="nav home" href="./">All units</a><a class="nav" href="u15.html">The Volunteer Day ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
