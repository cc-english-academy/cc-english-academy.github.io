 var h='<div class="tabs">'+TABS.map(function(x,k){return '<button class="tab'+(k==t?' on':'')+'" data-t="'+k+'">'+x[0]+' '+x[1]+'</button>'}).join('')+'</div><div id="pane"></div>';app.innerHTML=h;scrollTo(0,0);
 [].forEach.call(app.querySelectorAll('.tab'),function(b){b.onclick=function(){open(i,+b.getAttribute('data-t'))}});
 [learn,read,build,listen,spell][t](d,col,document.getElementById('pane'),i)}
function learn(d,col,P,i){var h='<div class="card"><p class="ins">Tap the sound. Then tap each word to hear it.</p><div class="big"><button class="sound" id="snd" style="background:'+col+'">'+d.p.replace('_','-')+'</button></div></div><div class="words">'+d.w.map(function(w){return '<button class="wc" data-w="'+w[0]+'"><img src="'+IM+w[1]+'" alt=""><span class="wd">'+hl(w[0],d.p,col)+'</span></button>'}).join('')+'</div><div class="row"><button class="btn" id="all">▶ Play all</button><button class="btn go" id="nx">Next: Read 📖</button></div>';P.innerHTML=h;
 document.getElementById('snd').onclick=function(){say('p_'+d.id)};
 [].forEach.call(P.querySelectorAll('.wc'),function(b){b.onclick=function(){mark(b);say(wid(b.getAttribute('data-w')),function(){mark(null)})}});
 document.getElementById('all').onclick=function(){var l=[].slice.call(P.querySelectorAll('.wc'));(function n(k){if(k>=l.length){mark(null);return}mark(l[k]);say(wid(l[k].getAttribute('data-w')),function(){setTimeout(function(){n(k+1)},250)})})(0)};
 document.getElementById('nx').onclick=function(){open(i,1)};setTimeout(function(){say('p_'+d.id)},300)}
function mark(el){[].forEach.call(document.querySelectorAll('.on-play'),function(x){x.classList.remove('on-play')});if(el)el.classList.add('on-play')}
function read(d,col,P,i){var h='<div class="card"><p class="ins">Read the sentence. Then tap 🔊 to check!</p><div class="sent">'+d.s.map(function(s,k){return '<button class="sb" data-k="'+k+'"><span class="sp">🔊</span><span>'+hlSent(s,d.p,col)+'</span></button>'}).join('')+'</div></div><div class="card"><p class="ins">Read these words fast! Tap to check.</p><div class="tiles">'+shuffle(d.w).map(function(w){return '<button class="tile" data-w="'+w[0]+'">'+hl(w[0],d.p,col)+'</button>'}).join('')+'</div></div><div class="row"><button class="btn go" id="nx">Next: Build 🧩</button></div>';P.innerHTML=h;
 [].forEach.call(P.querySelectorAll('.sb'),function(b){b.onclick=function(){mark(b);say('s_'+d.id+'_'+b.getAttribute('data-k'),function(){mark(null)})}});
 [].forEach.call(P.querySelectorAll('.tile'),function(b){b.onclick=function(){mark(b);say(wid(b.getAttribute('data-w')),function(){mark(null)})}});
 document.getElementById('nx').onclick=function(){open(i,2)}}
function finish(d,key,P,i,next){store[d.id]=store[d.id]||{};store[d.id][key]=1;save();updStars();say('fb_finish');
 P.innerHTML='<div class="card done"><div class="bigstar">⭐</div><h3>Fantastic!</h3><p>You earned a star for the <b>'+d.p.replace('_','-')+'</b> family.</p><div class="row"><button class="btn" id="ag">↻ Again</button>'+(next!=null?'<button class="btn go" id="nx">Next ›</button>':'<button class="btn go" id="hm">More families</button>')+'</div></div>';
 document.getElementById('ag').onclick=function(){open(i,{b:2,q:3,s:4}[key])};var nx=document.getElementById('nx');if(nx)nx.onclick=function(){open(i,next)};var hm=document.getElementById('hm');if(hm)hm.onclick=home}
function prog(n,k,ok){var s='<div class="prog">';for(var j=0;j<n;j++)s+='<i class="'+(j<k?'ok':j==k?'cur':'')+'"></i>';return s+'</div>'}
// Build: hear the word, tap tiles (onset letters + family chunk) to build it
function build(d,col,P,i){var list=shuffle(d.w),k=0;
 function round(){if(k>=list.length){finish(d,'b',P,i,3);return}var w=list[k][0].toLowerCase(),pi=w.lastIndexOf(d.p);var parts=[];
  if(pi<0){parts=w.split('')}else{w.slice(0,pi).split('').forEach(function(c){parts.push(c)});parts.push(d.p);w.slice(pi+d.p.length).split('').forEach(function(c){parts.push(c)})}
  var extra=shuffle('bcdfghjlmnprstw'.split('').filter(function(c){return parts.indexOf(c)<0})).slice(0,2);
  var tiles=shuffle(parts.concat(extra)),filled=[];
  P.innerHTML='<div class="card">'+prog(list.length,k)+'<p class="ins">Listen and build the word.</p><button class="play" id="pl">🔊 Listen</button><img class="qimg" src="'+IM+list[k][1]+'" alt=""><div class="slots" id="sl"></div><div class="tiles" id="tl"></div><div class="row"><button class="btn" id="un">⌫ Undo</button></div></div>';
  var sl=document.getElementById('sl'),tl=document.getElementById('tl');
  function draw(){sl.innerHTML=parts.map(function(_,j){return '<div class="slot'+(filled[j]?' f':'')+'"'+(filled[j]&&filled[j].t==d.p?' style="color:'+col+'"':'')+'>'+(filled[j]?filled[j].t:'')+'</div>'}).join('')}
  tl.innerHTML=tiles.map(function(t,j){return '<button class="tile'+(t==d.p?' fam':'')+'" data-j="'+j+'"'+(t==d.p?' style="background:'+col+'"':'')+'>'+t+'</button>'}).join('');draw();
  [].forEach.call(tl.querySelectorAll('.tile'),function(b){b.onclick=function(){if(filled.length>=parts.length)return;b.disabled=true;filled.push({t:tiles[+b.getAttribute('data-j')],b:b});draw();
   if(filled.length==parts.length){if(filled.map(function(f){return f.t}).join('')==w){toast('⭐ '+list[k][0]);say(praise[k%3],function(){say(wid(list[k][0]),function(){k++;setTimeout(round,300)})})}else{toast('🙈 Try again');say('fb_try');setTimeout(function(){filled.forEach(function(f){f.b.disabled=false});filled=[];draw()},700)}}}});
  document.getElementById('un').onclick=function(){var f=filled.pop();if(f){f.b.disabled=false;draw()}};
  document.getElementById('pl').onclick=function(){say(wid(list[k][0]))};setTimeout(function(){say(wid(list[k][0]))},350)}
 round()}
// Listen: hear a word, choose the right picture
function listen(d,col,P,i){var list=shuffle(d.w),k=0,miss=0;
 function round(){if(k>=list.length){finish(d,'q',P,i,4);return}var ans=list[k];var others=shuffle(d.w.filter(function(w){return w[0]!=ans[0]})).slice(0,2);var ch=shuffle([ans].concat(others));
  P.innerHTML='<div class="card">'+prog(list.length,k)+'<p class="ins">Listen and choose the picture.</p><button class="play" id="pl">🔊 Listen</button><div class="choices">'+ch.map(function(w){return '<button class="ch" data-w="'+w[0]+'"><img src="'+IM+w[1]+'" alt=""><span>'+hl(w[0],d.p,col)+'</span></button>'}).join('')+'</div></div>';
  var locked=false;[].forEach.call(P.querySelectorAll('.ch'),function(b){b.onclick=function(){if(locked)return;if(b.getAttribute('data-w')==ans[0]){locked=true;b.classList.add('right');toast('⭐');say(praise[k%3],function(){k++;setTimeout(round,250)})}else{b.classList.add('wrong');say('fb_try',function(){say(wid(ans[0]))})}}});
  document.getElementById('pl').onclick=function(){say(wid(ans[0]))};setTimeout(function(){say(wid(ans[0]))},350)}
 round()}
// Spell: see the picture, spell the word letter by letter
function spell(d,col,P,i){var list=shuffle(d.w).slice(0,5),k=0;
 function round(){if(k>=list.length){finish(d,'s',P,i,null);return}var w=list[k][0].toLowerCase(),letters=w.split('');var extra=shuffle('abcdefghijklmnoprstuwy'.split('').filter(function(c){return letters.indexOf(c)<0})).slice(0,Math.max(2,6-letters.length));
  var tiles=shuffle(letters.concat(extra)),filled=[],hint=false;
  P.innerHTML='<div class="card">'+prog(list.length,k)+'<p class="ins">Look at the picture and spell the word.</p><img class="qimg" src="'+IM+list[k][1]+'" alt=""><div class="row" style="margin-top:0"><button class="btn" id="pl">🔊 Hear it</button><button class="btn" id="hn">💡 Hint</button></div><div class="slots" id="sl"></div><div class="tiles" id="tl"></div><div class="row"><button class="btn" id="un">⌫ Undo</button></div><p class="hint" id="ht"></p></div>';
  var sl=document.getElementById('sl'),tl=document.getElementById('tl'),FI=famIdx(w,d.p);
  function draw(){sl.innerHTML=letters.map(function(c,j){var inFam=hint&&FI.indexOf(j)>=0;var v=filled[j]?filled[j].t:(inFam?'<span style="opacity:.35">'+c+'</span>':'');return '<div class="slot'+(filled[j]?' f':'')+'"'+((inFam||(FI.indexOf(j)>=0&&filled[j]))?' style="color:'+col+'"':'')+'>'+v+'</div>'}).join('')}
  tl.innerHTML=tiles.map(function(t,j){return '<button class="tile" data-j="'+j+'">'+t+'</button>'}).join('');draw();
  [].forEach.call(tl.querySelectorAll('.tile'),function(b){b.onclick=function(){if(filled.length>=letters.length)return;b.disabled=true;filled.push({t:tiles[+b.getAttribute('data-j')],b:b});draw();
   if(filled.length==letters.length){if(filled.map(function(f){return f.t}).join('')==w){toast('⭐ '+list[k][0]);say(praise[k%3],function(){say(wid(list[k][0]),function(){k++;setTimeout(round,300)})})}else{toast('🙈 Try again');say('fb_try');setTimeout(function(){filled.forEach(function(f){f.b.disabled=false});filled=[];draw()},700)}}}});
  document.getElementById('un').onclick=function(){var f=filled.pop();if(f){f.b.disabled=false;draw()}};
  document.getElementById('pl').onclick=function(){say(wid(list[k][0]))};
  document.getElementById('hn').onclick=function(){hint=true;document.getElementById('ht').innerHTML='Look for the <b style="color:'+col+'">'+d.p.replace('_','-')+'</b> sound!';draw();say('p_'+d.id)}}
 round()}
home();
</script></body></html>
