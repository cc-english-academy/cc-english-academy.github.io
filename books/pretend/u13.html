 <section id="script"><h2>📜 The script</h2><div class="chat"><button class="c r" data-a="audio/u13_d0.mp3"><b style="background:#e0607a">Sara</b><span>Excuse me, do you have this T-shirt in a smaller size?</span></button><button class="c " data-a="audio/u13_d1.mp3"><b style="background:#c8644a">Mr. Adam</b><span>Let me check. What size are you?</span></button><button class="c r" data-a="audio/u13_d2.mp3"><b style="background:#e0607a">Sara</b><span>I think I'm a small.</span></button><button class="c " data-a="audio/u13_d3.mp3"><b style="background:#c8644a">Mr. Adam</b><span>Here you are. Would you like to try it on?</span></button><button class="c r" data-a="audio/u13_d4.mp3"><b style="background:#e0607a">Sara</b><span>Yes, please. Where is the fitting room?</span></button><button class="c " data-a="audio/u13_d5.mp3"><b style="background:#c8644a">Mr. Adam</b><span>It's over there, on the left.</span></button><button class="c r" data-a="audio/u13_d6.mp3"><b style="background:#e0607a">Sara</b><span>It fits well! How much is it?</span></button><button class="c " data-a="audio/u13_d7.mp3"><b style="background:#c8644a">Mr. Adam</b><span>It's forty riyals.</span></button><button class="c r" data-a="audio/u13_d8.mp3"><b style="background:#e0607a">Sara</b><span>Great, I'll take it. Can I pay by card?</span></button><button class="c " data-a="audio/u13_d9.mp3"><b style="background:#c8644a">Mr. Adam</b><span>Yes, of course.</span></button></div><button class="all" data-group="chat">▶ Play the script</button><p class="tip">Act it out! Take a role and read with a friend. Then swap.</p></section>
