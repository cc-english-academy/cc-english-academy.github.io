 <section id="script"><h2>📜 The script</h2><div class="chat"><button class="c " data-a="audio/u14_d0.mp3"><b style="background:#2f8f4a">Omar</b><span>Hi Leo! What are you going to do this weekend?</span></button><button class="c r" data-a="audio/u14_d1.mp3"><b style="background:#2b7bd6">Leo</b><span>I'm going to visit my grandparents on Friday.</span></button><button class="c " data-a="audio/u14_d2.mp3"><b style="background:#2f8f4a">Omar</b><span>That sounds nice. What about Saturday?</span></button><button class="c r" data-a="audio/u14_d3.mp3"><b style="background:#2b7bd6">Leo</b><span>I'm not sure yet. Why?</span></button><button class="c " data-a="audio/u14_d4.mp3"><b style="background:#2f8f4a">Omar</b><span>I'm going to the new science museum. Do you want to come?</span></button><button class="c r" data-a="audio/u14_d5.mp3"><b style="background:#2b7bd6">Leo</b><span>I'd love to! What time?</span></button><button class="c " data-a="audio/u14_d6.mp3"><b style="background:#2f8f4a">Omar</b><span>Let's meet at ten o'clock at the entrance.</span></button><button class="c r" data-a="audio/u14_d7.mp3"><b style="background:#2b7bd6">Leo</b><span>Perfect. How are we going to get there?</span></button><button class="c " data-a="audio/u14_d8.mp3"><b style="background:#2f8f4a">Omar</b><span>My dad is going to drive us.</span></button><button class="c r" data-a="audio/u14_d9.mp3"><b style="background:#2b7bd6">Leo</b><span>Great! See you on Saturday!</span></button></div><button class="all" data-group="chat">▶ Play the script</button><p class="tip">Act it out! Take a role and read with a friend. Then swap.</p></section>
