 <section id="script"><h2>📜 The script</h2><div class="chat"><button class="c " data-a="audio/u01_d0.mp3"><b style="background:#e0607a">Sara</b><span>Hi! My name is Sara. What's your name?</span></button><button class="c r" data-a="audio/u01_d1.mp3"><b style="background:#2b7bd6">Leo</b><span>Hello, Sara! I'm Leo.</span></button><button class="c " data-a="audio/u01_d2.mp3"><b style="background:#e0607a">Sara</b><span>Nice to meet you, Leo.</span></button><button class="c r" data-a="audio/u01_d3.mp3"><b style="background:#2b7bd6">Leo</b><span>Nice to meet you too. How old are you?</span></button><button class="c " data-a="audio/u01_d4.mp3"><b style="background:#e0607a">Sara</b><span>I'm eight. And you?</span></button><button class="c r" data-a="audio/u01_d5.mp3"><b style="background:#2b7bd6">Leo</b><span>I'm nine. Where are you from?</span></button><button class="c " data-a="audio/u01_d6.mp3"><b style="background:#e0607a">Sara</b><span>I'm from Saudi Arabia. Where are you from?</span></button><button class="c r" data-a="audio/u01_d7.mp3"><b style="background:#2b7bd6">Leo</b><span>I'm from Canada. Do you want to play?</span></button><button class="c " data-a="audio/u01_d8.mp3"><b style="background:#e0607a">Sara</b><span>Yes, please! Let's play football.</span></button></div><button class="all" data-group="chat">▶ Play the script</button><p class="tip">Act it out! Take a role and read with a friend. Then swap.</p></section>
