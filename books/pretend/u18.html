 <section id="script"><h2>📜 The script</h2><div class="chat"><button class="c " data-a="audio/u18_d0.mp3"><b style="background:#1f3a6b">Officer Ken</b><span>Good morning. Can I see your passport and ticket, please?</span></button><button class="c r" data-a="audio/u18_d1.mp3"><b style="background:#e0607a">Sara</b><span>Sure, here you are.</span></button><button class="c " data-a="audio/u18_d2.mp3"><b style="background:#1f3a6b">Officer Ken</b><span>Thank you. Are you checking in any bags today?</span></button><button class="c r" data-a="audio/u18_d3.mp3"><b style="background:#e0607a">Sara</b><span>Yes, just this suitcase.</span></button><button class="c " data-a="audio/u18_d4.mp3"><b style="background:#1f3a6b">Officer Ken</b><span>Could you put it on the scale, please? That's fine, it's twenty kilos.</span></button><button class="c r" data-a="audio/u18_d5.mp3"><b style="background:#e0607a">Sara</b><span>Great. Could I have a window seat, please?</span></button><button class="c " data-a="audio/u18_d6.mp3"><b style="background:#1f3a6b">Officer Ken</b><span>Let me see. Yes, you're in seat 14A, by the window.</span></button><button class="c r" data-a="audio/u18_d7.mp3"><b style="background:#e0607a">Sara</b><span>Perfect. What time does boarding start?</span></button><button class="c " data-a="audio/u18_d8.mp3"><b style="background:#1f3a6b">Officer Ken</b><span>Boarding starts at 9:40 at Gate 22. Please be there thirty minutes before.</span></button><button class="c r" data-a="audio/u18_d9.mp3"><b style="background:#e0607a">Sara</b><span>Thank you. Has the flight been delayed?</span></button><button class="c " data-a="audio/u18_d10.mp3"><b style="background:#1f3a6b">Officer Ken</b><span>No, it's on time. Have a pleasant flight!</span></button></div><button class="all" data-group="chat">▶ Play the script</button><p class="tip">Act it out! Take a role and read with a friend. Then swap.</p></section>
