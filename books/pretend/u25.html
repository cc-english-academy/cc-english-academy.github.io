 <section id="words"><h2>🎬 Scene words</h2><div class="words"><button class="w" data-a="audio/u25_w0.mp3"><img class="" src="../img/1f4dd.webp" alt="" loading="lazy"><span>homework</span></button><button class="w" data-a="audio/u25_w1.mp3"><img class="" src="../img/1f3eb.webp" alt="" loading="lazy"><span>school</span></button><button class="w" data-a="audio/u25_w2.mp3"><img class="" src="../img/23f3.webp" alt="" loading="lazy"><span>six hours</span></button><button class="w" data-a="audio/u25_w3.mp3"><img class="" src="../img/1f60c.webp" alt="" loading="lazy"><span>rest</span></button><button class="w" data-a="audio/u25_w4.mp3"><img class="" src="../img/1f9e0.webp" alt="" loading="lazy"><span>practise</span></button><button class="w" data-a="audio/u25_w5.mp3"><img class="" src="../img/1f91d.webp" alt="" loading="lazy"><span>agree</span></button><button class="w" data-a="audio/u25_w6.mp3"><img class="" src="../img/23f1-fe0f.webp" alt="" loading="lazy"><span>twenty minutes</span></button><button class="w" data-a="audio/u25_w7.mp3"><img class="" src="../img/1f469-200d-1f3eb.webp" alt="" loading="lazy"><span>teacher</span></button></div><button class="all" data-group="words">▶ Play all words</button><p class="tip">🎯 Mission: Agree, disagree and find a compromise.</p></section>
 <section id="script"><h2>📜 The script</h2><div class="chat"><button class="c " data-a="audio/u25_d0.mp3"><b style="background:#2b7bd6">Leo</b><span>I think schools shouldn't give homework at all.</span></button><button class="c r" data-a="audio/u25_d1.mp3"><b style="background:#e0607a">Sara</b><span>Really? Why do you think that?</span></button><button class="c " data-a="audio/u25_d2.mp3"><b style="background:#2b7bd6">Leo</b><span>Because we already study for six hours a day. We need time to rest and play.</span></button><button class="c r" data-a="audio/u25_d3.mp3"><b style="background:#e0607a">Sara</b><span>I see your point, but homework helps us practise what we've learned.</span></button><button class="c " data-a="audio/u25_d4.mp3"><b style="background:#2b7bd6">Leo</b><span>That's true, but sometimes there's too much of it.</span></button><button class="c r" data-a="audio/u25_d5.mp3"><b style="background:#e0607a">Sara</b><span>I agree with you there. Maybe teachers could give less homework.</span></button><button class="c " data-a="audio/u25_d6.mp3"><b style="background:#2b7bd6">Leo</b><span>Exactly. Twenty minutes a day would be enough.</span></button><button class="c r" data-a="audio/u25_d7.mp3"><b style="background:#e0607a">Sara</b><span>If homework were shorter, more students would actually do it.</span></button><button class="c " data-a="audio/u25_d8.mp3"><b style="background:#2b7bd6">Leo</b><span>So we both agree. A little homework is fine, but not too much.</span></button><button class="c r" data-a="audio/u25_d9.mp3"><b style="background:#e0607a">Sara</b><span>Yes! Let's suggest it to Ms. Lina.</span></button></div><button class="all" data-group="chat">▶ Play the script</button><p class="tip">Act it out! Take a role and read with a friend. Then swap.</p></section>
