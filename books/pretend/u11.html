 <section id="script"><h2>📜 The script</h2><div class="chat"><button class="c " data-a="audio/u11_d0.mp3"><b style="background:#2f86b8">Dr. Noor</b><span>Hello, Leo. What's the matter?</span></button><button class="c r" data-a="audio/u11_d1.mp3"><b style="background:#2b7bd6">Leo</b><span>I don't feel well. I have a headache.</span></button><button class="c " data-a="audio/u11_d2.mp3"><b style="background:#2f86b8">Dr. Noor</b><span>I'm sorry to hear that. Do you have a fever?</span></button><button class="c r" data-a="audio/u11_d3.mp3"><b style="background:#2b7bd6">Leo</b><span>Yes, I think so. I feel hot.</span></button><button class="c " data-a="audio/u11_d4.mp3"><b style="background:#2f86b8">Dr. Noor</b><span>Let me check. Yes, you have a small fever.</span></button><button class="c r" data-a="audio/u11_d5.mp3"><b style="background:#2b7bd6">Leo</b><span>What should I do?</span></button><button class="c " data-a="audio/u11_d6.mp3"><b style="background:#2f86b8">Dr. Noor</b><span>You should rest and drink lots of water.</span></button><button class="c r" data-a="audio/u11_d7.mp3"><b style="background:#2b7bd6">Leo</b><span>Should I take any medicine?</span></button><button class="c " data-a="audio/u11_d8.mp3"><b style="background:#2f86b8">Dr. Noor</b><span>Yes, take this medicine twice a day.</span></button><button class="c r" data-a="audio/u11_d9.mp3"><b style="background:#2b7bd6">Leo</b><span>Thank you, Doctor.</span></button><button class="c " data-a="audio/u11_d10.mp3"><b style="background:#2f86b8">Dr. Noor</b><span>You're welcome. Get well soon!</span></button></div><button class="all" data-group="chat">▶ Play the script</button><p class="tip">Act it out! Take a role and read with a friend. Then swap.</p></section>
