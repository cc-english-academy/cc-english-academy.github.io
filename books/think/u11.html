 <section id="look"><h2>🔍 Look and think</h2><div class="chat qa"><button class="c" data-a="audio/u11_q0.mp3"><b style="background:#6b1d2b">Q</b><span>What animals can you see?</span></button><button class="c r" data-a="audio/u11_a0.mp3"><b style="background:#2b7bd6">A</b><span>A giraffe, an elephant and a zebra.</span></button><button class="c" data-a="audio/u11_q1.mp3"><b style="background:#6b1d2b">Q</b><span>Which animal is the tallest?</span></button><button class="c r" data-a="audio/u11_a1.mp3"><b style="background:#2b7bd6">A</b><span>The giraffe.</span></button><button class="c" data-a="audio/u11_q2.mp3"><b style="background:#6b1d2b">Q</b><span>What colour is the elephant?</span></button><button class="c r" data-a="audio/u11_a2.mp3"><b style="background:#2b7bd6">A</b><span>It's grey.</span></button><button class="c" data-a="audio/u11_q3.mp3"><b style="background:#6b1d2b">Q</b><span>Has the zebra got stripes?</span></button><button class="c r" data-a="audio/u11_a3.mp3"><b style="background:#2b7bd6">A</b><span>Yes, it has.</span></button><button class="c" data-a="audio/u11_q4.mp3"><b style="background:#6b1d2b">Q</b><span>Is there a palm tree?</span></button><button class="c r" data-a="audio/u11_a4.mp3"><b style="background:#2b7bd6">A</b><span>Yes, there is.</span></button><button class="c" data-a="audio/u11_q5.mp3"><b style="background:#6b1d2b">Q</b><span>Who is with Omar?</span></button><button class="c r" data-a="audio/u11_a5.mp3"><b style="background:#2b7bd6">A</b><span>Sara.</span></button></div><button class="all" data-group="qa">▶ Play all</button></section>
 <section id="say"><h2>🗣️ Talk about the picture</h2><div class="says"><button class="s" data-a="audio/u11_d0.mp3"><img class="" src="../img/1f992.webp" alt="" loading="lazy"><span>Omar and Sara are at the zoo.</span><i>🔊</i></button><button class="s" data-a="audio/u11_d1.mp3"><img class="" src="../img/1f992.webp" alt="" loading="lazy"><span>There is a giraffe.</span><i>🔊</i></button><button class="s" data-a="audio/u11_d2.mp3"><img class="" src="../img/1f992.webp" alt="" loading="lazy"><span>The giraffe is very tall.</span><i>🔊</i></button><button class="s" data-a="audio/u11_d3.mp3"><img class="" src="../img/1f992.webp" alt="" loading="lazy"><span>There is a big grey elephant.</span><i>🔊</i></button><button class="s" data-a="audio/u11_d4.mp3"><img class="" src="../img/1f992.webp" alt="" loading="lazy"><span>The zebra is black and white.</span><i>🔊</i></button><button class="s" data-a="audio/u11_d5.mp3"><img class="" src="../img/1f992.webp" alt="" loading="lazy"><span>They love the animals.</span><i>🔊</i></button></div><button class="all" data-group="says">▶ Play all sentences</button></section>
 <section id="patterns"><h2>🧩 Sentence patterns</h2><h3>The ___ is bigger than the ___.</h3><div class="says x0"><button class="s" data-a="audio/u11_x0_0.mp3"><img class="" src="../img/1f418.webp" alt="" loading="lazy"><span>The elephant is bigger than the zebra.</span><i>🔊</i></button><button class="s" data-a="audio/u11_x0_1.mp3"><img class="" src="../img/1f992.webp" alt="" loading="lazy"><span>The giraffe is taller than the man.</span><i>🔊</i></button><button class="s" data-a="audio/u11_x0_2.mp3"><img class="" src="../img/1f406.webp" alt="" loading="lazy"><span>The cheetah is faster than the lion.</span><i>🔊</i></button><button class="s" data-a="audio/u11_x0_3.mp3"><img class="" src="../img/1f422.webp" alt="" loading="lazy"><span>The turtle is slower than the rabbit.</span><i>🔊</i></button></div><button class="all" data-group="x0">▶ Play pattern 1</button><h3>It's got a long ___.</h3><div class="says x1"><button class="s" data-a="audio/u11_x1_0.mp3"><img class="" src="../img/1f992.webp" alt="" loading="lazy"><span>It's got a long neck.</span><i>🔊</i></button><button class="s" data-a="audio/u11_x1_1.mp3"><img class="" src="../img/1f418.webp" alt="" loading="lazy"><span>It's got a long trunk.</span><i>🔊</i></button><button class="s" data-a="audio/u11_x1_2.mp3"><img class="" src="../img/1f412.webp" alt="" loading="lazy"><span>It's got a long tail.</span><i>🔊</i></button><button class="s" data-a="audio/u11_x1_3.mp3"><img class="" src="../img/1f40d.webp" alt="" loading="lazy"><span>It's got a long body.</span><i>🔊</i></button></div><button class="all" data-group="x1">▶ Play pattern 2</button></section><nav class="pn"><a class="nav" href="u10.html">‹ At the Airport</a><a class="nav home" href="./">All units</a><a class="nav" href="u12.html">In the Kitchen ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
