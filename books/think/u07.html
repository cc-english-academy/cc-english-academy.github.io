 <section id="look"><h2>🔍 Look and think</h2><div class="chat qa"><button class="c" data-a="audio/u07_q0.mp3"><b style="background:#6b1d2b">Q</b><span>Who is the waiter?</span></button><button class="c r" data-a="audio/u07_a0.mp3"><b style="background:#2b7bd6">A</b><span>Mr. Adam.</span></button><button class="c" data-a="audio/u07_q1.mp3"><b style="background:#6b1d2b">Q</b><span>How much is a burger?</span></button><button class="c r" data-a="audio/u07_a1.mp3"><b style="background:#2b7bd6">A</b><span>It's twenty-five riyals.</span></button><button class="c" data-a="audio/u07_q2.mp3"><b style="background:#6b1d2b">Q</b><span>How much is a juice?</span></button><button class="c r" data-a="audio/u07_a2.mp3"><b style="background:#2b7bd6">A</b><span>It's eight riyals.</span></button><button class="c" data-a="audio/u07_q3.mp3"><b style="background:#6b1d2b">Q</b><span>What's on the table?</span></button><button class="c r" data-a="audio/u07_a3.mp3"><b style="background:#2b7bd6">A</b><span>A drink.</span></button><button class="c" data-a="audio/u07_q4.mp3"><b style="background:#6b1d2b">Q</b><span>Is there a menu?</span></button><button class="c r" data-a="audio/u07_a4.mp3"><b style="background:#2b7bd6">A</b><span>Yes, there is.</span></button><button class="c" data-a="audio/u07_q5.mp3"><b style="background:#6b1d2b">Q</b><span>What does Sara want?</span></button><button class="c r" data-a="audio/u07_a5.mp3"><b style="background:#2b7bd6">A</b><span>She wants a juice.</span></button></div><button class="all" data-group="qa">▶ Play all</button></section>
 <section id="say"><h2>🗣️ Talk about the picture</h2><div class="says"><button class="s" data-a="audio/u07_d0.mp3"><img class="" src="../img/2615.webp" alt="" loading="lazy"><span>Sara is at a café.</span><i>🔊</i></button><button class="s" data-a="audio/u07_d1.mp3"><img class="" src="../img/2615.webp" alt="" loading="lazy"><span>Mr. Adam is the waiter.</span><i>🔊</i></button><button class="s" data-a="audio/u07_d2.mp3"><img class="" src="../img/2615.webp" alt="" loading="lazy"><span>There is a menu on the wall.</span><i>🔊</i></button><button class="s" data-a="audio/u07_d3.mp3"><img class="" src="../img/2615.webp" alt="" loading="lazy"><span>A burger is twenty-five riyals.</span><i>🔊</i></button><button class="s" data-a="audio/u07_d4.mp3"><img class="" src="../img/2615.webp" alt="" loading="lazy"><span>A juice is eight riyals.</span><i>🔊</i></button><button class="s" data-a="audio/u07_d5.mp3"><img class="" src="../img/2615.webp" alt="" loading="lazy"><span>Sara wants a burger and a juice.</span><i>🔊</i></button></div><button class="all" data-group="says">▶ Play all sentences</button></section>
 <section id="patterns"><h2>🧩 Sentence patterns</h2><h3>I'd like a ___, please.</h3><div class="says x0"><button class="s" data-a="audio/u07_x0_0.mp3"><img class="" src="../img/1f354.webp" alt="" loading="lazy"><span>I'd like a burger, please.</span><i>🔊</i></button><button class="s" data-a="audio/u07_x0_1.mp3"><img class="" src="../img/1f355.webp" alt="" loading="lazy"><span>I'd like a pizza, please.</span><i>🔊</i></button><button class="s" data-a="audio/u07_x0_2.mp3"><img class="" src="../img/1f957.webp" alt="" loading="lazy"><span>I'd like a salad, please.</span><i>🔊</i></button><button class="s" data-a="audio/u07_x0_3.mp3"><img class="" src="../img/1f366.webp" alt="" loading="lazy"><span>I'd like an ice cream, please.</span><i>🔊</i></button></div><button class="all" data-group="x0">▶ Play pattern 1</button><h3>Would you like some ___?</h3><div class="says x1"><button class="s" data-a="audio/u07_x1_0.mp3"><img class="" src="../img/1f9c3.webp" alt="" loading="lazy"><span>Would you like some juice?</span><i>🔊</i></button><button class="s" data-a="audio/u07_x1_1.mp3"><img class="" src="../img/1f4a7.webp" alt="" loading="lazy"><span>Would you like some water?</span><i>🔊</i></button><button class="s" data-a="audio/u07_x1_2.mp3"><img class="" src="../img/1f35f.webp" alt="" loading="lazy"><span>Would you like some chips?</span><i>🔊</i></button><button class="s" data-a="audio/u07_x1_3.mp3"><img class="" src="../img/1f370.webp" alt="" loading="lazy"><span>Would you like some cake?</span><i>🔊</i></button></div><button class="all" data-group="x1">▶ Play pattern 2</button></section><nav class="pn"><a class="nav" href="u06.html">‹ The Party</a><a class="nav home" href="./">All units</a><a class="nav" href="u08.html">At the Clinic ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
