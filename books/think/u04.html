 <section id="look"><h2>🔍 Look and think</h2><div class="chat qa"><button class="c" data-a="audio/u04_q0.mp3"><b style="background:#6b1d2b">Q</b><span>What clothes can you see?</span></button><button class="c r" data-a="audio/u04_a0.mp3"><b style="background:#2b7bd6">A</b><span>T-shirts, dresses, jeans and a jacket.</span></button><button class="c" data-a="audio/u04_q1.mp3"><b style="background:#6b1d2b">Q</b><span>How many dresses are there?</span></button><button class="c r" data-a="audio/u04_a1.mp3"><b style="background:#2b7bd6">A</b><span>There are two dresses.</span></button><button class="c" data-a="audio/u04_q2.mp3"><b style="background:#6b1d2b">Q</b><span>Is there a mirror?</span></button><button class="c r" data-a="audio/u04_a2.mp3"><b style="background:#2b7bd6">A</b><span>Yes, there is.</span></button><button class="c" data-a="audio/u04_q3.mp3"><b style="background:#6b1d2b">Q</b><span>What colour is Mia's top?</span></button><button class="c r" data-a="audio/u04_a3.mp3"><b style="background:#2b7bd6">A</b><span>It's purple.</span></button><button class="c" data-a="audio/u04_q4.mp3"><b style="background:#6b1d2b">Q</b><span>Are there any shoes?</span></button><button class="c r" data-a="audio/u04_a4.mp3"><b style="background:#2b7bd6">A</b><span>Yes, there are.</span></button><button class="c" data-a="audio/u04_q5.mp3"><b style="background:#6b1d2b">Q</b><span>What is Sara wearing on her head?</span></button><button class="c r" data-a="audio/u04_a5.mp3"><b style="background:#2b7bd6">A</b><span>A pink hijab.</span></button></div><button class="all" data-group="qa">▶ Play all</button></section>
 <section id="say"><h2>🗣️ Talk about the picture</h2><div class="says"><button class="s" data-a="audio/u04_d0.mp3"><img class="" src="../img/1f457.webp" alt="" loading="lazy"><span>Mia and Sara are in a clothes shop.</span><i>🔊</i></button><button class="s" data-a="audio/u04_d1.mp3"><img class="" src="../img/1f457.webp" alt="" loading="lazy"><span>There are T-shirts and dresses.</span><i>🔊</i></button><button class="s" data-a="audio/u04_d2.mp3"><img class="" src="../img/1f457.webp" alt="" loading="lazy"><span>There are shoes and a bag.</span><i>🔊</i></button><button class="s" data-a="audio/u04_d3.mp3"><img class="" src="../img/1f457.webp" alt="" loading="lazy"><span>There is a big mirror.</span><i>🔊</i></button><button class="s" data-a="audio/u04_d4.mp3"><img class="" src="../img/1f457.webp" alt="" loading="lazy"><span>Mia likes the dress.</span><i>🔊</i></button><button class="s" data-a="audio/u04_d5.mp3"><img class="" src="../img/1f457.webp" alt="" loading="lazy"><span>Sara wants a new scarf.</span><i>🔊</i></button></div><button class="all" data-group="says">▶ Play all sentences</button></section>
 <section id="patterns"><h2>🧩 Sentence patterns</h2><h3>I'm wearing a ___.</h3><div class="says x0"><button class="s" data-a="audio/u04_x0_0.mp3"><img class="" src="../img/1f455.webp" alt="" loading="lazy"><span>I'm wearing a T-shirt.</span><i>🔊</i></button><button class="s" data-a="audio/u04_x0_1.mp3"><img class="" src="../img/1f457.webp" alt="" loading="lazy"><span>I'm wearing a dress.</span><i>🔊</i></button><button class="s" data-a="audio/u04_x0_2.mp3"><img class="" src="../img/1f9e2.webp" alt="" loading="lazy"><span>I'm wearing a cap.</span><i>🔊</i></button><button class="s" data-a="audio/u04_x0_3.mp3"><img class="" src="../img/1f9e5.webp" alt="" loading="lazy"><span>I'm wearing a jacket.</span><i>🔊</i></button></div><button class="all" data-group="x0">▶ Play pattern 1</button><h3>Can I try on the ___?</h3><div class="says x1"><button class="s" data-a="audio/u04_x1_0.mp3"><img class="" src="../img/1f45f.webp" alt="" loading="lazy"><span>Can I try on the trainers?</span><i>🔊</i></button><button class="s" data-a="audio/u04_x1_1.mp3"><img class="" src="../img/1f456.webp" alt="" loading="lazy"><span>Can I try on the jeans?</span><i>🔊</i></button><button class="s" data-a="audio/u04_x1_2.mp3"><img class="" src="../img/1f9e3.webp" alt="" loading="lazy"><span>Can I try on the scarf?</span><i>🔊</i></button><button class="s" data-a="audio/u04_x1_3.mp3"><img class="" src="../img/1f457.webp" alt="" loading="lazy"><span>Can I try on the dress?</span><i>🔊</i></button></div><button class="all" data-group="x1">▶ Play pattern 2</button></section><nav class="pn"><a class="nav" href="u03.html">‹ At the Shop</a><a class="nav home" href="./">All units</a><a class="nav" href="u05.html">In the Living Room ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
