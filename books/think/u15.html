 <section id="patterns"><h2>🧩 Sentence patterns</h2><h3>He works ___.</h3><div class="says x0"><button class="s" data-a="audio/u15_x0_0.mp3"><img class="" src="../img/1f5a5-fe0f.webp" alt="" loading="lazy"><span>He works on a computer.</span><i>🔊</i></button><button class="s" data-a="audio/u15_x0_1.mp3"><img class="" src="../img/1f3e5.webp" alt="" loading="lazy"><span>He works in a hospital.</span><i>🔊</i></button><button class="s" data-a="audio/u15_x0_2.mp3"><img class="" src="../img/1f3eb.webp" alt="" loading="lazy"><span>He works in a school.</span><i>🔊</i></button><button class="s" data-a="audio/u15_x0_3.mp3"><img class="" src="../img/2708-fe0f.webp" alt="" loading="lazy"><span>He works on a plane.</span><i>🔊</i></button></div><button class="all" data-group="x0">▶ Play pattern 1</button><h3>When I grow up, I want to be a ___.</h3><div class="says x1"><button class="s" data-a="audio/u15_x1_0.mp3"><img class="" src="../img/1f9d1-200d-2695-fe0f.webp" alt="" loading="lazy"><span>When I grow up, I want to be a doctor.</span><i>🔊</i></button><button class="s" data-a="audio/u15_x1_1.mp3"><img class="" src="../img/1f9d1-200d-1f680.webp" alt="" loading="lazy"><span>When I grow up, I want to be an astronaut.</span><i>🔊</i></button><button class="s" data-a="audio/u15_x1_2.mp3"><img class="" src="../img/1f9d1-200d-1f3eb.webp" alt="" loading="lazy"><span>When I grow up, I want to be a teacher.</span><i>🔊</i></button><button class="s" data-a="audio/u15_x1_3.mp3"><img class="" src="../img/1f9d1-200d-1f373.webp" alt="" loading="lazy"><span>When I grow up, I want to be a chef.</span><i>🔊</i></button></div><button class="all" data-group="x1">▶ Play pattern 2</button></section><nav class="pn"><a class="nav" href="u14.html">‹ Sports Day</a><a class="nav home" href="./">All units</a><a class="nav" href="u16.html">At the Hotel ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
