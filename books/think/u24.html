 <section id="say"><h2>🗣️ Talk about the picture</h2><div class="says"><button class="s" data-a="audio/u24_d0.mp3"><img class="" src="../img/1f381.webp" alt="" loading="lazy"><span>It's Grandma's birthday.</span><i>🔊</i></button><button class="s" data-a="audio/u24_d1.mp3"><img class="" src="../img/1f381.webp" alt="" loading="lazy"><span>Sara has a surprise for her.</span><i>🔊</i></button><button class="s" data-a="audio/u24_d2.mp3"><img class="" src="../img/1f381.webp" alt="" loading="lazy"><span>There are balloons and a cake.</span><i>🔊</i></button><button class="s" data-a="audio/u24_d3.mp3"><img class="" src="../img/1f381.webp" alt="" loading="lazy"><span>Sara gives Grandma a present.</span><i>🔊</i></button><button class="s" data-a="audio/u24_d4.mp3"><img class="" src="../img/1f381.webp" alt="" loading="lazy"><span>Grandma is very surprised.</span><i>🔊</i></button><button class="s" data-a="audio/u24_d5.mp3"><img class="" src="../img/1f381.webp" alt="" loading="lazy"><span>She gives Sara a big hug.</span><i>🔊</i></button></div><button class="all" data-group="says">▶ Play all sentences</button></section>
 <section id="patterns"><h2>🧩 Sentence patterns</h2><h3>This is for you. I made it ___.</h3><div class="says x0"><button class="s" data-a="audio/u24_x0_0.mp3"><img class="" src="../img/1f381.webp" alt="" loading="lazy"><span>This is for you. I made it myself.</span><i>🔊</i></button><button class="s" data-a="audio/u24_x0_1.mp3"><img class="" src="../img/1f48c.webp" alt="" loading="lazy"><span>This is a card for you.</span><i>🔊</i></button><button class="s" data-a="audio/u24_x0_2.mp3"><img class="" src="../img/1f337.webp" alt="" loading="lazy"><span>These flowers are for you.</span><i>🔊</i></button><button class="s" data-a="audio/u24_x0_3.mp3"><img class="" src="../img/1f370.webp" alt="" loading="lazy"><span>This cake is for you.</span><i>🔊</i></button></div><button class="all" data-group="x0">▶ Play pattern 1</button><h3>How old are you? I'm ___.</h3><div class="says x1"><button class="s" data-a="audio/u24_x1_0.mp3"><img class="" src="../img/1f382.webp" alt="" loading="lazy"><span>How old are you? I'm seven.</span><i>🔊</i></button><button class="s" data-a="audio/u24_x1_1.mp3"><img class="" src="../img/1f56f-fe0f.webp" alt="" loading="lazy"><span>How old are you? I'm eight.</span><i>🔊</i></button><button class="s" data-a="audio/u24_x1_2.mp3"><img class="" src="../img/1f9c1.webp" alt="" loading="lazy"><span>How old are you? I'm nine.</span><i>🔊</i></button><button class="s" data-a="audio/u24_x1_3.mp3"><img class="" src="../img/1f388.webp" alt="" loading="lazy"><span>How old are you? I'm ten.</span><i>🔊</i></button></div><button class="all" data-group="x1">▶ Play pattern 2</button></section><nav class="pn"><a class="nav" href="u23.html">‹ My Shopping List</a><a class="nav home" href="./">All units</a><a class="nav" href="u25.html">Holiday Plans ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
