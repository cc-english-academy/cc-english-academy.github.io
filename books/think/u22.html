<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Picnic · My English World</title><link rel="stylesheet" href="../assets/listen.css"><link rel="icon" href="/assets/img/favicon-32.png"></head><body><header class="top"><a href="./" class="brand"><img src="../assets/logo.png" alt="CODECADEMY"><span><b>My English World</b><small>Book 5 · Think &amp; Say</small></span></a></header><main><section class="hero"><img class="hi" src="../img/1f9fa.webp" alt="" loading="lazy"><div><span class="pill">Unit 22</span><h1>A Picnic</h1><p>Tap any picture or sentence to listen.</p></div></section>
 <section id="look"><h2>🔍 Look and think</h2><div class="chat qa"><button class="c" data-a="audio/u22_q0.mp3"><b style="background:#6b1d2b">Q</b><span>Where are Dad and Leo?</span></button><button class="c r" data-a="audio/u22_a0.mp3"><b style="background:#2b7bd6">A</b><span>They're in the park.</span></button><button class="c" data-a="audio/u22_q1.mp3"><b style="background:#6b1d2b">Q</b><span>What are they having?</span></button><button class="c r" data-a="audio/u22_a1.mp3"><b style="background:#2b7bd6">A</b><span>A picnic.</span></button><button class="c" data-a="audio/u22_q2.mp3"><b style="background:#6b1d2b">Q</b><span>What food would you take?</span></button><button class="c r" data-a="audio/u22_a2.mp3"><b style="background:#2b7bd6">A</b><span>Sandwiches and fruit.</span></button><button class="c" data-a="audio/u22_q3.mp3"><b style="background:#6b1d2b">Q</b><span>Is there a ball?</span></button><button class="c r" data-a="audio/u22_a3.mp3"><b style="background:#2b7bd6">A</b><span>Yes, there is.</span></button><button class="c" data-a="audio/u22_q4.mp3"><b style="background:#6b1d2b">Q</b><span>How many clouds are there?</span></button><button class="c r" data-a="audio/u22_a4.mp3"><b style="background:#2b7bd6">A</b><span>There are two clouds.</span></button><button class="c" data-a="audio/u22_q5.mp3"><b style="background:#6b1d2b">Q</b><span>Is it a nice day?</span></button><button class="c r" data-a="audio/u22_a5.mp3"><b style="background:#2b7bd6">A</b><span>Yes, it is.</span></button></div><button class="all" data-group="qa">▶ Play all</button></section>
 <section id="say"><h2>🗣️ Talk about the picture</h2><div class="says"><button class="s" data-a="audio/u22_d0.mp3"><img class="" src="../img/1f9fa.webp" alt="" loading="lazy"><span>Dad and Leo are having a picnic.</span><i>🔊</i></button><button class="s" data-a="audio/u22_d1.mp3"><img class="" src="../img/1f9fa.webp" alt="" loading="lazy"><span>They are in the park.</span><i>🔊</i></button><button class="s" data-a="audio/u22_d2.mp3"><img class="" src="../img/1f9fa.webp" alt="" loading="lazy"><span>It's a lovely day.</span><i>🔊</i></button><button class="s" data-a="audio/u22_d3.mp3"><img class="" src="../img/1f9fa.webp" alt="" loading="lazy"><span>They have got sandwiches and fruit.</span><i>🔊</i></button><button class="s" data-a="audio/u22_d4.mp3"><img class="" src="../img/1f9fa.webp" alt="" loading="lazy"><span>After lunch, they play football.</span><i>🔊</i></button><button class="s" data-a="audio/u22_d5.mp3"><img class="" src="../img/1f9fa.webp" alt="" loading="lazy"><span>Leo loves picnics!</span><i>🔊</i></button></div><button class="all" data-group="says">▶ Play all sentences</button></section>
 <section id="patterns"><h2>🧩 Sentence patterns</h2><h3>We need some ___.</h3><div class="says x0"><button class="s" data-a="audio/u22_x0_0.mp3"><img class="" src="../img/1f96a.webp" alt="" loading="lazy"><span>We need some sandwiches.</span><i>🔊</i></button><button class="s" data-a="audio/u22_x0_1.mp3"><img class="" src="../img/1f347.webp" alt="" loading="lazy"><span>We need some grapes.</span><i>🔊</i></button><button class="s" data-a="audio/u22_x0_2.mp3"><img class="" src="../img/1f9c3.webp" alt="" loading="lazy"><span>We need some juice.</span><i>🔊</i></button><button class="s" data-a="audio/u22_x0_3.mp3"><img class="" src="../img/1f36a.webp" alt="" loading="lazy"><span>We need some cookies.</span><i>🔊</i></button></div><button class="all" data-group="x0">▶ Play pattern 1</button><h3>First ___, then ___.</h3><div class="says x1"><button class="s" data-a="audio/u22_x1_0.mp3"><img class="" src="../img/1f96a.webp" alt="" loading="lazy"><span>First we eat, then we play.</span><i>🔊</i></button><button class="s" data-a="audio/u22_x1_1.mp3"><img class="" src="../img/1f9fc.webp" alt="" loading="lazy"><span>First wash your hands, then eat.</span><i>🔊</i></button><button class="s" data-a="audio/u22_x1_2.mp3"><img class="" src="../img/1f4dd.webp" alt="" loading="lazy"><span>First do your homework, then play.</span><i>🔊</i></button><button class="s" data-a="audio/u22_x1_3.mp3"><img class="" src="../img/1faa5.webp" alt="" loading="lazy"><span>First brush your teeth, then sleep.</span><i>🔊</i></button></div><button class="all" data-group="x1">▶ Play pattern 2</button></section><nav class="pn"><a class="nav" href="u21.html">‹ A Rainy Day</a><a class="nav home" href="./">All units</a><a class="nav" href="u23.html">My Shopping List ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
