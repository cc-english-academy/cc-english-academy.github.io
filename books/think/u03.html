 <section id="look"><h2>🔍 Look and think</h2><div class="chat qa"><button class="c" data-a="audio/u03_q0.mp3"><b style="background:#6b1d2b">Q</b><span>What fruit can you see?</span></button><button class="c r" data-a="audio/u03_a0.mp3"><b style="background:#2b7bd6">A</b><span>Apples, bananas, oranges and grapes.</span></button><button class="c" data-a="audio/u03_q1.mp3"><b style="background:#6b1d2b">Q</b><span>Is there any bread?</span></button><button class="c r" data-a="audio/u03_a1.mp3"><b style="background:#2b7bd6">A</b><span>Yes, there is.</span></button><button class="c" data-a="audio/u03_q2.mp3"><b style="background:#6b1d2b">Q</b><span>Where is the trolley?</span></button><button class="c r" data-a="audio/u03_a2.mp3"><b style="background:#2b7bd6">A</b><span>It's next to the shelves.</span></button><button class="c" data-a="audio/u03_q3.mp3"><b style="background:#6b1d2b">Q</b><span>What colour are the bananas?</span></button><button class="c r" data-a="audio/u03_a3.mp3"><b style="background:#2b7bd6">A</b><span>They're yellow.</span></button><button class="c" data-a="audio/u03_q4.mp3"><b style="background:#6b1d2b">Q</b><span>Is there any milk?</span></button><button class="c r" data-a="audio/u03_a4.mp3"><b style="background:#2b7bd6">A</b><span>Yes, there is.</span></button><button class="c" data-a="audio/u03_q5.mp3"><b style="background:#6b1d2b">Q</b><span>Who is with Mia?</span></button><button class="c r" data-a="audio/u03_a5.mp3"><b style="background:#2b7bd6">A</b><span>Her mum.</span></button></div><button class="all" data-group="qa">▶ Play all</button></section>
 <section id="say"><h2>🗣️ Talk about the picture</h2><div class="says"><button class="s" data-a="audio/u03_d0.mp3"><img class="" src="../img/1f6d2.webp" alt="" loading="lazy"><span>Mia and Mum are at the shop.</span><i>🔊</i></button><button class="s" data-a="audio/u03_d1.mp3"><img class="" src="../img/1f6d2.webp" alt="" loading="lazy"><span>There is a lot of fruit.</span><i>🔊</i></button><button class="s" data-a="audio/u03_d2.mp3"><img class="" src="../img/1f6d2.webp" alt="" loading="lazy"><span>There are apples and bananas.</span><i>🔊</i></button><button class="s" data-a="audio/u03_d3.mp3"><img class="" src="../img/1f6d2.webp" alt="" loading="lazy"><span>There is some bread and cheese.</span><i>🔊</i></button><button class="s" data-a="audio/u03_d4.mp3"><img class="" src="../img/1f6d2.webp" alt="" loading="lazy"><span>There is a trolley.</span><i>🔊</i></button><button class="s" data-a="audio/u03_d5.mp3"><img class="" src="../img/1f6d2.webp" alt="" loading="lazy"><span>Mum wants some milk.</span><i>🔊</i></button></div><button class="all" data-group="says">▶ Play all sentences</button></section>
 <section id="patterns"><h2>🧩 Sentence patterns</h2><h3>Can I have some ___, please?</h3><div class="says x0"><button class="s" data-a="audio/u03_x0_0.mp3"><img class="" src="../img/1f34e.webp" alt="" loading="lazy"><span>Can I have some apples, please?</span><i>🔊</i></button><button class="s" data-a="audio/u03_x0_1.mp3"><img class="" src="../img/1f35e.webp" alt="" loading="lazy"><span>Can I have some bread, please?</span><i>🔊</i></button><button class="s" data-a="audio/u03_x0_2.mp3"><img class="" src="../img/1f95b.webp" alt="" loading="lazy"><span>Can I have some milk, please?</span><i>🔊</i></button><button class="s" data-a="audio/u03_x0_3.mp3"><img class="" src="../img/1f9c0.webp" alt="" loading="lazy"><span>Can I have some cheese, please?</span><i>🔊</i></button></div><button class="all" data-group="x0">▶ Play pattern 1</button><h3>How much is the ___?</h3><div class="says x1"><button class="s" data-a="audio/u03_x1_0.mp3"><img class="" src="../img/1f349.webp" alt="" loading="lazy"><span>How much is the watermelon?</span><i>🔊</i></button><button class="s" data-a="audio/u03_x1_1.mp3"><img class="" src="../img/1f9c3.webp" alt="" loading="lazy"><span>How much is the juice?</span><i>🔊</i></button><button class="s" data-a="audio/u03_x1_2.mp3"><img class="" src="../img/1f35e.webp" alt="" loading="lazy"><span>How much is the bread?</span><i>🔊</i></button><button class="s" data-a="audio/u03_x1_3.mp3"><img class="" src="../img/1f966.webp" alt="" loading="lazy"><span>How much is the broccoli?</span><i>🔊</i></button></div><button class="all" data-group="x1">▶ Play pattern 2</button></section><nav class="pn"><a class="nav" href="u02.html">‹ In the Classroom</a><a class="nav home" href="./">All units</a><a class="nav" href="u04.html">The Clothes Shop ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
