 <section id="look"><h2>🔍 Look and think</h2><div class="chat qa"><button class="c" data-a="audio/u10_q0.mp3"><b style="background:#6b1d2b">Q</b><span>Where are they?</span></button><button class="c r" data-a="audio/u10_a0.mp3"><b style="background:#2b7bd6">A</b><span>They're at the airport.</span></button><button class="c" data-a="audio/u10_q1.mp3"><b style="background:#6b1d2b">Q</b><span>What time is the flight to London?</span></button><button class="c r" data-a="audio/u10_a1.mp3"><b style="background:#2b7bd6">A</b><span>It's at ten fifteen.</span></button><button class="c" data-a="audio/u10_q2.mp3"><b style="background:#6b1d2b">Q</b><span>Which gate is the flight to Dubai?</span></button><button class="c r" data-a="audio/u10_a2.mp3"><b style="background:#2b7bd6">A</b><span>Gate twenty-two.</span></button><button class="c" data-a="audio/u10_q3.mp3"><b style="background:#6b1d2b">Q</b><span>Have they got a suitcase?</span></button><button class="c r" data-a="audio/u10_a3.mp3"><b style="background:#2b7bd6">A</b><span>Yes, they have.</span></button><button class="c" data-a="audio/u10_q4.mp3"><b style="background:#6b1d2b">Q</b><span>Is there a plane?</span></button><button class="c r" data-a="audio/u10_a4.mp3"><b style="background:#2b7bd6">A</b><span>Yes, there is.</span></button><button class="c" data-a="audio/u10_q5.mp3"><b style="background:#6b1d2b">Q</b><span>Is Mia excited?</span></button><button class="c r" data-a="audio/u10_a5.mp3"><b style="background:#2b7bd6">A</b><span>Yes, she is!</span></button></div><button class="all" data-group="qa">▶ Play all</button></section>
 <section id="say"><h2>🗣️ Talk about the picture</h2><div class="says"><button class="s" data-a="audio/u10_d0.mp3"><img class="" src="../img/2708-fe0f.webp" alt="" loading="lazy"><span>Dad and Mia are at the airport.</span><i>🔊</i></button><button class="s" data-a="audio/u10_d1.mp3"><img class="" src="../img/2708-fe0f.webp" alt="" loading="lazy"><span>They are going on holiday.</span><i>🔊</i></button><button class="s" data-a="audio/u10_d2.mp3"><img class="" src="../img/2708-fe0f.webp" alt="" loading="lazy"><span>There is a big board.</span><i>🔊</i></button><button class="s" data-a="audio/u10_d3.mp3"><img class="" src="../img/2708-fe0f.webp" alt="" loading="lazy"><span>The flight to Dubai is at nine forty.</span><i>🔊</i></button><button class="s" data-a="audio/u10_d4.mp3"><img class="" src="../img/2708-fe0f.webp" alt="" loading="lazy"><span>They have got a suitcase.</span><i>🔊</i></button><button class="s" data-a="audio/u10_d5.mp3"><img class="" src="../img/2708-fe0f.webp" alt="" loading="lazy"><span>Mia is very excited.</span><i>🔊</i></button></div><button class="all" data-group="says">▶ Play all sentences</button></section>
 <section id="patterns"><h2>🧩 Sentence patterns</h2><h3>We are going to ___.</h3><div class="says x0"><button class="s" data-a="audio/u10_x0_0.mp3"><img class="" src="../img/2708-fe0f.webp" alt="" loading="lazy"><span>We are going to fly.</span><i>🔊</i></button><button class="s" data-a="audio/u10_x0_1.mp3"><img class="" src="../img/1f3d6-fe0f.webp" alt="" loading="lazy"><span>We are going to swim in the sea.</span><i>🔊</i></button><button class="s" data-a="audio/u10_x0_2.mp3"><img class="" src="../img/1f3e8.webp" alt="" loading="lazy"><span>We are going to stay in a hotel.</span><i>🔊</i></button><button class="s" data-a="audio/u10_x0_3.mp3"><img class="" src="../img/1f4f8.webp" alt="" loading="lazy"><span>We are going to take photos.</span><i>🔊</i></button></div><button class="all" data-group="x0">▶ Play pattern 1</button><h3>It's ___ o'clock.</h3><div class="says x1"><button class="s" data-a="audio/u10_x1_0.mp3"><img class="" src="../img/1f558.webp" alt="" loading="lazy"><span>It's nine o'clock.</span><i>🔊</i></button><button class="s" data-a="audio/u10_x1_1.mp3"><img class="" src="../img/1f559.webp" alt="" loading="lazy"><span>It's ten o'clock.</span><i>🔊</i></button><button class="s" data-a="audio/u10_x1_2.mp3"><img class="" src="../img/1f552.webp" alt="" loading="lazy"><span>It's three o'clock.</span><i>🔊</i></button><button class="s" data-a="audio/u10_x1_3.mp3"><img class="" src="../img/1f556.webp" alt="" loading="lazy"><span>It's seven o'clock.</span><i>🔊</i></button></div><button class="all" data-group="x1">▶ Play pattern 2</button></section><nav class="pn"><a class="nav" href="u09.html">‹ In the Street</a><a class="nav home" href="./">All units</a><a class="nav" href="u11.html">At the Zoo ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
