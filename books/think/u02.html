 <section id="look"><h2>🔍 Look and think</h2><div class="chat qa"><button class="c" data-a="audio/u02_q0.mp3"><b style="background:#6b1d2b">Q</b><span>Who is the teacher?</span></button><button class="c r" data-a="audio/u02_a0.mp3"><b style="background:#2b7bd6">A</b><span>Ms. Lina is the teacher.</span></button><button class="c" data-a="audio/u02_q1.mp3"><b style="background:#6b1d2b">Q</b><span>What's on the board?</span></button><button class="c r" data-a="audio/u02_a1.mp3"><b style="background:#2b7bd6">A</b><span>A B C and 1 2 3.</span></button><button class="c" data-a="audio/u02_q2.mp3"><b style="background:#6b1d2b">Q</b><span>Where are the books?</span></button><button class="c r" data-a="audio/u02_a2.mp3"><b style="background:#2b7bd6">A</b><span>They're on the shelf.</span></button><button class="c" data-a="audio/u02_q3.mp3"><b style="background:#6b1d2b">Q</b><span>Is there a clock?</span></button><button class="c r" data-a="audio/u02_a3.mp3"><b style="background:#2b7bd6">A</b><span>Yes, there is.</span></button><button class="c" data-a="audio/u02_q4.mp3"><b style="background:#6b1d2b">Q</b><span>What colour is Leo's T-shirt?</span></button><button class="c r" data-a="audio/u02_a4.mp3"><b style="background:#2b7bd6">A</b><span>It's blue.</span></button><button class="c" data-a="audio/u02_q5.mp3"><b style="background:#6b1d2b">Q</b><span>Does Ms. Lina wear glasses?</span></button><button class="c r" data-a="audio/u02_a5.mp3"><b style="background:#2b7bd6">A</b><span>Yes, she does.</span></button></div><button class="all" data-group="qa">▶ Play all</button></section>
 <section id="say"><h2>🗣️ Talk about the picture</h2><div class="says"><button class="s" data-a="audio/u02_d0.mp3"><img class="" src="../img/1f3eb.webp" alt="" loading="lazy"><span>This is a classroom.</span><i>🔊</i></button><button class="s" data-a="audio/u02_d1.mp3"><img class="" src="../img/1f3eb.webp" alt="" loading="lazy"><span>Ms. Lina is the teacher.</span><i>🔊</i></button><button class="s" data-a="audio/u02_d2.mp3"><img class="" src="../img/1f3eb.webp" alt="" loading="lazy"><span>Leo is a student.</span><i>🔊</i></button><button class="s" data-a="audio/u02_d3.mp3"><img class="" src="../img/1f3eb.webp" alt="" loading="lazy"><span>There is a board on the wall.</span><i>🔊</i></button><button class="s" data-a="audio/u02_d4.mp3"><img class="" src="../img/1f3eb.webp" alt="" loading="lazy"><span>The board says &quot;Hello, class!&quot;</span><i>🔊</i></button><button class="s" data-a="audio/u02_d5.mp3"><img class="" src="../img/1f3eb.webp" alt="" loading="lazy"><span>There is a globe on the shelf.</span><i>🔊</i></button></div><button class="all" data-group="says">▶ Play all sentences</button></section>
 <section id="patterns"><h2>🧩 Sentence patterns</h2><h3>This is my ___.</h3><div class="says x0"><button class="s" data-a="audio/u02_x0_0.mp3"><img class="" src="../img/1f4d5.webp" alt="" loading="lazy"><span>This is my book.</span><i>🔊</i></button><button class="s" data-a="audio/u02_x0_1.mp3"><img class="" src="../img/270f-fe0f.webp" alt="" loading="lazy"><span>This is my pencil.</span><i>🔊</i></button><button class="s" data-a="audio/u02_x0_2.mp3"><img class="" src="../img/1f392.webp" alt="" loading="lazy"><span>This is my bag.</span><i>🔊</i></button><button class="s" data-a="audio/u02_x0_3.mp3"><img class="" src="../img/1f4cf.webp" alt="" loading="lazy"><span>This is my ruler.</span><i>🔊</i></button></div><button class="all" data-group="x0">▶ Play pattern 1</button><h3>These are my ___.</h3><div class="says x1"><button class="s" data-a="audio/u02_x1_0.mp3"><img class="" src="../img/1f58d-fe0f.webp" alt="" loading="lazy"><span>These are my crayons.</span><i>🔊</i></button><button class="s" data-a="audio/u02_x1_1.mp3"><img class="" src="../img/1f4da.webp" alt="" loading="lazy"><span>These are my books.</span><i>🔊</i></button><button class="s" data-a="audio/u02_x1_2.mp3"><img class="" src="../img/2702-fe0f.webp" alt="" loading="lazy"><span>These are my scissors.</span><i>🔊</i></button><button class="s" data-a="audio/u02_x1_3.mp3"><img class="" src="../img/1f45f.webp" alt="" loading="lazy"><span>These are my shoes.</span><i>🔊</i></button></div><button class="all" data-group="x1">▶ Play pattern 2</button></section><nav class="pn"><a class="nav" href="u01.html">‹ At the Park</a><a class="nav home" href="./">All units</a><a class="nav" href="u03.html">At the Shop ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
