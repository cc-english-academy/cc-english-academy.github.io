 <section id="look"><h2>🔍 Look and think</h2><div class="chat qa"><button class="c" data-a="audio/u14_q0.mp3"><b style="background:#6b1d2b">Q</b><span>What day is it?</span></button><button class="c r" data-a="audio/u14_a0.mp3"><b style="background:#2b7bd6">A</b><span>It's sports day.</span></button><button class="c" data-a="audio/u14_q1.mp3"><b style="background:#6b1d2b">Q</b><span>What can you see?</span></button><button class="c r" data-a="audio/u14_a1.mp3"><b style="background:#2b7bd6">A</b><span>A flag, a cup and a ball.</span></button><button class="c" data-a="audio/u14_q2.mp3"><b style="background:#6b1d2b">Q</b><span>Who has got the cup?</span></button><button class="c r" data-a="audio/u14_a2.mp3"><b style="background:#2b7bd6">A</b><span>Nobody yet!</span></button><button class="c" data-a="audio/u14_q3.mp3"><b style="background:#6b1d2b">Q</b><span>Is there a ball?</span></button><button class="c r" data-a="audio/u14_a3.mp3"><b style="background:#2b7bd6">A</b><span>Yes, there is.</span></button><button class="c" data-a="audio/u14_q4.mp3"><b style="background:#6b1d2b">Q</b><span>What colour is Leo's T-shirt?</span></button><button class="c r" data-a="audio/u14_a4.mp3"><b style="background:#2b7bd6">A</b><span>It's blue.</span></button><button class="c" data-a="audio/u14_q5.mp3"><b style="background:#6b1d2b">Q</b><span>Who is faster?</span></button><button class="c r" data-a="audio/u14_a5.mp3"><b style="background:#2b7bd6">A</b><span>Omar is faster.</span></button></div><button class="all" data-group="qa">▶ Play all</button></section>
 <section id="say"><h2>🗣️ Talk about the picture</h2><div class="says"><button class="s" data-a="audio/u14_d0.mp3"><img class="" src="../img/1f3c5.webp" alt="" loading="lazy"><span>It's sports day at school.</span><i>🔊</i></button><button class="s" data-a="audio/u14_d1.mp3"><img class="" src="../img/1f3c5.webp" alt="" loading="lazy"><span>Omar and Leo are running a race.</span><i>🔊</i></button><button class="s" data-a="audio/u14_d2.mp3"><img class="" src="../img/1f3c5.webp" alt="" loading="lazy"><span>There is a flag at the finish.</span><i>🔊</i></button><button class="s" data-a="audio/u14_d3.mp3"><img class="" src="../img/1f3c5.webp" alt="" loading="lazy"><span>There is a big gold cup.</span><i>🔊</i></button><button class="s" data-a="audio/u14_d4.mp3"><img class="" src="../img/1f3c5.webp" alt="" loading="lazy"><span>Omar is faster than Leo.</span><i>🔊</i></button><button class="s" data-a="audio/u14_d5.mp3"><img class="" src="../img/1f3c5.webp" alt="" loading="lazy"><span>They both try their best.</span><i>🔊</i></button></div><button class="all" data-group="says">▶ Play all sentences</button></section>
 <section id="patterns"><h2>🧩 Sentence patterns</h2><h3>I can ___.</h3><div class="says x0"><button class="s" data-a="audio/u14_x0_0.mp3"><img class="" src="../img/1f3c3.webp" alt="" loading="lazy"><span>I can run fast.</span><i>🔊</i></button><button class="s" data-a="audio/u14_x0_1.mp3"><img class="" src="../img/1f3ca.webp" alt="" loading="lazy"><span>I can swim.</span><i>🔊</i></button><button class="s" data-a="audio/u14_x0_2.mp3"><img class="" src="../img/26bd.webp" alt="" loading="lazy"><span>I can play football.</span><i>🔊</i></button><button class="s" data-a="audio/u14_x0_3.mp3"><img class="" src="../img/1f6b4.webp" alt="" loading="lazy"><span>I can ride a bike.</span><i>🔊</i></button></div><button class="all" data-group="x0">▶ Play pattern 1</button><h3>I can't ___.</h3><div class="says x1"><button class="s" data-a="audio/u14_x1_0.mp3"><img class="" src="../img/1f3c2.webp" alt="" loading="lazy"><span>I can't snowboard.</span><i>🔊</i></button><button class="s" data-a="audio/u14_x1_1.mp3"><img class="" src="../img/1f938.webp" alt="" loading="lazy"><span>I can't do a cartwheel.</span><i>🔊</i></button><button class="s" data-a="audio/u14_x1_2.mp3"><img class="" src="../img/1f3bb.webp" alt="" loading="lazy"><span>I can't play the violin.</span><i>🔊</i></button><button class="s" data-a="audio/u14_x1_3.mp3"><img class="" src="../img/1f9d7.webp" alt="" loading="lazy"><span>I can't climb a mountain.</span><i>🔊</i></button></div><button class="all" data-group="x1">▶ Play pattern 2</button></section><nav class="pn"><a class="nav" href="u13.html">‹ At the Library</a><a class="nav home" href="./">All units</a><a class="nav" href="u15.html">At Dad's Office ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
