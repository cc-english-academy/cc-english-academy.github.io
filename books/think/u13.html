 <section id="look"><h2>🔍 Look and think</h2><div class="chat qa"><button class="c" data-a="audio/u13_q0.mp3"><b style="background:#6b1d2b">Q</b><span>Where are they?</span></button><button class="c r" data-a="audio/u13_a0.mp3"><b style="background:#2b7bd6">A</b><span>They're at the library.</span></button><button class="c" data-a="audio/u13_q1.mp3"><b style="background:#6b1d2b">Q</b><span>What can you see?</span></button><button class="c r" data-a="audio/u13_a1.mp3"><b style="background:#2b7bd6">A</b><span>Lots of books.</span></button><button class="c" data-a="audio/u13_q2.mp3"><b style="background:#6b1d2b">Q</b><span>Is it noisy or quiet?</span></button><button class="c r" data-a="audio/u13_a2.mp3"><b style="background:#2b7bd6">A</b><span>It's quiet.</span></button><button class="c" data-a="audio/u13_q3.mp3"><b style="background:#6b1d2b">Q</b><span>Is there a clock?</span></button><button class="c r" data-a="audio/u13_a3.mp3"><b style="background:#2b7bd6">A</b><span>Yes, there is.</span></button><button class="c" data-a="audio/u13_q4.mp3"><b style="background:#6b1d2b">Q</b><span>What is Mia looking for?</span></button><button class="c r" data-a="audio/u13_a4.mp3"><b style="background:#2b7bd6">A</b><span>A book about animals.</span></button><button class="c" data-a="audio/u13_q5.mp3"><b style="background:#6b1d2b">Q</b><span>Who helps Mia?</span></button><button class="c r" data-a="audio/u13_a5.mp3"><b style="background:#2b7bd6">A</b><span>Ms. Lina.</span></button></div><button class="all" data-group="qa">▶ Play all</button></section>
 <section id="say"><h2>🗣️ Talk about the picture</h2><div class="says"><button class="s" data-a="audio/u13_d0.mp3"><img class="" src="../img/1f4da.webp" alt="" loading="lazy"><span>Mia is at the library.</span><i>🔊</i></button><button class="s" data-a="audio/u13_d1.mp3"><img class="" src="../img/1f4da.webp" alt="" loading="lazy"><span>There are lots of books.</span><i>🔊</i></button><button class="s" data-a="audio/u13_d2.mp3"><img class="" src="../img/1f4da.webp" alt="" loading="lazy"><span>The books are on the shelves.</span><i>🔊</i></button><button class="s" data-a="audio/u13_d3.mp3"><img class="" src="../img/1f4da.webp" alt="" loading="lazy"><span>The library is quiet.</span><i>🔊</i></button><button class="s" data-a="audio/u13_d4.mp3"><img class="" src="../img/1f4da.webp" alt="" loading="lazy"><span>Mia wants a book about animals.</span><i>🔊</i></button><button class="s" data-a="audio/u13_d5.mp3"><img class="" src="../img/1f4da.webp" alt="" loading="lazy"><span>Ms. Lina helps her.</span><i>🔊</i></button></div><button class="all" data-group="says">▶ Play all sentences</button></section>
 <section id="patterns"><h2>🧩 Sentence patterns</h2><h3>Can I borrow ___?</h3><div class="says x0"><button class="s" data-a="audio/u13_x0_0.mp3"><img class="" src="../img/1f4d5.webp" alt="" loading="lazy"><span>Can I borrow this book?</span><i>🔊</i></button><button class="s" data-a="audio/u13_x0_1.mp3"><img class="" src="../img/270f-fe0f.webp" alt="" loading="lazy"><span>Can I borrow a pencil?</span><i>🔊</i></button><button class="s" data-a="audio/u13_x0_2.mp3"><img class="" src="../img/1f58d-fe0f.webp" alt="" loading="lazy"><span>Can I borrow your crayons?</span><i>🔊</i></button><button class="s" data-a="audio/u13_x0_3.mp3"><img class="" src="../img/1f4cf.webp" alt="" loading="lazy"><span>Can I borrow your ruler?</span><i>🔊</i></button></div><button class="all" data-group="x0">▶ Play pattern 1</button><h3>I'm looking for a book about ___.</h3><div class="says x1"><button class="s" data-a="audio/u13_x1_0.mp3"><img class="" src="../img/1f981.webp" alt="" loading="lazy"><span>I'm looking for a book about animals.</span><i>🔊</i></button><button class="s" data-a="audio/u13_x1_1.mp3"><img class="" src="../img/1f680.webp" alt="" loading="lazy"><span>I'm looking for a book about space.</span><i>🔊</i></button><button class="s" data-a="audio/u13_x1_2.mp3"><img class="" src="../img/1f996.webp" alt="" loading="lazy"><span>I'm looking for a book about dinosaurs.</span><i>🔊</i></button><button class="s" data-a="audio/u13_x1_3.mp3"><img class="" src="../img/1f30a.webp" alt="" loading="lazy"><span>I'm looking for a book about the sea.</span><i>🔊</i></button></div><button class="all" data-group="x1">▶ Play pattern 2</button></section><nav class="pn"><a class="nav" href="u12.html">‹ In the Kitchen</a><a class="nav home" href="./">All units</a><a class="nav" href="u14.html">Sports Day ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
