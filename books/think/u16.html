 <section id="look"><h2>🔍 Look and think</h2><div class="chat qa"><button class="c" data-a="audio/u16_q0.mp3"><b style="background:#6b1d2b">Q</b><span>Where is Grandma?</span></button><button class="c r" data-a="audio/u16_a0.mp3"><b style="background:#2b7bd6">A</b><span>She's at the hotel.</span></button><button class="c" data-a="audio/u16_q1.mp3"><b style="background:#6b1d2b">Q</b><span>Who is Mr. Adam?</span></button><button class="c r" data-a="audio/u16_a1.mp3"><b style="background:#2b7bd6">A</b><span>He's the receptionist.</span></button><button class="c" data-a="audio/u16_q2.mp3"><b style="background:#6b1d2b">Q</b><span>What can you see on the desk?</span></button><button class="c r" data-a="audio/u16_a2.mp3"><b style="background:#2b7bd6">A</b><span>A bell and a key.</span></button><button class="c" data-a="audio/u16_q3.mp3"><b style="background:#6b1d2b">Q</b><span>Is there a picture?</span></button><button class="c r" data-a="audio/u16_a3.mp3"><b style="background:#2b7bd6">A</b><span>Yes, there is.</span></button><button class="c" data-a="audio/u16_q4.mp3"><b style="background:#6b1d2b">Q</b><span>Does Grandma wear glasses?</span></button><button class="c r" data-a="audio/u16_a4.mp3"><b style="background:#2b7bd6">A</b><span>Yes, she does.</span></button><button class="c" data-a="audio/u16_q5.mp3"><b style="background:#6b1d2b">Q</b><span>What does Grandma need?</span></button><button class="c r" data-a="audio/u16_a5.mp3"><b style="background:#2b7bd6">A</b><span>She needs her room key.</span></button></div><button class="all" data-group="qa">▶ Play all</button></section>
 <section id="say"><h2>🗣️ Talk about the picture</h2><div class="says"><button class="s" data-a="audio/u16_d0.mp3"><img class="" src="../img/1f3e8.webp" alt="" loading="lazy"><span>Grandma is at a hotel.</span><i>🔊</i></button><button class="s" data-a="audio/u16_d1.mp3"><img class="" src="../img/1f3e8.webp" alt="" loading="lazy"><span>Mr. Adam works at the hotel.</span><i>🔊</i></button><button class="s" data-a="audio/u16_d2.mp3"><img class="" src="../img/1f3e8.webp" alt="" loading="lazy"><span>There is a bell on the desk.</span><i>🔊</i></button><button class="s" data-a="audio/u16_d3.mp3"><img class="" src="../img/1f3e8.webp" alt="" loading="lazy"><span>There is a key for Grandma.</span><i>🔊</i></button><button class="s" data-a="audio/u16_d4.mp3"><img class="" src="../img/1f3e8.webp" alt="" loading="lazy"><span>Her room is on the second floor.</span><i>🔊</i></button><button class="s" data-a="audio/u16_d5.mp3"><img class="" src="../img/1f3e8.webp" alt="" loading="lazy"><span>Grandma says &quot;Thank you!&quot;</span><i>🔊</i></button></div><button class="all" data-group="says">▶ Play all sentences</button></section>
 <section id="patterns"><h2>🧩 Sentence patterns</h2><h3>Is there a ___?</h3><div class="says x0"><button class="s" data-a="audio/u16_x0_0.mp3"><img class="" src="../img/1f3ca.webp" alt="" loading="lazy"><span>Is there a swimming pool?</span><i>🔊</i></button><button class="s" data-a="audio/u16_x0_1.mp3"><img class="" src="../img/1f4f6.webp" alt="" loading="lazy"><span>Is there Wi-Fi?</span><i>🔊</i></button><button class="s" data-a="audio/u16_x0_2.mp3"><img class="" src="../img/1f373.webp" alt="" loading="lazy"><span>Is there breakfast?</span><i>🔊</i></button><button class="s" data-a="audio/u16_x0_3.mp3"><img class="" src="../img/1f6d7.webp" alt="" loading="lazy"><span>Is there a lift?</span><i>🔊</i></button></div><button class="all" data-group="x0">▶ Play pattern 1</button><h3>Yes, there is. / No, there isn't.</h3><div class="says x1"><button class="s" data-a="audio/u16_x1_0.mp3"><img class="" src="../img/2705.webp" alt="" loading="lazy"><span>Yes, there is.</span><i>🔊</i></button><button class="s" data-a="audio/u16_x1_1.mp3"><img class="" src="../img/274c.webp" alt="" loading="lazy"><span>No, there isn't.</span><i>🔊</i></button><button class="s" data-a="audio/u16_x1_2.mp3"><img class="" src="../img/2705.webp" alt="" loading="lazy"><span>Yes, there are.</span><i>🔊</i></button><button class="s" data-a="audio/u16_x1_3.mp3"><img class="" src="../img/274c.webp" alt="" loading="lazy"><span>No, there aren't.</span><i>🔊</i></button></div><button class="all" data-group="x1">▶ Play pattern 2</button></section><nav class="pn"><a class="nav" href="u15.html">‹ At Dad's Office</a><a class="nav home" href="./">All units</a><a class="nav" href="u17.html">At the Beach ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
