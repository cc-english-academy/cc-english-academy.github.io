 <section id="patterns"><h2>🧩 Sentence patterns</h2><h3>I've got a ___.</h3><div class="says x0"><button class="s" data-a="audio/u08_x0_0.mp3"><img class="" src="../img/1f915.webp" alt="" loading="lazy"><span>I've got a headache.</span><i>🔊</i></button><button class="s" data-a="audio/u08_x0_1.mp3"><img class="" src="../img/1f927.webp" alt="" loading="lazy"><span>I've got a cold.</span><i>🔊</i></button><button class="s" data-a="audio/u08_x0_2.mp3"><img class="" src="../img/1f912.webp" alt="" loading="lazy"><span>I've got a fever.</span><i>🔊</i></button><button class="s" data-a="audio/u08_x0_3.mp3"><img class="" src="../img/1f9b7.webp" alt="" loading="lazy"><span>I've got a toothache.</span><i>🔊</i></button></div><button class="all" data-group="x0">▶ Play pattern 1</button><h3>You should ___.</h3><div class="says x1"><button class="s" data-a="audio/u08_x1_0.mp3"><img class="" src="../img/1f6cf-fe0f.webp" alt="" loading="lazy"><span>You should rest.</span><i>🔊</i></button><button class="s" data-a="audio/u08_x1_1.mp3"><img class="" src="../img/1f4a7.webp" alt="" loading="lazy"><span>You should drink water.</span><i>🔊</i></button><button class="s" data-a="audio/u08_x1_2.mp3"><img class="" src="../img/1f48a.webp" alt="" loading="lazy"><span>You should take your medicine.</span><i>🔊</i></button><button class="s" data-a="audio/u08_x1_3.mp3"><img class="" src="../img/1f34a.webp" alt="" loading="lazy"><span>You should eat fruit.</span><i>🔊</i></button></div><button class="all" data-group="x1">▶ Play pattern 2</button></section><nav class="pn"><a class="nav" href="u07.html">‹ At the Café</a><a class="nav home" href="./">All units</a><a class="nav" href="u09.html">In the Street ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
