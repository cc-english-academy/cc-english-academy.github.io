 <section id="look"><h2>🔍 Look and think</h2><div class="chat qa"><button class="c" data-a="audio/u05_q0.mp3"><b style="background:#6b1d2b">Q</b><span>Where are Dad and Omar?</span></button><button class="c r" data-a="audio/u05_a0.mp3"><b style="background:#2b7bd6">A</b><span>They're in the living room.</span></button><button class="c" data-a="audio/u05_q1.mp3"><b style="background:#6b1d2b">Q</b><span>Is there a sofa?</span></button><button class="c r" data-a="audio/u05_a1.mp3"><b style="background:#2b7bd6">A</b><span>Yes, there is.</span></button><button class="c" data-a="audio/u05_q2.mp3"><b style="background:#6b1d2b">Q</b><span>What's on the wall?</span></button><button class="c r" data-a="audio/u05_a2.mp3"><b style="background:#2b7bd6">A</b><span>A picture.</span></button><button class="c" data-a="audio/u05_q3.mp3"><b style="background:#6b1d2b">Q</b><span>Is there a plant?</span></button><button class="c r" data-a="audio/u05_a3.mp3"><b style="background:#2b7bd6">A</b><span>Yes, there is.</span></button><button class="c" data-a="audio/u05_q4.mp3"><b style="background:#6b1d2b">Q</b><span>Has Dad got a beard?</span></button><button class="c r" data-a="audio/u05_a4.mp3"><b style="background:#2b7bd6">A</b><span>Yes, he has.</span></button><button class="c" data-a="audio/u05_q5.mp3"><b style="background:#6b1d2b">Q</b><span>Is there a lamp?</span></button><button class="c r" data-a="audio/u05_a5.mp3"><b style="background:#2b7bd6">A</b><span>Yes, there is.</span></button></div><button class="all" data-group="qa">▶ Play all</button></section>

 <section id="patterns"><h2>🧩 Sentence patterns</h2><h3>He has got ___.</h3><div class="says x0"><button class="s" data-a="audio/u05_x0_0.mp3"><img class="" src="../img/1f9d4.webp" alt="" loading="lazy"><span>He has got a beard.</span><i>🔊</i></button><button class="s" data-a="audio/u05_x0_1.mp3"><img class="" src="../img/1f453.webp" alt="" loading="lazy"><span>He has got glasses.</span><i>🔊</i></button><button class="s" data-a="audio/u05_x0_2.mp3"><img class="" src="../img/1f436.webp" alt="" loading="lazy"><span>He has got a dog.</span><i>🔊</i></button><button class="s" data-a="audio/u05_x0_3.mp3"><img class="" src="../img/1f6b2.webp" alt="" loading="lazy"><span>He has got a bike.</span><i>🔊</i></button></div><button class="all" data-group="x0">▶ Play pattern 1</button><h3>I have got a ___.</h3><div class="says x1"><button class="s" data-a="audio/u05_x1_0.mp3"><img class="" src="../img/1f431.webp" alt="" loading="lazy"><span>I have got a cat.</span><i>🔊</i></button><button class="s" data-a="audio/u05_x1_1.mp3"><img class="" src="../img/26bd.webp" alt="" loading="lazy"><span>I have got a ball.</span><i>🔊</i></button><button class="s" data-a="audio/u05_x1_2.mp3"><img class="" src="../img/1f9f8.webp" alt="" loading="lazy"><span>I have got a teddy.</span><i>🔊</i></button><button class="s" data-a="audio/u05_x1_3.mp3"><img class="" src="../img/1fa81.webp" alt="" loading="lazy"><span>I have got a kite.</span><i>🔊</i></button></div><button class="all" data-group="x1">▶ Play pattern 2</button></section><nav class="pn"><a class="nav" href="u04.html">‹ The Clothes Shop</a><a class="nav home" href="./">All units</a><a class="nav" href="u06.html">The Party ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
