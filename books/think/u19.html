 <section id="look"><h2>🔍 Look and think</h2><div class="chat qa"><button class="c" data-a="audio/u19_q0.mp3"><b style="background:#6b1d2b">Q</b><span>What room is this?</span></button><button class="c r" data-a="audio/u19_a0.mp3"><b style="background:#2b7bd6">A</b><span>It's the bathroom.</span></button><button class="c" data-a="audio/u19_q1.mp3"><b style="background:#6b1d2b">Q</b><span>What can you see?</span></button><button class="c r" data-a="audio/u19_a1.mp3"><b style="background:#2b7bd6">A</b><span>A bath, a shower, a mirror and soap.</span></button><button class="c" data-a="audio/u19_q2.mp3"><b style="background:#6b1d2b">Q</b><span>Is there a mirror?</span></button><button class="c r" data-a="audio/u19_a2.mp3"><b style="background:#2b7bd6">A</b><span>Yes, there is.</span></button><button class="c" data-a="audio/u19_q3.mp3"><b style="background:#6b1d2b">Q</b><span>What is Omar doing?</span></button><button class="c r" data-a="audio/u19_a3.mp3"><b style="background:#2b7bd6">A</b><span>He's washing his hands.</span></button><button class="c" data-a="audio/u19_q4.mp3"><b style="background:#6b1d2b">Q</b><span>Where is the soap?</span></button><button class="c r" data-a="audio/u19_a4.mp3"><b style="background:#2b7bd6">A</b><span>It's next to the sink.</span></button><button class="c" data-a="audio/u19_q5.mp3"><b style="background:#6b1d2b">Q</b><span>Is Omar clean now?</span></button><button class="c r" data-a="audio/u19_a5.mp3"><b style="background:#2b7bd6">A</b><span>Yes, he is!</span></button></div><button class="all" data-group="qa">▶ Play all</button></section>
 <section id="say"><h2>🗣️ Talk about the picture</h2><div class="says"><button class="s" data-a="audio/u19_d0.mp3"><img class="" src="../img/1f6c1.webp" alt="" loading="lazy"><span>This is the bathroom.</span><i>🔊</i></button><button class="s" data-a="audio/u19_d1.mp3"><img class="" src="../img/1f6c1.webp" alt="" loading="lazy"><span>There is a bath and a shower.</span><i>🔊</i></button><button class="s" data-a="audio/u19_d2.mp3"><img class="" src="../img/1f6c1.webp" alt="" loading="lazy"><span>There is a mirror on the wall.</span><i>🔊</i></button><button class="s" data-a="audio/u19_d3.mp3"><img class="" src="../img/1f6c1.webp" alt="" loading="lazy"><span>There is some soap.</span><i>🔊</i></button><button class="s" data-a="audio/u19_d4.mp3"><img class="" src="../img/1f6c1.webp" alt="" loading="lazy"><span>Omar is washing his hands.</span><i>🔊</i></button><button class="s" data-a="audio/u19_d5.mp3"><img class="" src="../img/1f6c1.webp" alt="" loading="lazy"><span>Mum says &quot;Well done!&quot;</span><i>🔊</i></button></div><button class="all" data-group="says">▶ Play all sentences</button></section>
 <section id="patterns"><h2>🧩 Sentence patterns</h2><h3>I wash my ___.</h3><div class="says x0"><button class="s" data-a="audio/u19_x0_0.mp3"><img class="" src="../img/1f64c.webp" alt="" loading="lazy"><span>I wash my hands.</span><i>🔊</i></button><button class="s" data-a="audio/u19_x0_1.mp3"><img class="" src="../img/1f60a.webp" alt="" loading="lazy"><span>I wash my face.</span><i>🔊</i></button><button class="s" data-a="audio/u19_x0_2.mp3"><img class="" src="../img/1f487.webp" alt="" loading="lazy"><span>I wash my hair.</span><i>🔊</i></button><button class="s" data-a="audio/u19_x0_3.mp3"><img class="" src="../img/1f9b6.webp" alt="" loading="lazy"><span>I wash my feet.</span><i>🔊</i></button></div><button class="all" data-group="x0">▶ Play pattern 1</button><h3>Don't forget to ___!</h3><div class="says x1"><button class="s" data-a="audio/u19_x1_0.mp3"><img class="" src="../img/1f9fc.webp" alt="" loading="lazy"><span>Don't forget to use soap!</span><i>🔊</i></button><button class="s" data-a="audio/u19_x1_1.mp3"><img class="" src="../img/1faa5.webp" alt="" loading="lazy"><span>Don't forget to brush your teeth!</span><i>🔊</i></button><button class="s" data-a="audio/u19_x1_2.mp3"><img class="" src="../img/1f6b0.webp" alt="" loading="lazy"><span>Don't forget to turn off the tap!</span><i>🔊</i></button><button class="s" data-a="audio/u19_x1_3.mp3"><img class="" src="../img/1f9fb.webp" alt="" loading="lazy"><span>Don't forget to dry your hands!</span><i>🔊</i></button></div><button class="all" data-group="x1">▶ Play pattern 2</button></section><nav class="pn"><a class="nav" href="u18.html">‹ Bedtime</a><a class="nav home" href="./">All units</a><a class="nav" href="u20.html">Yesterday at the Park ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
