 <section id="look"><h2>🔍 Look and think</h2><div class="chat qa"><button class="c" data-a="audio/u21_q0.mp3"><b style="background:#6b1d2b">Q</b><span>Where are Sara and Leo?</span></button><button class="c r" data-a="audio/u21_a0.mp3"><b style="background:#2b7bd6">A</b><span>They're at home.</span></button><button class="c" data-a="audio/u21_q1.mp3"><b style="background:#6b1d2b">Q</b><span>Why are they at home?</span></button><button class="c r" data-a="audio/u21_a1.mp3"><b style="background:#2b7bd6">A</b><span>Because it's raining.</span></button><button class="c" data-a="audio/u21_q2.mp3"><b style="background:#6b1d2b">Q</b><span>What can they see from the window?</span></button><button class="c r" data-a="audio/u21_a2.mp3"><b style="background:#2b7bd6">A</b><span>The rain.</span></button><button class="c" data-a="audio/u21_q3.mp3"><b style="background:#6b1d2b">Q</b><span>Is there a sofa?</span></button><button class="c r" data-a="audio/u21_a3.mp3"><b style="background:#2b7bd6">A</b><span>Yes, there is.</span></button><button class="c" data-a="audio/u21_q4.mp3"><b style="background:#6b1d2b">Q</b><span>What can they do?</span></button><button class="c r" data-a="audio/u21_a4.mp3"><b style="background:#2b7bd6">A</b><span>They can play a game.</span></button><button class="c" data-a="audio/u21_q5.mp3"><b style="background:#6b1d2b">Q</b><span>Are they bored?</span></button><button class="c r" data-a="audio/u21_a5.mp3"><b style="background:#2b7bd6">A</b><span>No, they aren't!</span></button></div><button class="all" data-group="qa">▶ Play all</button></section>
 <section id="say"><h2>🗣️ Talk about the picture</h2><div class="says"><button class="s" data-a="audio/u21_d0.mp3"><img class="" src="../img/1f327-fe0f.webp" alt="" loading="lazy"><span>It's raining today.</span><i>🔊</i></button><button class="s" data-a="audio/u21_d1.mp3"><img class="" src="../img/1f327-fe0f.webp" alt="" loading="lazy"><span>Sara and Leo are at home.</span><i>🔊</i></button><button class="s" data-a="audio/u21_d2.mp3"><img class="" src="../img/1f327-fe0f.webp" alt="" loading="lazy"><span>They can't go to the park.</span><i>🔊</i></button><button class="s" data-a="audio/u21_d3.mp3"><img class="" src="../img/1f327-fe0f.webp" alt="" loading="lazy"><span>They sit on the sofa.</span><i>🔊</i></button><button class="s" data-a="audio/u21_d4.mp3"><img class="" src="../img/1f327-fe0f.webp" alt="" loading="lazy"><span>They play a board game.</span><i>🔊</i></button><button class="s" data-a="audio/u21_d5.mp3"><img class="" src="../img/1f327-fe0f.webp" alt="" loading="lazy"><span>Rainy days can be fun!</span><i>🔊</i></button></div><button class="all" data-group="says">▶ Play all sentences</button></section>
 <section id="patterns"><h2>🧩 Sentence patterns</h2><h3>We can't ___ because it's raining.</h3><div class="says x0"><button class="s" data-a="audio/u21_x0_0.mp3"><img class="" src="../img/26bd.webp" alt="" loading="lazy"><span>We can't play football because it's raining.</span><i>🔊</i></button><button class="s" data-a="audio/u21_x0_1.mp3"><img class="" src="../img/1f3de-fe0f.webp" alt="" loading="lazy"><span>We can't go to the park because it's raining.</span><i>🔊</i></button><button class="s" data-a="audio/u21_x0_2.mp3"><img class="" src="../img/1f6b2.webp" alt="" loading="lazy"><span>We can't ride our bikes because it's raining.</span><i>🔊</i></button><button class="s" data-a="audio/u21_x0_3.mp3"><img class="" src="../img/1f3d6-fe0f.webp" alt="" loading="lazy"><span>We can't go to the beach because it's raining.</span><i>🔊</i></button></div><button class="all" data-group="x0">▶ Play pattern 1</button><h3>Let's ___ instead.</h3><div class="says x1"><button class="s" data-a="audio/u21_x1_0.mp3"><img class="" src="../img/1f9e9.webp" alt="" loading="lazy"><span>Let's do a puzzle instead.</span><i>🔊</i></button><button class="s" data-a="audio/u21_x1_1.mp3"><img class="" src="../img/1f3b2.webp" alt="" loading="lazy"><span>Let's play a board game instead.</span><i>🔊</i></button><button class="s" data-a="audio/u21_x1_2.mp3"><img class="" src="../img/1f36a.webp" alt="" loading="lazy"><span>Let's bake cookies instead.</span><i>🔊</i></button><button class="s" data-a="audio/u21_x1_3.mp3"><img class="" src="../img/1f3a8.webp" alt="" loading="lazy"><span>Let's draw instead.</span><i>🔊</i></button></div><button class="all" data-group="x1">▶ Play pattern 2</button></section><nav class="pn"><a class="nav" href="u20.html">‹ Yesterday at the Park</a><a class="nav home" href="./">All units</a><a class="nav" href="u22.html">A Picnic ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
