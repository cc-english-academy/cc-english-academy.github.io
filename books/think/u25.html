 <section id="patterns"><h2>🧩 Sentence patterns</h2><h3>Next week I'm going to ___.</h3><div class="says x0"><button class="s" data-a="audio/u25_x0_0.mp3"><img class="" src="../img/1f3ca.webp" alt="" loading="lazy"><span>Next week I'm going to swim.</span><i>🔊</i></button><button class="s" data-a="audio/u25_x0_1.mp3"><img class="" src="../img/1f3a1.webp" alt="" loading="lazy"><span>Next week I'm going to visit the fun fair.</span><i>🔊</i></button><button class="s" data-a="audio/u25_x0_2.mp3"><img class="" src="../img/1f475.webp" alt="" loading="lazy"><span>Next week I'm going to visit Grandma.</span><i>🔊</i></button><button class="s" data-a="audio/u25_x0_3.mp3"><img class="" src="../img/26bd.webp" alt="" loading="lazy"><span>Next week I'm going to play in a match.</span><i>🔊</i></button></div><button class="all" data-group="x0">▶ Play pattern 1</button><h3>I think it will be ___.</h3><div class="says x1"><button class="s" data-a="audio/u25_x1_0.mp3"><img class="" src="../img/2600-fe0f.webp" alt="" loading="lazy"><span>I think it will be sunny.</span><i>🔊</i></button><button class="s" data-a="audio/u25_x1_1.mp3"><img class="" src="../img/1f603.webp" alt="" loading="lazy"><span>I think it will be fun.</span><i>🔊</i></button><button class="s" data-a="audio/u25_x1_2.mp3"><img class="" src="../img/1f327-fe0f.webp" alt="" loading="lazy"><span>I think it will be rainy.</span><i>🔊</i></button><button class="s" data-a="audio/u25_x1_3.mp3"><img class="" src="../img/1f525.webp" alt="" loading="lazy"><span>I think it will be hot.</span><i>🔊</i></button></div><button class="all" data-group="x1">▶ Play pattern 2</button></section><nav class="pn"><a class="nav" href="u24.html">‹ A Birthday Surprise</a><a class="nav home" href="./">All units</a><span></span></nav></main><script src="../assets/listen.js"></script></body></html>
