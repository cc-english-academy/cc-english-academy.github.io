 <section id="look"><h2>🔍 Look and think</h2><div class="chat qa"><button class="c" data-a="audio/u09_q0.mp3"><b style="background:#6b1d2b">Q</b><span>Who is Officer Ken?</span></button><button class="c r" data-a="audio/u09_a0.mp3"><b style="background:#2b7bd6">A</b><span>He's a police officer.</span></button><button class="c" data-a="audio/u09_q1.mp3"><b style="background:#6b1d2b">Q</b><span>What can you see?</span></button><button class="c r" data-a="audio/u09_a1.mp3"><b style="background:#2b7bd6">A</b><span>A bank, a museum and traffic lights.</span></button><button class="c" data-a="audio/u09_q2.mp3"><b style="background:#6b1d2b">Q</b><span>Where is the tree?</span></button><button class="c r" data-a="audio/u09_a2.mp3"><b style="background:#2b7bd6">A</b><span>It's next to the museum.</span></button><button class="c" data-a="audio/u09_q3.mp3"><b style="background:#6b1d2b">Q</b><span>Is there a bank?</span></button><button class="c r" data-a="audio/u09_a3.mp3"><b style="background:#2b7bd6">A</b><span>Yes, there is.</span></button><button class="c" data-a="audio/u09_q4.mp3"><b style="background:#6b1d2b">Q</b><span>What colour is Officer Ken's uniform?</span></button><button class="c r" data-a="audio/u09_a4.mp3"><b style="background:#2b7bd6">A</b><span>It's blue.</span></button><button class="c" data-a="audio/u09_q5.mp3"><b style="background:#6b1d2b">Q</b><span>What is Leo doing?</span></button><button class="c r" data-a="audio/u09_a5.mp3"><b style="background:#2b7bd6">A</b><span>He's asking the way.</span></button></div><button class="all" data-group="qa">▶ Play all</button></section>
 <section id="say"><h2>🗣️ Talk about the picture</h2><div class="says"><button class="s" data-a="audio/u09_d0.mp3"><img class="" src="../img/1f6a6.webp" alt="" loading="lazy"><span>Leo is in the street.</span><i>🔊</i></button><button class="s" data-a="audio/u09_d1.mp3"><img class="" src="../img/1f6a6.webp" alt="" loading="lazy"><span>He's talking to Officer Ken.</span><i>🔊</i></button><button class="s" data-a="audio/u09_d2.mp3"><img class="" src="../img/1f6a6.webp" alt="" loading="lazy"><span>There is a bank and a museum.</span><i>🔊</i></button><button class="s" data-a="audio/u09_d3.mp3"><img class="" src="../img/1f6a6.webp" alt="" loading="lazy"><span>There are traffic lights.</span><i>🔊</i></button><button class="s" data-a="audio/u09_d4.mp3"><img class="" src="../img/1f6a6.webp" alt="" loading="lazy"><span>Leo wants to go to the museum.</span><i>🔊</i></button><button class="s" data-a="audio/u09_d5.mp3"><img class="" src="../img/1f6a6.webp" alt="" loading="lazy"><span>Officer Ken helps him.</span><i>🔊</i></button></div><button class="all" data-group="says">▶ Play all sentences</button></section>
 <section id="patterns"><h2>🧩 Sentence patterns</h2><h3>The ___ is next to the ___.</h3><div class="says x0"><button class="s" data-a="audio/u09_x0_0.mp3"><img class="" src="../img/1f3e6.webp" alt="" loading="lazy"><span>The bank is next to the museum.</span><i>🔊</i></button><button class="s" data-a="audio/u09_x0_1.mp3"><img class="" src="../img/1f333.webp" alt="" loading="lazy"><span>The tree is next to the road.</span><i>🔊</i></button><button class="s" data-a="audio/u09_x0_2.mp3"><img class="" src="../img/1f3eb.webp" alt="" loading="lazy"><span>The school is next to the park.</span><i>🔊</i></button><button class="s" data-a="audio/u09_x0_3.mp3"><img class="" src="../img/1f3ea.webp" alt="" loading="lazy"><span>The shop is next to the bank.</span><i>🔊</i></button></div><button class="all" data-group="x0">▶ Play pattern 1</button><h3>Go straight on and turn ___.</h3><div class="says x1"><button class="s" data-a="audio/u09_x1_0.mp3"><img class="" src="../img/2b05-fe0f.webp" alt="" loading="lazy"><span>Go straight on and turn left.</span><i>🔊</i></button><button class="s" data-a="audio/u09_x1_1.mp3"><img class="" src="../img/27a1-fe0f.webp" alt="" loading="lazy"><span>Go straight on and turn right.</span><i>🔊</i></button><button class="s" data-a="audio/u09_x1_2.mp3"><img class="" src="../img/1f6a6.webp" alt="" loading="lazy"><span>Stop at the traffic lights.</span><i>🔊</i></button><button class="s" data-a="audio/u09_x1_3.mp3"><img class="" src="../img/1f6b6.webp" alt="" loading="lazy"><span>Cross the road carefully.</span><i>🔊</i></button></div><button class="all" data-group="x1">▶ Play pattern 2</button></section><nav class="pn"><a class="nav" href="u08.html">‹ At the Clinic</a><a class="nav home" href="./">All units</a><a class="nav" href="u10.html">At the Airport ›</a></nav></main><script src="../assets/listen.js"></script></body></html>
