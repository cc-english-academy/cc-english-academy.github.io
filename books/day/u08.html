 <section id="talk"><h2>🎭 Let's talk</h2><div class="chat"><button class="c " data-a="audio/u08_d0.mp3"><b style="background:#6b1d2b">Ms. Lina</b><span>Today we are painting a garden.</span></button><button class="c r" data-a="audio/u08_d1.mp3"><b style="background:#2f8f4a">Omar</b><span>I love painting! Can I have the green paint?</span></button><button class="c " data-a="audio/u08_d2.mp3"><b style="background:#6b1d2b">Ms. Lina</b><span>Here you are. What are you painting?</span></button><button class="c r" data-a="audio/u08_d3.mp3"><b style="background:#2f8f4a">Omar</b><span>I'm painting a big tree and a sun.</span></button><button class="c " data-a="audio/u08_d4.mp3"><b style="background:#6b1d2b">Ms. Lina</b><span>Wonderful! Use many colours.</span></button><button class="c r" data-a="audio/u08_d5.mp3"><b style="background:#2f8f4a">Omar</b><span>Look at my picture, Ms. Lina!</span></button><button class="c " data-a="audio/u08_d6.mp3"><b style="background:#6b1d2b">Ms. Lina</b><span>It's beautiful, Omar! Great job.</span></button><button class="c r" data-a="audio/u08_d7.mp3"><b style="background:#2f8f4a">Omar</b><span>Thank you! Now let's tidy up.</span></button></div><button class="all" data-group="chat">▶ Play the dialogue</button><p class="tip">Act it out! Choose a part and read it with a friend.</p></section>
