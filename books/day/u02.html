 <section id="say"><h2>💬 Things I say</h2><div class="says"><button class="s" data-a="audio/u02_p0.mp3"><img class="" src="../img/1f455.webp" alt="" loading="lazy"><span>I put on my T-shirt.</span><i>🔊</i></button><button class="s" data-a="audio/u02_p1.mp3"><img class="" src="../img/1f9e6.webp" alt="" loading="lazy"><span>Where are my socks?</span><i>🔊</i></button><button class="s" data-a="audio/u02_p2.mp3"><img class="" src="../img/1f45f.webp" alt="" loading="lazy"><span>I tie my shoes.</span><i>🔊</i></button><button class="s" data-a="audio/u02_p3.mp3"><img class="" src="../img/1f9e5.webp" alt="" loading="lazy"><span>It's cold. I need my jacket.</span><i>🔊</i></button><button class="s" data-a="audio/u02_p4.mp3"><img class="" src="../img/1f914.webp" alt="" loading="lazy"><span>Which one should I wear?</span><i>🔊</i></button><button class="s" data-a="audio/u02_p5.mp3"><img class="" src="../img/1f64b.webp" alt="" loading="lazy"><span>Can you help me, please?</span><i>🔊</i></button><button class="s" data-a="audio/u02_p6.mp3"><img class="" src="../img/2705.webp" alt="" loading="lazy"><span>I'm ready!</span><i>🔊</i></button><button class="s" data-a="audio/u02_p7.mp3"><img class="" src="../img/1f603.webp" alt="" loading="lazy"><span>I like this colour.</span><i>🔊</i></button></div><button class="all" data-group="says">▶ Play all sentences</button></section>
 <section id="talk"><h2>🎭 Let's talk</h2><div class="chat"><button class="c " data-a="audio/u02_d0.mp3"><b style="background:#2b7bd6">Dad</b><span>Omar, are you dressed?</span></button><button class="c r" data-a="audio/u02_d1.mp3"><b style="background:#2f8f4a">Omar</b><span>Not yet, Dad. Where are my socks?</span></button><button class="c " data-a="audio/u02_d2.mp3"><b style="background:#2b7bd6">Dad</b><span>They are in the drawer.</span></button><button class="c r" data-a="audio/u02_d3.mp3"><b style="background:#2f8f4a">Omar</b><span>Thank you! Can you help me with my shoes?</span></button><button class="c " data-a="audio/u02_d4.mp3"><b style="background:#2b7bd6">Dad</b><span>Of course. Let's tie them together.</span></button><button class="c r" data-a="audio/u02_d5.mp3"><b style="background:#2f8f4a">Omar</b><span>It's cold today. I need my jacket.</span></button><button class="c " data-a="audio/u02_d6.mp3"><b style="background:#2b7bd6">Dad</b><span>Good idea. Here it is.</span></button><button class="c r" data-a="audio/u02_d7.mp3"><b style="background:#2f8f4a">Omar</b><span>I'm ready! Let's go!</span></button></div><button class="all" data-group="chat">▶ Play the dialogue</button><p class="tip">Act it out! Choose a part and read it with a friend.</p></section>
