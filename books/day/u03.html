 <section id="talk"><h2>🎭 Let's talk</h2><div class="chat"><button class="c " data-a="audio/u03_d0.mp3"><b style="background:#2f8f6b">Mum</b><span>Mia, did you brush your teeth?</span></button><button class="c r" data-a="audio/u03_d1.mp3"><b style="background:#8e4fc4">Mia</b><span>Not yet. Where is my toothbrush?</span></button><button class="c " data-a="audio/u03_d2.mp3"><b style="background:#2f8f6b">Mum</b><span>It's next to the mirror.</span></button><button class="c r" data-a="audio/u03_d3.mp3"><b style="background:#8e4fc4">Mia</b><span>Found it! I need toothpaste, please.</span></button><button class="c " data-a="audio/u03_d4.mp3"><b style="background:#2f8f6b">Mum</b><span>Here you are. Brush for two minutes.</span></button><button class="c r" data-a="audio/u03_d5.mp3"><b style="background:#8e4fc4">Mia</b><span>Now I'm washing my face.</span></button><button class="c " data-a="audio/u03_d6.mp3"><b style="background:#2f8f6b">Mum</b><span>Don't forget to dry it with the towel.</span></button><button class="c r" data-a="audio/u03_d7.mp3"><b style="background:#8e4fc4">Mia</b><span>All done! Now I'm clean!</span></button></div><button class="all" data-group="chat">▶ Play the dialogue</button><p class="tip">Act it out! Choose a part and read it with a friend.</p></section>
