 <section id="talk"><h2>🎭 Let's talk</h2><div class="chat"><button class="c " data-a="audio/u04_d0.mp3"><b style="background:#2b7bd6">Dad</b><span>Good morning, Leo! Are you hungry?</span></button><button class="c r" data-a="audio/u04_d1.mp3"><b style="background:#2b7bd6">Leo</b><span>Yes, I'm very hungry!</span></button><button class="c " data-a="audio/u04_d2.mp3"><b style="background:#2b7bd6">Dad</b><span>What would you like for breakfast?</span></button><button class="c r" data-a="audio/u04_d3.mp3"><b style="background:#2b7bd6">Leo</b><span>Can I have an egg and some bread, please?</span></button><button class="c " data-a="audio/u04_d4.mp3"><b style="background:#2b7bd6">Dad</b><span>Sure. Would you like milk or juice?</span></button><button class="c r" data-a="audio/u04_d5.mp3"><b style="background:#2b7bd6">Leo</b><span>Orange juice, please.</span></button><button class="c " data-a="audio/u04_d6.mp3"><b style="background:#2b7bd6">Dad</b><span>Here you are. Enjoy!</span></button><button class="c r" data-a="audio/u04_d7.mp3"><b style="background:#2b7bd6">Leo</b><span>Mmm, it's yummy! Thank you, Dad.</span></button></div><button class="all" data-group="chat">▶ Play the dialogue</button><p class="tip">Act it out! Choose a part and read it with a friend.</p></section>
