 <section id="story"><h2>📖 Read the story</h2><div class="says story"><button class="s" data-a="audio/u20_s0.mp3" style="font-size:1.3rem"><img class="" src="../img/1f992.webp" alt="" loading="lazy"><span>On Saturday, Omar and Dad went to the zoo.</span><i>🔊</i></button><button class="s" data-a="audio/u20_s1.mp3" style="font-size:1.3rem"><img class="" src="../img/1f992.webp" alt="" loading="lazy"><span>First, they saw a tall giraffe eating leaves.</span><i>🔊</i></button><button class="s" data-a="audio/u20_s2.mp3" style="font-size:1.3rem"><img class="" src="../img/1f418.webp" alt="" loading="lazy"><span>Next, they saw an elephant spraying water.</span><i>🔊</i></button><button class="s" data-a="audio/u20_s3.mp3" style="font-size:1.3rem"><img class="" src="../img/1f412.webp" alt="" loading="lazy"><span>Then, a funny monkey jumped from tree to tree.</span><i>🔊</i></button><button class="s" data-a="audio/u20_s4.mp3" style="font-size:1.3rem"><img class="" src="../img/1f981.webp" alt="" loading="lazy"><span>The lion roared, and Omar jumped!</span><i>🔊</i></button><button class="s" data-a="audio/u20_s5.mp3" style="font-size:1.3rem"><img class="" src="../img/1f366.webp" alt="" loading="lazy"><span>After that, they ate ice cream.</span><i>🔊</i></button><button class="s" data-a="audio/u20_s6.mp3" style="font-size:1.3rem"><img class="" src="../img/1f4f8.webp" alt="" loading="lazy"><span>Last, Dad took a photo of Omar.</span><i>🔊</i></button><button class="s" data-a="audio/u20_s7.mp3" style="font-size:1.3rem"><img class="" src="../img/1f603.webp" alt="" loading="lazy"><span>It was the best day ever!</span><i>🔊</i></button></div><button class="all" data-group="story">▶ Read to me</button><p class="tip">👉 Listen first. Then read it by yourself. Tap any sentence to check!</p></section><nav class="pn"><a class="nav" href="u19.html">‹ The Lost Teddy</a><a class="nav home" href="./">All units</a><a class="nav" href="u21.html">The New Girl ›</a></nav></main><script src="../assets/liste
