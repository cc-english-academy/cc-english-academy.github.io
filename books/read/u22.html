 <section id="story"><h2>📖 Read the story</h2><div class="says story"><button class="s" data-a="audio/u22_s0.mp3" style="font-size:1.3rem"><img class="" src="../img/1f975.webp" alt="" loading="lazy"><span>It was a hot day, and a crow was very thirsty.</span><i>🔊</i></button><button class="s" data-a="audio/u22_s1.mp3" style="font-size:1.3rem"><img class="" src="../img/1f3fa.webp" alt="" loading="lazy"><span>He found a jug with a little water in it.</span><i>🔊</i></button><button class="s" data-a="audio/u22_s2.mp3" style="font-size:1.3rem"><img class="" src="../img/1f61f.webp" alt="" loading="lazy"><span>But his beak could not reach the water.</span><i>🔊</i></button><button class="s" data-a="audio/u22_s3.mp3" style="font-size:1.3rem"><img class="" src="../img/1f9e0.webp" alt="" loading="lazy"><span>The crow thought and thought.</span><i>🔊</i></button><button class="s" data-a="audio/u22_s4.mp3" style="font-size:1.3rem"><img class="" src="../img/1faa8.webp" alt="" loading="lazy"><span>Then he picked up a small stone.</span><i>🔊</i></button><button class="s" data-a="audio/u22_s5.mp3" style="font-size:1.3rem"><img class="" src="../img/1faa8.webp" alt="" loading="lazy"><span>He dropped the stones in, one by one.</span><i>🔊</i></button><button class="s" data-a="audio/u22_s6.mp3" style="font-size:1.3rem"><img class="" src="../img/1f4a7.webp" alt="" loading="lazy"><span>The water came up and up until he could drink.</span><i>🔊</i></button><button class="s" data-a="audio/u22_s7.mp3" style="font-size:1.3rem"><img class="" src="../img/1f426-200d-2b1b.webp" alt="" loading="lazy"><span>What a clever crow!</span><i>🔊</i></button></div><button class="all" data-group="story">▶ Read to me</button><p class="tip">👉 Listen first. Then read it by yourself. Tap any sentence to check!</p></section><nav class="pn"><a class="nav" href="u21.html">‹ The New Girl</a><a class="nav home" href="./">All units</a><a class="nav" href="u23.html">Camping Night ›</a></nav></main><script src="../assets/li
