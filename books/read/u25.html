 <section id="story"><h2>📖 Read the story</h2><div class="says story"><button class="s" data-a="audio/u25_s0.mp3" style="font-size:1.3rem"><img class="" src="../img/1f475.webp" alt="" loading="lazy"><span>Grandma was tired because she was very busy.</span><i>🔊</i></button><button class="s" data-a="audio/u25_s1.mp3" style="font-size:1.3rem"><img class="" src="../img/1f64c.webp" alt="" loading="lazy"><span>Sara wanted to help her.</span><i>🔊</i></button><button class="s" data-a="audio/u25_s2.mp3" style="font-size:1.3rem"><img class="" src="../img/1f9f9.webp" alt="" loading="lazy"><span>First, she swept the floor.</span><i>🔊</i></button><button class="s" data-a="audio/u25_s3.mp3" style="font-size:1.3rem"><img class="" src="../img/1f37d-fe0f.webp" alt="" loading="lazy"><span>Next, she washed the dishes.</span><i>🔊</i></button><button class="s" data-a="audio/u25_s4.mp3" style="font-size:1.3rem"><img class="" src="../img/1fab4.webp" alt="" loading="lazy"><span>Then she watered the plants.</span><i>🔊</i></button><button class="s" data-a="audio/u25_s5.mp3" style="font-size:1.3rem"><img class="" src="../img/1f9fa.webp" alt="" loading="lazy"><span>She folded the washing too.</span><i>🔊</i></button><button class="s" data-a="audio/u25_s6.mp3" style="font-size:1.3rem"><img class="" src="../img/1fad6.webp" alt="" loading="lazy"><span>Grandma made them a cup of tea.</span><i>🔊</i></button><button class="s" data-a="audio/u25_s7.mp3" style="font-size:1.3rem"><img class="" src="../img/2764-fe0f.webp" alt="" loading="lazy"><span>&quot;You always help me. Thank you, Sara!&quot;</span><i>🔊</i></button></div><button class="all" data-group="story">▶ Read to me</button><p class="tip">👉 Listen first. Then read it by yourself. Tap any sentence to check!</p></section><nav class="pn"><a class="nav" href="u24.html">‹ The Space Trip</a><a class="nav home" href="./">All units</a><span></span></nav></main><script src="../assets/listen.js"></script></body></html>
