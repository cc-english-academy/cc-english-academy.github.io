 <section id="story"><h2>📖 Read the story</h2><div class="says story"><button class="s" data-a="audio/u18_s0.mp3" style="font-size:1.3rem"><img class="" src="../img/1f422.webp" alt="" loading="lazy"><span>A little turtle lived on the beach.</span><i>🔊</i></button><button class="s" data-a="audio/u18_s1.mp3" style="font-size:1.3rem"><img class="" src="../img/1f30a.webp" alt="" loading="lazy"><span>He wanted to swim in the big blue sea.</span><i>🔊</i></button><button class="s" data-a="audio/u18_s2.mp3" style="font-size:1.3rem"><img class="" src="../img/1f628.webp" alt="" loading="lazy"><span>But the waves were very big, and he was scared.</span><i>🔊</i></button><button class="s" data-a="audio/u18_s3.mp3" style="font-size:1.3rem"><img class="" src="../img/1f980.webp" alt="" loading="lazy"><span>A crab said, &quot;Don't be scared. You can do it!&quot;</span><i>🔊</i></button><button class="s" data-a="audio/u18_s4.mp3" style="font-size:1.3rem"><img class="" src="../img/1f4aa.webp" alt="" loading="lazy"><span>The little turtle was brave.</span><i>🔊</i></button><button class="s" data-a="audio/u18_s5.mp3" style="font-size:1.3rem"><img class="" src="../img/1f30a.webp" alt="" loading="lazy"><span>He walked through the sand and into the waves.</span><i>🔊</i></button><button class="s" data-a="audio/u18_s6.mp3" style="font-size:1.3rem"><img class="" src="../img/1f420.webp" alt="" loading="lazy"><span>He swam and swam, and he found many new friends.</span><i>🔊</i></button><button class="s" data-a="audio/u18_s7.mp3" style="font-size:1.3rem"><img class="" src="../img/1f3e0.webp" alt="" loading="lazy"><span>Now the sea is his new home.</span><i>🔊</i></button></div><button class="all" data-group="story">▶ Read to me</button><p class="tip">👉 Listen first. Then read it by yourself. Tap any sentence to check!</p></section><nav class="pn"><a class="nav" href="u17.html">‹ Grandma's Cake</a><a class="nav home" href="./">All units</a><a class="nav" href="u19.html">The Lost Teddy ›</a></nav></
