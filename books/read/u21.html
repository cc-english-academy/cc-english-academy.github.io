 <section id="story"><h2>📖 Read the story</h2><div class="says story"><button class="s" data-a="audio/u21_s0.mp3" style="font-size:1.3rem"><img class="" src="../img/1f469-200d-1f3eb.webp" alt="" loading="lazy"><span>One day, a new girl came to Mia's class.</span><i>🔊</i></button><button class="s" data-a="audio/u21_s1.mp3" style="font-size:1.3rem"><img class="" src="../img/1f61f.webp" alt="" loading="lazy"><span>Her name was Lily, and she was very shy.</span><i>🔊</i></button><button class="s" data-a="audio/u21_s2.mp3" style="font-size:1.3rem"><img class="" src="../img/1f636.webp" alt="" loading="lazy"><span>At break time, she sat alone.</span><i>🔊</i></button><button class="s" data-a="audio/u21_s3.mp3" style="font-size:1.3rem"><img class="" src="../img/1f64b.webp" alt="" loading="lazy"><span>Mia walked over and said, &quot;Hello! Do you want to play?&quot;</span><i>🔊</i></button><button class="s" data-a="audio/u21_s4.mp3" style="font-size:1.3rem"><img class="" src="../img/1f60a.webp" alt="" loading="lazy"><span>Lily smiled and said, &quot;Yes, please!&quot;</span><i>🔊</i></button><button class="s" data-a="audio/u21_s5.mp3" style="font-size:1.3rem"><img class="" src="../img/1f58d-fe0f.webp" alt="" loading="lazy"><span>They drew pictures with Mia's crayons.</span><i>🔊</i></button><button class="s" data-a="audio/u21_s6.mp3" style="font-size:1.3rem"><img class="" src="../img/1f91d.webp" alt="" loading="lazy"><span>Soon they were good friends.</span><i>🔊</i></button><button class="s" data-a="audio/u21_s7.mp3" style="font-size:1.3rem"><img class="" src="../img/2764-fe0f.webp" alt="" loading="lazy"><span>Being kind makes everyone happy.</span><i>🔊</i></button></div><button class="all" data-group="story">▶ Read to me</button><p class="tip">👉 Listen first. Then read it by yourself. Tap any sentence to check!</p></section><nav class="pn"><a class="nav" href="u20.html">‹ A Day at the Zoo</a><a class="nav home" href="./">All units</a><a class="nav" href="u22.html">The Clever Cro
