<style>

@font-face{font-family:Cairo;font-weight:900;src:url(../assets/fonts/cairo-arabic-900-normal.woff2)}@font-face{font-family:Cairo;font-weight:600;src:url(../assets/fonts/cairo-latin-600-normal.woff2);unicode-range:U+0000-024F}@font-face{font-family:Cairo;font-weight:700;src:url(../assets/fonts/cairo-latin-700-normal.woff2);unicode-range:U+0000-024F}@font-face{font-family:Cairo;font-weight:900;src:url(../assets/fonts/cairo-latin-900-normal.woff2);unicode-range:U+0000-024F}
:root{--m:#6b1d2b;--d:#3d0c14;--g:#e2bd62;--c:#fbf0e4;--ink:#2a1015;--line:#ecd3c3;--ok:#25d366}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f4ece4;color:var(--ink);font-family:Cairo,"Segoe UI",Tahoma,sans-serif}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:linear-gradient(#f9f1e9,#f1e6dc)}
.banner{background:radial-gradient(circle at 80% 0,#9b3249,transparent 55%),linear-gradient(135deg,#6b1d2b,#3d0c14);color:#fff;padding:20px 18px 100px;text-align:center;position:relative;overflow:hidden}
.banner::after{content:"";position:absolute;inset:auto -10% -40px;height:80px;background:#f9f1e9;border-radius:50% 50% 0 0}
.banner small{font-weight:700;letter-spacing:.25em;color:var(--g);font-size:11px;direction:ltr;display:block}
.banner h1{margin:4px 0 2px;font-size:20px;font-weight:900;line-height:1.4}
.banner p{margin:0;font-size:13px;color:#f6dfc9}
.badges{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}

main{flex:1;padding:0 16px 120px;margin-top:-40px;position:relative;z-index:1}
.card{background:#fff;border-radius:20px;box-shadow:0 6px 24px rgba(61,12,20,.08);padding:18px;margin-bottom:14px}
.intro{text-align:center;padding-top:52px;position:relative}
.logo{position:absolute;top:-44px;left:50%;transform:translateX(-50%);width:92px;height:92px;border-radius:50%;background:#fbf0e4;border:4px solid #fff;box-shadow:0 6px 18px rgba(61,12,20,.18);display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo img{width:78%}
.intro .org{color:#7a6a6e;font-size:14px;margin:0}
.intro h2{margin:6px 0;font-size:23px;font-weight:900;line-height:1.45}
.intro p{margin:6px 0 0;font-size:15px;line-height:1.8}
.intro b{color:var(--m)}
.q h3{margin:0 0 10px;font-size:19px;font-weight:900}
.q .sub{margin:-6px 0 10px;color:#7a6a6e;font-size:13px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid #f0e4da;padding:14px 2px;font:inherit;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;text-align:right}
.opt:last-child{border-bottom:0}
.opt .r{flex:none;width:26px;height:26px;border-radius:50%;border:2.5px solid #9a8a8e;display:grid;place-items:center}
.opt.on .r{border-color:var(--m);background:var(--m);box-shadow:inset 0 0 0 4px #fff}
.opt .em{font-size:20px;margin-left:8px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:15px}
.field input,.field select{font:inherit;font-size:16px;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:#fffdfb;color:var(--ink);width:100%}
.field input:focus,.field select:focus{outline:none;border-color:var(--m)}
.phone{display:flex;gap:8px;direction:ltr}.phone select{width:118px;flex:none}.phone input{flex:1;direction:ltr;text-align:left}
.err{color:#c0392b;font-size:13px;min-height:18px;margin:-6px 0 6px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fffcf9ee;backdrop-filter:blur(8px);border-top:1px solid #efe2d8;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bottom .in{max-width:488px;margin:0 auto}
.steps{display:flex;gap:6px;margin-bottom:10px;direction:rtl}.steps i{flex:1;height:6px;border-radius:99px;background:#ddd2ca;transition:background .3s}.steps i.on{background:var(--m)}
.cta{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-size:18px;font-weight:900;color:#fff;background:var(--m);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.cta[disabled]{background:#c9b8b0;cursor:default}
.cta.wa{background:var(--ok)}
.back{background:none;border:0;color:var(--m);font:inherit;font-weight:700;margin:0 0 8px;cursor:pointer;padding:0;font-size:14px}
.done{text-align:center}
.done .big{font-size:56px;line-height:1}
.done h2{margin:6px 0;font-size:22px;font-weight:900;color:var(--m)}
.done p{margin:6px 0;line-height:1.8}
.links{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.links a{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px;font-weight:900;text-decoration:none;font-size:16px}
.links .l1{background:var(--ok);color:#fff}.links .l2{background:var(--m);color:#fff}.links .l3{background:#fff;color:var(--m);border:2px solid var(--m)}
.foot{text-align:center;color:#9a8a8e;font-size:12px;margin-top:6px}.foot a{color:var(--m)}
.fade{animation:fade .3s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="banner">
    <small>CODECADEMY · LEARN BY LIVING IT ♥</small>
    <h1>إنجليزي بالمعايشة لطفلك من البيت</h1>
    <p>حصص أونلاين مباشرة مع مدرّسين متحدثين بالإنجليزية</p>
    <div class="badges"><span>✔ اختبار مستوى مجاني</span><span>✔ تطبيقات تفاعلية مجانًا</span><span>✔ 9 مستويات</span></div>
  </header>
  <main id="main"></main>
</div>
<div class="bottom"><div class="in"><div class="steps" id="steps"></div><button class="cta" id="next" disabled>متابعة</button></div></div>

<script>
var WA="966538840330",WA_LINK="https://wa.me/message/SMLAW2VMJXCQE1",SITE="https://ccdemy.com/";
var Q=[
 {k:"age",t:"عمر الطفل",o:[["👶","من 4 إلى 6 سنوات"],["🧒","من 7 إلى 9 سنوات"],["👦","من 10 إلى 12 سنة"],["🧑","من 13 إلى 15 سنة"]]},
 {k:"goal",t:"ما هدفك من تعلّم طفلك الإنجليزي؟",o:[["🗣️","التحدث بطلاقة وثقة"],["🔤","التأسيس: الحروف والصوتيات"],["📖","القراءة والكتابة"],["🏫","تحسين مستواه في المدرسة"],["✈️","الاستعداد للسفر أو الاختبارات"]]},
 {k:"level",t:"مستوى الطفل الحالي في الإنجليزي",s:"لا تقلق، نحدد المستوى بدقة باختبار مجاني",o:[["🌱","مبتدئ تمامًا"],["🙂","يعرف الأساسيات"],["⭐","متوسط"],["🚀","متقدم"],["❓","لا أعرف"]]},
 {k:"plan",t:"الباقة المناسبة لك",o:[["📅","حصتان أسبوعيًا (8 حصص شهريًا)"],["🗓️","3 حصص أسبوعيًا (12 حصة شهريًا)"],["💬","أحتاج استشارة لاختيار الباقة"]]},
 {k:"time",t:"الوقت المناسب للحصص",o:[["🌅","صباحًا"],["☀️","بعد الظهر"],["🌆","مساءً"],["🔁","مرن"]]},
 {k:"info",form:1}
];
var A={},step=-1;
try{A=JSON.parse(sessionStorage.getItem("ccjoin")||"{}")}catch(e){}
var main=document.getElementById("main"),btn=document.getElementById("next"),stepsEl=document.getElementById("steps");
function save(){try{sessionStorage.setItem("ccjoin",JSON.stringify(A))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function bar(){stepsEl.innerHTML=Q.map(function(_,i){return '<i class="'+(i<=step?"on":"")+'"></i>'}).join("")}
function intro(){return '<section class="card intro fade"><div class="logo"><img src="../assets/logo.png" alt="CODECADEMY"></div><p class="org">CODECADEMY · أكاديمية الإنجليزي للأطفال</p><h2>ضغطة واحدة تفصل طفلك<br>عن الإنجليزي بثقة 🇬🇧</h2><p>منهج تفاعلي ممتع يتعلم فيه طفلك بالمعايشة<br>باقات تبدأ من <b>150 ريال شهريًا</b><br>أجب عن أسئلة بسيطة، وسيتواصل معك فريق Codecademy على الواتساب</p></section>'}
function render(){bar();var h=intro();
 if(step>=0&&step<Q.length){var q=Q[step];
  h=(step>0?'':h)+'<section class="card q fade">'+(step>0?'<button class="back" id="back">→ رجوع</button>':'');
  if(q.form){h+='<h3>بيانات التواصل</h3><p class="sub">سنرسل لك تفاصيل الباقات وموعد الاختبار المجاني</p>'+
   '<div class="field"><label for="pn">اسم ولي الأمر</label><input id="pn" autocomplete="name" value="'+esc(A.pn||"")+'" placeholder="مثال: أم أحمد"></div>'+
   '<div class="field"><label for="cn">اسم الطفل</label><input id="cn" value="'+esc(A.cn||"")+'" placeholder="مثال: أحمد"></div>'+
   '<div class="field"><label for="ph">رقم الواتساب</label><div class="phone"><select id="cc" aria-label="مفتاح الدولة">'+[["+966","🇸🇦 +966"],["+20","🇪🇬 +20"],["+971","🇦🇪 +971"],["+965","🇰🇼 +965"],["+974","🇶🇦 +974"],["+973","🇧🇭 +973"],["+968","🇴🇲 +968"],["+962","🇯🇴 +962"],["","أخرى"]].map(function(c){return '<option value="'+c[0]+'"'+((A.cc||"+966")==c[0]?" selected":"")+'>'+c[1]+'</option>'}).join("")+'</select><input id="ph" type="tel" inputmode="tel" autocomplete="tel-national" value="'+esc(A.ph||"")+'" placeholder="5XXXXXXXX"></div></div><p class="err" id="err"></p>'}
  else{h+='<h3>'+q.t+'</h3>'+(q.s?'<p class="sub">'+q.s+'</p>':'')+q.o.map(function(o,i){return '<button class="opt'+(A[q.k]==o[1]?" on":"")+'" data-v="'+esc(o[1])+'"><span><span class="em">'+o[0]+'</span>'+o[1]+'</span><span class="r"></span></button>'}).join("")}
  h+='</section>'}
 else if(step<0){h+='<section class="card q fade"><h3>'+Q[0].t+'</h3>'+Q[0].o.map(function(o){return '<button class="opt'+(A.age==o[1]?" on":"")+'" data-v="'+esc(o[1])+'"><span><span class="em">'+o[0]+'</span>'+o[1]+'</span><span class="r"></span></button>'}).join("")+'</section>';}
 if(step===Q.length){h='<section class="card done fade"><div class="big">🎉</div><h2>شكرًا لك'+(A.pn?"، "+esc(A.pn):"")+'!</h2><p>تم تجهيز رسالتك. اضغط على الزر لإرسالها لنا على الواتساب، وسنرد عليك في أقرب وقت.</p><div class="links"><a class="l1" id="sendAgain" href="'+waURL()+'" target="_blank" rel="noopener">إرسال على الواتساب 💬</a><a class="l2" href="'+SITE+'english.html#level-test" target="_blank" rel="noopener">ابدأ اختبار المستوى المجاني 📝</a><a class="l3" href="'+SITE+'" target="_blank" rel="noopener">زيارة موقع Codecademy 🌐</a></div></section>';btn.parentNode.parentNode.style.display="none"}
 else btn.parentNode.parentNode.style.display="";
 h+='<p class="foot"><a href="'+SITE+'" target="_blank" rel="noopener">ccdemy.com</a> · <a href="'+WA_LINK+'" target="_blank" rel="noopener">تواصل معنا على الواتساب</a></p>';
 main.innerHTML=h;window.scrollTo({top:0,behavior:"smooth"});
 var cur=step<0?Q[0]:Q[step];
 [].forEach.call(main.querySelectorAll(".opt"),function(b){b.onclick=function(){A[cur.k]=b.getAttribute("data-v");save();[].forEach.call(main.querySelectorAll(".opt"),function(x){x.classList.toggle("on",x===b)});btn.disabled=false;if(step<0)step=0;setTimeout(function(){go(1)},260)}});
 var bk=document.getElementById("back");if(bk)bk.onclick=function(){go(-1)};
 if(cur&&cur.form){btn.textContent="إرسال على الواتساب 💬";btn.classList.add("wa");var chk=function(){A.pn=val("pn");A.cn=val("cn");A.ph=val("ph").replace(/[^0-9]/g,"");A.cc=document.getElementById("cc").value;save();btn.disabled=!(A.pn&&A.ph.length>=7)};["pn","cn","ph","cc"].forEach(function(id){document.getElementById(id).oninput=chk;document.getElementById(id).onchange=chk});chk()}
 else{btn.textContent="متابعة";btn.classList.remove("wa");btn.disabled=!(cur&&A[cur.k])}
}
function val(id){return document.getElementById(id).value.trim()}
function waURL(){var t="السلام عليكم 👋\nأرغب في تسجيل طفلي في أكاديمية Codecademy\n\n"+
 "👤 ولي الأمر: "+(A.pn||"")+"\n🧒 اسم الطفل: "+(A.cn||"—")+"\n🎂 العمر: "+(A.age||"")+"\n🎯 الهدف: "+(A.goal||"")+"\n📊 المستوى: "+(A.level||"")+"\n📦 الباقة: "+(A.plan||"")+"\n⏰ الوقت المناسب: "+(A.time||"")+"\n📱 الواتساب: "+(A.cc||"")+" "+(A.ph||"");
 return "https://wa.me/"+WA+"?text="+encodeURIComponent(t)}
function go(d){var cur=step<0?Q[0]:Q[step];if(d>0&&cur&&cur.form){var e=document.getElementById("err");if(!A.pn){e.textContent="من فضلك اكتب الاسم";return}if(!A.ph||A.ph.length<7){e.textContent="من فضلك اكتب رقم واتساب صحيح";return}window.open(waURL(),"_blank");step=Q.length;render();return}
 step=Math.max(0,Math.min(Q.length,step+d));render()}
btn.onclick=function(){if(step<0)step=0;go(1)};
render();
</script>
</body>
