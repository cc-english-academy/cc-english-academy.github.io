:root{
  --wine:#7a2435; --wine-d:#57131e; --wine-dd:#3d0c14;
  --cream:#fdf3e6; --cream-2:#f7e6d0; --paper:#fffaf3;
  --gold:#e2bd62; --gold-d:#b8913a; --gold-l:#fbe7a6;
  --ink:#2b1418; --muted:#7a5a60;
  --mint:#7cc6a4; --sky:#8fc8e8; --coral:#f08a7e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Fredoka,system-ui,sans-serif;background:var(--cream);color:var(--ink);overflow-x:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;background:none}
.app{max-width:960px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* top bar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--wine);color:#fff;border-bottom:5px solid var(--gold);border-radius:0 0 22px 22px;box-shadow:0 6px 16px rgba(61,12,20,.25)}
.bar .logo{width:46px;height:46px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);background:#fff;flex:none}
.bar .ttl{line-height:1;flex:1;min-width:0}
.bar .ttl b{display:block;font-weight:700;font-size:22px;letter-spacing:.5px;color:var(--gold-l)}
.bar .ttl small{font-size:12px;letter-spacing:2.5px;color:#f3d9c9;font-weight:600}
.pill{display:flex;align-items:center;gap:6px;background:var(--wine-d);border:2px solid var(--gold);border-radius:999px;padding:4px 12px 4px 6px;font-weight:700;font-size:20px;color:var(--gold-l)}
.pill img{width:26px;height:26px}
.homebtn{width:46px;height:46px;border-radius:50%;background:var(--gold);color:var(--wine-dd);font-size:24px;display:grid;place-items:center;box-shadow:0 4px 0 var(--gold-d);flex:none}
.homebtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d)}
.homebtn svg{width:26px;height:26px}

.screen{display:none;flex:1;padding:18px 16px 40px;animation:pop .35s ease}
.screen.on{display:block}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

/* mascot */
.coco{display:flex;align-items:flex-end;gap:10px}
.coco svg.owl{flex:none;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.owl .lid{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.bubble{flex:1;position:relative;background:#fff;border:3px solid var(--wine);border-radius:22px;padding:12px 16px;font-weight:600;font-size:20px;line-height:1.3;box-shadow:0 4px 0 var(--wine)}
.bubble::before{display:none;content:"";position:absolute;left:-14px;bottom:18px;border:10px solid transparent;border-right:14px solid var(--wine)}
.bubble::after{display:none;content:"";position:absolute;left:-8px;bottom:21px;border:7px solid transparent;border-right:10px solid #fff}

/* home */
.hero{background:linear-gradient(180deg,#fff7ec,#f9e4cc);border:3px solid var(--gold);border-radius:30px;padding:20px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(34px,7vw,56px);color:var(--wine);line-height:1;font-weight:700}
.hero h1 span{color:var(--gold-d)}
.hero p.sub{font-size:18px;color:var(--muted);margin:6px 0 14px;font-weight:500}
.floaty{position:absolute;font-family:Andika;font-weight:700;color:rgba(122,36,53,.09);font-size:90px;pointer-events:none;animation:drift 7s ease-in-out infinite}
@keyframes drift{50%{transform:translateY(-14px) rotate(6deg)}}
.parade{display:flex;gap:4px;margin:0 0 12px;flex-wrap:wrap}
.parade img{width:clamp(38px,9vw,56px);height:clamp(38px,9vw,56px);animation:hop 1.8s ease-in-out infinite;filter:drop-shadow(0 4px 0 rgba(61,12,20,.12))}
.parade img:nth-child(2){animation-delay:-.25s}.parade img:nth-child(3){animation-delay:-.5s}.parade img:nth-child(4){animation-delay:-.75s}.parade img:nth-child(5){animation-delay:-1s}.parade img:nth-child(6){animation-delay:-1.25s}.parade img:nth-child(7){animation-delay:-1.5s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px) rotate(-6deg)}}
.node .np{position:absolute;left:-14px;bottom:-8px;width:34px;height:34px;background:#fff;border-radius:50%;padding:4px;box-shadow:0 3px 0 rgba(61,12,20,.18)}
.deco{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none;animation:drift 5s ease-in-out infinite}
.castle{position:absolute;width:86px;height:86px;margin:-50px 0 0 -43px;text-align:center;font-weight:700;color:var(--wine);font-size:14px}
.castle img{width:70px;height:70px;animation:bob 2.4s ease-in-out infinite}
.abcb{position:absolute;right:12px;top:14px;font-family:Andika;font-weight:700;font-size:34px;line-height:1;background:var(--gold-l);color:var(--wine);border-radius:18px;padding:8px 12px;box-shadow:0 5px 0 rgba(0,0,0,.18);transform:rotate(-6deg);letter-spacing:1px}
.abcb.sm{position:static;font-size:24px;padding:6px 10px;border-radius:14px;box-shadow:0 4px 0 var(--gold-d);background:var(--wine);color:var(--gold-l)}
.lsongs{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px;margin-top:10px}
.lsong{background:#fff;border:3px solid var(--cream-2);border-radius:20px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;font-family:Andika;font-weight:700;font-size:22px;color:var(--wine);box-shadow:0 4px 0 var(--cream-2)}
.lsong img{width:38px;height:38px}
.lsong:active{transform:translateY(3px)}
h3.sub2{font-size:24px;color:var(--wine);margin:22px 0 2px;display:flex;align-items:center;gap:8px}
h3.sub2 img{width:32px}
.player{position:relative;overflow:hidden}
.phead{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.phead .pl{font-family:Andika;font-weight:700;font-size:64px;line-height:1;color:var(--wine)}.phead .pl span{color:var(--gold-d)}
.phead img{width:72px;height:72px;animation:bob 2.4s ease-in-out infinite}
.phead b{font-size:24px;color:var(--wine);display:block}.phead small{color:var(--muted);font-size:15px}
.kline .wd{display:inline-block;margin-right:.28em;transition:transform .12s,color .12s}
.kline .wd.on{color:var(--gold-l);transform:translateY(-6px) scale(1.18)}
.kline.echo{background:var(--gold-l);color:var(--wine-dd);transform:scale(1.03);box-shadow:0 5px 0 var(--gold-d)}
.yourturn{text-align:center;font-weight:700;font-size:22px;color:var(--wine);min-height:34px;margin-top:10px}
.abct.echo{background:var(--gold-l);border-color:var(--gold-d);animation:yay .6s}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}
.tile{position:relative;border-radius:28px;padding:18px 16px 16px;text-align:left;color:#fff;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 7px 0 rgba(0,0,0,.18);overflow:hidden;transition:transform .12s}
.tile:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile img{position:absolute;right:12px;top:12px;width:70px;height:70px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.tile b{font-size:26px;font-weight:700;line-height:1.05}
.tile small{font-size:15px;opacity:.92;font-weight:500}
.t1{background:linear-gradient(140deg,#8e2c40,#5e1525)}
.t2{background:linear-gradient(140deg,#d7a845,#b0842c);color:var(--wine-dd)}
.t3{background:linear-gradient(140deg,#c9566a,#93273b)}
.t4{background:linear-gradient(140deg,#4f9f84,#2f7a62)}
.progress{margin-top:16px;background:#fff;border:3px solid var(--cream-2);border-radius:20px;padding:12px 16px;display:flex;align-items:center;gap:14px}
.progress .track{flex:1;height:16px;background:var(--cream-2);border-radius:99px;overflow:hidden}
.progress .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-d));border-radius:99px;transition:width .6s}
.progress b{font-size:18px;color:var(--wine);white-space:nowrap}

/* map */
.mapwrap{position:relative;background:linear-gradient(180deg,#fbeedd 0%,#f6dcc0 100%);border:3px solid var(--gold);border-radius:30px;overflow:hidden;margin-top:14px}
.mapwrap svg.bg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:50%;display:grid;place-items:center;font-family:Andika;font-weight:700;font-size:calc(var(--s)*.46);color:#fff;background:var(--wine);border:4px solid #fff;box-shadow:0 6px 0 var(--wine-dd),0 8px 14px rgba(61,12,20,.25);transition:transform .15s}
.node:nth-child(odd){background:var(--gold-d);box-shadow:0 6px 0 #8a6a25,0 8px 14px rgba(61,12,20,.25)}
.node:active{transform:translateY(4px) scale(.96)}
.node .st{position:absolute;right:-8px;top:-8px;width:30px;height:30px}
.node .pip{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.node .pip i{width:8px;height:8px;border-radius:50%;background:#fff;opacity:.45;border:1px solid rgba(0,0,0,.15)}
.node .pip i.y{background:var(--gold-l);opacity:1}
.node.done{background:linear-gradient(140deg,#8e2c40,#5e1525)}
.node.next{animation:pulse 1.3s infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 var(--wine-dd),0 0 0 10px rgba(226,189,98,.55)}}

/* letter screen */
.lhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lhead .nav{width:48px;height:48px;border-radius:50%;background:#fff;border:3px solid var(--wine);color:var(--wine);font-size:26px;font-weight:700;display:grid;place-items:center;flex:none}
.steps{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.step{background:#fff;border:3px solid var(--cream-2);border-radius:16px;padding:6px 2px;font-weight:600;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.step img{width:28px;height:28px}
.step.on{border-color:var(--wine);color:var(--wine);background:#fff6ea;transform:translateY(-2px)}
.step.ok{border-color:var(--gold);background:var(--gold-l);color:var(--wine-dd)}
.card{background:#fff;border:3px solid var(--gold);border-radius:30px;padding:18px;box-shadow:0 8px 0 var(--cream-2)}
.meet{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center}
.bigletter{font-family:Andika;font-weight:700;font-size:clamp(110px,24vw,200px);line-height:1;color:var(--wine);text-align:center;cursor:pointer;animation:wiggle 2.8s ease-in-out infinite}
.bigletter span{color:var(--gold-d)}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-5deg) scale(1.04)}20%{transform:rotate(4deg)}30%{transform:rotate(0)}}
.pic{text-align:center;cursor:pointer}
.pic img{width:min(190px,38vw);height:min(190px,38vw);filter:drop-shadow(0 8px 0 rgba(61,12,20,.12));transition:transform .2s}
.pic img:active{transform:scale(.92)}
.pic .w{font-size:clamp(28px,6vw,40px);font-weight:700;color:var(--ink)}
.pic .w b{color:var(--wine);font-family:Andika}
.sbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.sbtn{display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;font-weight:700;font-size:19px;background:var(--wine);color:#fff;box-shadow:0 5px 0 var(--wine-dd)}
.sbtn.g{background:var(--gold);color:var(--wine-dd);box-shadow:0 5px 0 var(--gold-d)}
.sbtn.w{background:#fff;color:var(--wine);border:3px solid var(--wine);box-shadow:0 5px 0 var(--wine)}
.sbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--wine-dd)}
.sbtn svg{width:22px;height:22px}
.more{display:flex;gap:12px;justify-content:center;margin-top:16px}
.mini{background:var(--cream);border:3px solid var(--cream-2);border-radius:22px;padding:8px 14px;text-align:center;cursor:pointer;font-weight:600;font-size:18px}
.mini img{width:64px;height:64px;display:block;margin:0 auto 2px}
.mini b{color:var(--wine);font-family:Andika}
.soundtag{display:inline-block;margin-top:6px;background:var(--gold-l);color:var(--wine-dd);border-radius:12px;padding:2px 12px;font-weight:700;font-size:22px}

/* trace */
.tracebox{position:relative;margin:0 auto;width:100%;max-width:560px;touch-action:none}
.tracebox canvas{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:22px}
.tracebox canvas.bgc{position:relative;display:block;background:#fffdf8;border:3px dashed var(--cream-2)}
.tcontrols{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.crayon{width:40px;height:40px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 3px var(--cream-2)}
.crayon.on{box-shadow:0 0 0 4px var(--wine);transform:scale(1.12)}
.case{display:flex;background:var(--cream-2);border-radius:999px;padding:4px}
.case button{font-family:Andika;font-weight:700;font-size:24px;padding:4px 18px;border-radius:999px;color:var(--muted)}
.case button.on{background:var(--wine);color:#fff}
.case button.ok::after{content:" ★";color:var(--gold)}
.meter{max-width:560px;margin:12px auto 0;height:14px;background:var(--cream-2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),#3f9f7c);transition:width .25s}

/* song */
.karaoke{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.kline{font-size:clamp(22px,4.5vw,30px);font-weight:600;padding:10px 16px;border-radius:18px;background:var(--cream);color:var(--muted);transition:all .25s}
.kline.on{background:var(--wine);color:#fff;transform:scale(1.03);box-shadow:0 5px 0 var(--wine-dd)}
.kline b{font-family:Andika}
.notes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.note{position:absolute;bottom:-40px;font-size:30px;animation:rise 2.6s linear forwards}
@keyframes rise{to{transform:translateY(-480px) rotate(30deg);opacity:0}}
.abcgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:12px 0}
.abct{aspect-ratio:1;border-radius:16px;background:var(--cream);border:3px solid var(--cream-2);display:grid;place-items:center;font-family:Andika;font-weight:700;font-size:clamp(22px,5vw,36px);color:var(--wine);transition:all .15s}
.abct.on{background:var(--wine);color:var(--gold-l);border-color:var(--gold);transform:scale(1.15) rotate(-4deg)}
.abct.was{background:var(--gold-l);border-color:var(--gold)}
.lyric{text-align:center;font-size:clamp(20px,4.5vw,28px);font-weight:600;min-height:40px;color:var(--wine)}
.lyric span{transition:color .1s;color:#c9b2a8}
.lyric span.on{color:var(--wine)}
.songlist{display:grid;gap:12px}
.songrow{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--gold);border-radius:24px;padding:12px 16px;text-align:left;box-shadow:0 5px 0 var(--cream-2)}
.songrow img{width:56px;height:56px}
.songrow b{font-size:22px;color:var(--wine);display:block}
.songrow small{color:var(--muted);font-size:15px}

/* games */
.ghub{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.gq{text-align:center;font-size:clamp(22px,5vw,30px);font-weight:700;color:var(--wine);margin-bottom:10px}
.gq .tgt{font-family:Andika;background:var(--gold-l);border-radius:12px;padding:0 10px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.opt{aspect-ratio:1;border-radius:26px;background:#fff;border:4px solid var(--cream-2);font-family:Andika;font-weight:700;font-size:clamp(48px,12vw,90px);color:var(--wine);box-shadow:0 7px 0 var(--cream-2);display:grid;place-items:center}
.opt:active{transform:translateY(4px)}
.opt.right{background:#e3f5ec;border-color:var(--mint);box-shadow:0 7px 0 #5aa886;animation:yay .5s}
.opt.wrong{animation:shake .4s;background:#fde9e6;border-color:var(--coral)}
.opt img{width:70%;height:70%}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes yay{50%{transform:scale(1.12) rotate(-4deg)}}
.gpic{display:block;margin:0 auto;width:min(170px,40vw);height:min(170px,40vw);cursor:pointer;animation:bob 2.4s ease-in-out infinite}
.gstat{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700;color:var(--wine);font-size:18px}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--cream-2)}
.dots i.y{background:var(--gold)}
.sky{position:relative;height:min(64vh,520px);border-radius:26px;overflow:hidden;background:linear-gradient(180deg,#cfe8f5,#fdf3e6);border:3px solid var(--gold)}
.balloon{position:absolute;width:84px;height:104px;border-radius:50% 50% 48% 48%;display:grid;place-items:center;font-family:Andika;font-weight:700;font-size:44px;color:#fff;cursor:pointer;box-shadow:inset -10px -12px 0 rgba(0,0,0,.12)}
.balloon::after{content:"";position:absolute;bottom:-34px;left:50%;width:2px;height:34px;background:rgba(61,12,20,.35)}
.balloon::before{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-bottom-color:inherit}
.boom{position:absolute;font-size:46px;pointer-events:none;animation:boom .5s forwards}
@keyframes boom{to{transform:scale(1.8);opacity:0}}
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mcard{aspect-ratio:3/4;perspective:600px;cursor:pointer}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.flip .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mcard .f{background:linear-gradient(140deg,#8e2c40,#5e1525);border:4px solid var(--gold)}
.mcard .f img{width:44%;opacity:.9}
.mcard .b{background:#fff;border:4px solid var(--gold);transform:rotateY(180deg);font-family:Andika;font-weight:700;font-size:clamp(40px,10vw,70px);color:var(--wine)}
.mcard.got .b{background:var(--gold-l)}
.bubbles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:10px}
.bub{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 28%,#fff 0 12%,rgba(255,255,255,.4) 13% 30%,transparent 31%),radial-gradient(circle,#fbe9f0,#f3c8d3);border:3px solid rgba(122,36,53,.25);display:grid;place-items:center;font-family:Andika;font-weight:700;font-size:clamp(34px,8vw,58px);color:var(--wine);animation:float 3s ease-in-out infinite}
.bub:nth-child(3n){animation-delay:-1s;background:radial-gradient(circle at 30% 28%,#fff 0 12%,rgba(255,255,255,.4) 13% 30%,transparent 31%),radial-gradient(circle,#fff5d6,#f4dc9b)}
.bub:nth-child(3n+1){animation-delay:-2s;background:radial-gradient(circle at 30% 28%,#fff 0 12%,rgba(255,255,255,.4) 13% 30%,transparent 31%),radial-gradient(circle,#e4f4fb,#b9def0)}
.bub.gone{animation:popb .35s forwards}
.bub.wrong{animation:shake .4s}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes popb{to{transform:scale(1.5);opacity:0;visibility:hidden}}

/* stickers */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.stk{aspect-ratio:1;border-radius:22px;background:#fff;border:3px dashed var(--cream-2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Andika;font-weight:700;font-size:20px;color:#cdb8ae}
.stk img{width:58%;filter:grayscale(1) opacity(.18)}
.stk.got{border:3px solid var(--gold);background:radial-gradient(circle,#fff,#fdf1d6);color:var(--wine);box-shadow:0 5px 0 var(--cream-2)}
.stk.got img{filter:drop-shadow(0 3px 0 rgba(0,0,0,.12));animation:wiggle 3s infinite}

h2.sec{font-size:30px;color:var(--wine);margin-bottom:12px;display:flex;align-items:center;gap:10px}
h2.sec img{width:40px}
.center{text-align:center}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:60;background:#fff;border:5px solid var(--gold);border-radius:34px;padding:22px 30px;text-align:center;box-shadow:0 14px 0 var(--wine),0 20px 40px rgba(0,0,0,.25);transition:all .3s cubic-bezier(.3,1.6,.5,1);min-width:260px}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.toast img{width:110px;height:110px}
.toast b{display:block;font-size:34px;color:var(--wine)}
.toast p{font-size:18px;color:var(--muted);margin:4px 0 12px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:55}
.foot{text-align:center;color:var(--muted);font-size:13px;padding:10px 0 20px}
@media (max-width:560px){
  .meet{grid-template-columns:1fr}
  .tiles{gap:10px}.tile{min-height:132px;padding:14px}.tile b{font-size:22px}.tile img{width:56px;height:56px}
  .step span{font-size:12px}
  .ghub{grid-template-columns:1fr 1fr}
  .opts{gap:8px}
  .bubble{font-size:17px}
  .bar .ttl small{display:none}
}
</style>
</head>

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d=.15,type="sine",v=.18,when=0){const a=ac();if(!a)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(dst());o.start(t);o.stop(t+d+.05)}
const sfx={
 ok(){[523,659,784,1046].forEach((f,i)=>tone(f,.18,"triangle",.16,i*.07))},

 pop(){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(120,t+.12);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g).connect(dst());o.start(t);o.stop(t+.16)},

};
function kick(when){const a=ac();if(!a)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.15);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g).connect(dst());o.start(t);o.stop(t+.22)}
let NOISE=null,BUS=null,REV=null,DEST=null,DESTR=null;
function dst(){OUT();return DEST||BUS}
function dstR(){OUT();return DESTR||REV}
function beginSong(){const a=ac();if(!a)return;OUT();endSong();DEST=a.createGain();DEST.connect(BUS);DESTR=a.createGain();DESTR.connect(REV)}
function endSong(){if(DEST&&AC){const t=AC.currentTime;[DEST,DESTR].forEach(g=>{g.gain.cancelScheduledValues(t);g.gain.setTargetAtTime(0,t,.04);const gg=g;setTimeout(()=>{try{gg.disconnect()}catch(e){}},600)})}DEST=DESTR=null}
function noiseBuf(a){if(!NOISE){NOISE=a.createBuffer(1,a.sampleRate*.5,a.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return NOISE}
function OUT(){const a=ac();if(!BUS){BUS=a.createGain();BUS.gain.value=.85;const comp=a.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;BUS.connect(comp);comp.connect(a.destination);
  REV=a.createConvolver();const len=a.sampleRate*2.4|0,ir=a.createBuffer(2,len,a.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}REV.buffer=ir;const wet=a.createGain();wet.gain.value=.3;REV.connect(wet);wet.connect(comp)}return BUS}
function inst(f,when,dur,o){const a=ac();if(!a)return;const t=a.currentTime+Math.max(0,when),g=a.createGain(),{v=.15,att=.005,parts=[[1,1,"sine"]],rev=.35,lp=0}=o;OUT();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+att);g.gain.exponentialRampToValueAtTime(.0008,t+dur);let node=g;
  if(lp){const fl=a.createBiquadFilter();fl.type="lowpass";fl.frequency.value=lp;g.connect(fl);node=fl}node.connect(dst());if(rev){const r=a.createGain();r.gain.value=rev;node.connect(r);r.connect(dstR())}
  parts.forEach(([m,amp,ty])=>{const os=a.createOscillator(),pg=a.createGain();os.type=ty||"sine";os.frequency.value=f*m;pg.gain.value=amp;os.connect(pg);pg.connect(g);os.start(t);os.stop(t+dur+.05)})}
const musicBox=(f,w,d=1.2)=>inst(f,w,d,{v:.17,parts:[[1,1],[2,.32],[3,.1],[4.2,.06]],rev:.55});
const marimba=(f,w,d=.45)=>inst(f,w,d,{v:.09,parts:[[1,1],[4,.22],[9.8,.04]],rev:.3});
const pad=(fs,w,d)=>fs.forEach(f=>inst(f,w,d,{v:.04,att:.15,parts:[[1,1,"triangle"],[2,.15]],rev:.7,lp:1600}));
const bass=(f,w,d=.5)=>inst(f,w,d,{v:.2,att:.01,parts:[[1,1],[2,.35,"triangle"]],rev:.05,lp:700});
function shaker(w,v=.035){const a=ac();if(!a)return;const t=a.currentTime+Math.max(0,w),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=noiseBuf(a);f.type="bandpass";f.frequency.value=7500;f.Q.value=1.2;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.06);s.connect(f);f.connect(g);g.connect(dst());s.start(t);s.stop(t+.08)}
function clap(w,v=.09){const a=ac();if(!a)return;const t=a.currentTime+Math.max(0,w),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),r=a.createGain();s.buffer=noiseBuf(a);f.type="bandpass";f.frequency.value=1700;f.Q.value=.8;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);r.gain.value=.4;s.connect(f);f.connect(g);g.connect(dst());g.connect(r);r.connect(dstR());s.start(t);s.stop(t+.16)}

const semi=(f,n)=>f*Math.pow(2,n/12);

function bassOf(key,root){let f=semi(key/2,root);while(f>180)f/=2;return f}
function grooveBar(key,root,t,spb,arp){pad(chordTones(key,root).map(f=>f/2),t,4*spb+.3);const bf=bassOf(key,root);
  for(let b=0;b<4;b++){const tb=t+b*spb;if(b%2)clap(tb,.055);else kick(tb);bass(b%2?bf*1.5:bf,tb,spb*.8);shaker(tb);shaker(tb+spb/2,.022);
    if(arp){const ct=chordTones(key,root);marimba(ct[[0,1,2,1][b]]*2,tb+spb/2,.35)}}}
function songData(x){
  if(x.u==="X")return[{w:["X","is","in","box"],sp:"ex is in box!"},{w:["/ks/","/ks/","box"],sp:"ks, ks, box!"},{w:["X","is","in","fox"],sp:"ex is in fox!"},{w:["/ks/","/ks/","fox"],sp:"ks, ks, fox!"}];
  return[{w:[x.u,"is","for",x.w1],sp:`${x.name} is for ${x.w1}!`},{w:[x.ipa,x.ipa,x.w1],sp:`${x.snd}, ${x.snd}, ${x.w1}!`},
         {w:[x.u,"is","for",x.w2],sp:`${x.name} is for ${x.w2}!`},{w:[x.ipa,x.ipa,x.w2],sp:`${x.snd}, ${x.snd}, ${x.w2}!`}]}
function playLetterSong(x,ui){
  const a=ac();if(!a)return;const tk=++songToken;beginSong();
  const idx=L.indexOf(x),key=KEYS[idx%5],M=MELS[idx%6],P=PROGS[idx%3],lead=LEADS[idx%4],spb=60/(100+(idx%4)*6),t0=.2,B=b=>t0+b*spb,lines=songData(x);
  const later=(sec,fn)=>setTimeout(()=>{if(tk===songToken)fn()},sec*1000);
  // intro bar
  grooveBar(key,0,B(0),spb,true);[0,2,4,7].forEach((d,k)=>lead(semi(key,SCALE[d]),B(k*.5+2),.6));
  lines.forEach((ln,k)=>{const bar0=1+k*4;
    for(let j=0;j<4;j++)grooveBar(key,P[j],B((bar0+j)*4),spb,j>=2);
    const D=k%2?[1,1,4]:[1,1,1,3];let b=(bar0)*4;
    later(B(b)-.05,()=>ui.line(k));
    ln.w.forEach((w,wi)=>{const f=semi(key,SCALE[M[k][wi]]);lead(f,B(b),Math.max(.5,D[wi]*spb*1.25));if(D[wi]>=3)lead(f,B(b+1.5),.5);later(B(b),()=>ui.word(k,wi));b+=D[wi]});
    later(B((bar0+2)*4),()=>{ui.echo(k);say(ln.sp,{rate:.92,pitch:1.2})});
  });
  // outro
  const ob=17*4;pad(chordTones(key,0).map(f=>f/2),B(ob),2.5);bass(bassOf(key,0),B(ob),1.2);kick(B(ob));
  [0,2,4,7].forEach((d,k)=>lead(semi(key,SCALE[d]),B(ob)+k*.12,1.6));
  later(B(ob)+1.6,()=>{endSong();songToken++;ui.end()});
}
function songPlayer(box,x,onDone){
  const lines=songData(x);
  box.innerHTML=`<div class="card player"><div class="notes" id="nts"></div>
   <div class="phead"><div class="pl">${x.u}<span>${x.l}</span></div><img src="${emo(x.w1)}" alt=""><div><b>The ${x.u} Song</b><small>Listen to the tune, then sing it back!</small></div></div>
   <div class="karaoke">${lines.map(l=>`<div class="kline">${l.w.map(w=>`<span class="wd">${w}</span>`).join("")}</div>`).join("")}</div>
   <div class="yourturn" id="yt"></div>
   <div class="sbtns"><button class="sbtn" id="spPlay">${PLAY}Play the ${x.u} song</button></div></div>`;
  const els=[...box.querySelectorAll(".kline")],yt=box.querySelector("#yt"),btn=box.querySelector("#spPlay");let ni=0;
  const clear=()=>{els.forEach(e=>{e.classList.remove("on","echo");e.querySelectorAll(".wd").forEach(w=>w.classList.remove("on"))})};
  const start=()=>{clear();btn.innerHTML=STOP+"Stop";btn.onclick=stop;
    ni=setInterval(()=>{const c=box.querySelector("#nts");if(!c)return clearInterval(ni);const n=document.createElement("div");n.className="note";n.textContent=pick(["♪","♫","♬"]);n.style.left=Math.random()*90+"%";n.style.color=pick(["#7a2435","#e2bd62","#c9566a"]);c.appendChild(n);setTimeout(()=>n.remove(),2700)},520);
    playLetterSong(x,{line:k=>{clear();els[k].classList.add("on");yt.textContent="🎵 Listen…"},word:(k,wi)=>{els[k].querySelectorAll(".wd").forEach((w,j)=>w.classList.toggle("on",j===wi))},
      echo:k=>{clear();els[k].classList.add("echo");yt.textContent="🎤 Your turn — sing it!"},
      end:()=>{clearInterval(ni);clear();yt.textContent="🎉 Bravo! Great singing!";confetti();sfx.win();btn.innerHTML=PLAY+"Sing again";btn.onclick=start;onDone&&onDone()}})};
  const stop=()=>{stopAll();clearInterval(ni);clear();yt.textContent="";btn.innerHTML=PLAY+`Play the ${x.u} song`;btn.onclick=start};
  btn.onclick=start;
}
function stepSing(){
  const x=L[LI];B().innerHTML=`<div id="sp"></div><div class="sbtns"><button class="sbtn g" id="sNext" style="display:none">Next: Play! ${PLAY}</button></div>`;
  songPlayer($("#sp"),x,()=>{$("#sNext").style.display="";complete("sing")});

/* letter bubble pop */
function stepPlay(){
  const x=L[LI],others=shuffle(L.filter(o=>o.u!==x.u)).slice(0,7),targets=shuffle([x.u,x.l,x.u,x.l,x.l]);
  const items=shuffle([...targets.map(c=>({c,t:1})),...others.map(o=>({c:Math.random()<.5?o.u:o.l,t:0}))]);
  let left=targets.length;
  B().innerHTML=`<div class="card"><div class="gq">Pop every <span class="tgt">${x.u}</span> and <span class="tgt">${x.l}</span>!</div>
   <div class="gstat"><span>Bubbles left: <b id="bl2">${left}</b></span><button class="sbtn w" id="hear" style="padding:6px 14px;font-size:16px">${SPK}Hear it</button></div>
   <div class="bubbles">${items.map((it,i)=>`<button class="bub" data-i="${i}">${it.c}</button>`).join("")}</div></div>`;
  $("#hear").onclick=()=>say(`Pop every ${x.name}. ${x.name} says ${x.snd}.`);
  B().querySelectorAll(".bub").forEach(b=>b.onclick=()=>{const it=items[b.dataset.i];if(it.t){b.classList.add("gone");sfx.pop();left--;$("#bl2").textContent=left;if(!left){sfx.ok();say(`You popped them all! ${x.name} says ${x.snd}!`);setTimeout(()=>complete("play"),700)}}else{b.classList.remove("wrong");void b.offsetWidth;b.classList.add("wrong");sfx.no();say(`That's ${L.find(o=>o.u===it.c.toUpperCase()).name}. Find ${x.name}!`)}});
  say(`Pop every bubble with big ${x.name} and little ${x.name}!`);
}

/* ---------------- songs ---------------- */
const NT={C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,C5:523.25};
const ABC=[["A","C4",1],["B","C4",1],["C","G4",1],["D","G4",1],["E","A4",1],["F","A4",1],["G","G4",2],
 ["H","F4",1],["I","F4",1],["J","E4",1],["K","E4",1],["L","D4",.5],["M","D4",.5],["N","D4",.5],["O","D4",.5],["P","C4",2],
 ["Q","G4",1],["R","G4",1],["S","F4",2],["T","E4",1],["U","E4",1],["V","D4",2],
 ["W",["G4","G4","F4"],3],["X","F4",1],["Y","E4",1],["and","E4",1],["Z","D4",2],
 ["Now","C4",1],["I","C4",1],["know","G4",1],["my","G4",1],["A","A4",1],["B","A4",1],["Cs","G4",2],
 ["Next","F4",1],["time","F4",1],["won't","E4",1],["you","E4",1],["sing","D4",1],["with","D4",1],["me?","C4",2]];
function renderSongs(){$("#songBody").innerHTML="";$("#lsongs").innerHTML=L.map((x,i)=>`<button class="lsong" data-i="${i}"><img src="${emo(x.w1)}" alt="">${x.u}${x.l}</button>`).join("");$("#lsongs").querySelectorAll(".lsong").forEach(b=>b.onclick=()=>{sfx.tap();stopAll();songPlayer($("#songBody"),L[b.dataset.i]);$("#songBody").scrollIntoView({behavior:"smooth"})});document.querySelectorAll("[data-song]").forEach(b=>b.onclick=()=>{sfx.tap();stopAll();b.dataset.song==="abc"?songABC():songSounds()})}
const ABC_LINES=[[0,7],[7,16],[16,22],[22,27],[27,34],[34,41]],ABC_CH=[["C","C","F","C"],["F","C","G","C"],["C","F","C","G"],["C","F","C","G"],["C","C","F","C"],["F","C","G","C"]];
function abcBlock(t,spb,chords,arp){chords.forEach((c,j)=>{const tt=t+j*2*spb;pad(CH[c].map(f=>f/2),tt,2*spb+.4);bass(ROOT[c],tt,spb*.9);bass(ROOT[c]*1.5,tt+spb,spb*.8);kick(tt);clap(tt+spb,.055);
  for(let e=0;e<4;e++){shaker(tt+e*spb/2);if(arp&&e)marimba(CH[c][[0,0,1,2][e]],tt+e*spb/2)}})}
function songABC(){
  $("#songBody").innerHTML=`<div class="card"><div class="abcgrid">${L.map(x=>`<div class="abct" id="t-${x.u}">${x.u}</div>`).join("")}</div>
   <div class="lyric" id="lyr">Listen to each line, then sing it back!</div>
   <div class="sbtns"><button class="sbtn" id="abcPlay">${PLAY}Play the ABC Song</button></div></div>`;
  $("#songBody").scrollIntoView({behavior:"smooth"});
  $("#abcPlay").onclick=()=>{const a=ac();if(!a)return;const tk=++songToken;beginSong();$("#abcPlay").innerHTML=STOP+"Stop";$("#abcPlay").onclick=()=>{stopAll();songABC()};
    const spb=60/100,t0=.25,later=(sec,fn)=>setTimeout(()=>{if(tk===songToken)fn()},sec*1000);
    const tiles=()=>document.querySelectorAll(".abct");
    abcBlock(t0,spb,["C","C"],true);let t=t0+4*spb;
    ABC_LINES.forEach(([s0,s1],li)=>{
      abcBlock(t,spb,ABC_CH[li],false);let tt=t;
      for(let i=s0;i<s1;i++){const[w,n,b]=ABC[i],notes=Array.isArray(n)?n:[n],each=b/notes.length;notes.forEach((nn,k)=>musicBox(NT[nn],tt+k*each*spb,Math.max(.7,each*spb*1.8)));
        const at=tt;later(at,()=>{tiles().forEach(e=>e.classList.remove("on","echo"));if(w.length===1&&li<4)$("#t-"+w).classList.add("on");
          $("#lyr").innerHTML=ABC.slice(s0,s1).map((z,j)=>`<span class="${s0+j<=i?"on":""}">${z[0]}</span>`).join(" ")});tt+=b*spb}
      const et=t+8*spb;abcBlock(et,spb,ABC_CH[li],true);
      later(et,()=>{tiles().forEach(e=>{e.classList.remove("on");e.classList.add("was")});if(li<4)ABC.slice(s0,s1).forEach(z=>{if(z[0].length===1)$("#t-"+z[0]).classList.add("echo")});
        $("#lyr").innerHTML="🎤 Your turn: <span class='on'>"+ABC.slice(s0,s1).map(z=>z[0]).join(" ")+"</span>";
        say(li<4?ABC.slice(s0,s1).map(z=>z[0].length===1?L.find(x=>x.u===z[0]).name:z[0]).join(", "):(li===4?"Now I know my A, B, Cs!":"Next time won't you sing with me?"),{rate:li<4?1.05:.9,pitch:1.2})});
      t=et+8*spb});
    musicBox(NT.C4,t,1.6);musicBox(NT.E4,t+.1,1.6);musicBox(NT.G4,t+.2,1.6);musicBox(NT.C5,t+.3,2);pad(CH.C.map(f=>f/2),t,2.5);kick(t);
    later(t+1.5,()=>{endSong();songToken++;tiles().forEach(e=>{e.classList.remove("echo");e.classList.add("was")});$("#lyr").innerHTML="🎉 Bravo! You sang the whole alphabet!";confetti();sfx.win();addStars(1);$("#abcPlay").innerHTML=PLAY+"Play again";$("#abcPlay").onclick=()=>{songABC();$("#abcPlay").click()}})};
}
function songSounds(){
  $("#songBody").innerHTML=`<div class="card" style="position:relative"><div class="meet"><div class="bigletter" id="ssL" style="animation:none">Aa</div><div class="pic"><img id="ssP" src="${emo("apple")}" alt=""><div class="w" id="ssW">apple</div></div></div>
   <div class="center"><span class="soundtag" id="ssI">/a/</span></div>
   <div class="sbtns"><button class="sbtn" id="ssPlay">${PLAY}Start the chant</button></div></div>`;
  $("#songBody").scrollIntoView({behavior:"smooth"});
  $("#ssPlay").onclick=async()=>{const tk=++songToken;$("#ssPlay").innerHTML=STOP+"Stop";$("#ssPlay").onclick=()=>{stopAll();songSounds()};beginSong();beatLoop(tk,100);
    for(const x of L){if(tk!==songToken)return;$("#ssL").innerHTML=`${x.u}<span>${x.l}</span>`;$("#ssL").animate([{transform:"scale(.6)"},{transform:"scale(1.1)"},{transform:"scale(1)"}],{duration:400});$("#ssP").src=emo(x.w1);$("#ssW").textContent=x.w1;$("#ssI").textContent=x.ipa;
      await say(x.u==="X"?"ex says ks, ks, box!":`${x.name} says ${x.snd}, ${x.snd}, ${x.w1}!`,{rate:1,pitch:1.25})}
    if(tk!==songToken)return;songToken++;endSong();confetti();sfx.win();addStars(1);$("#ssPlay").innerHTML=PLAY+"Again!";$("#ssPlay").onclick=()=>{songSounds();$("#ssPlay").click()}};
}

/* ---------------- games ---------------- */
const GAMES=[["listen","Listen & Pick","Hear a sound, find its letter","ear"],["first","First Sound","What letter does it start with?","sparkle"],["balloon","Balloon Pop","Pop the right letters","balloon"],["memory","Big & Little","Match big and little letters","eye"]];
function renderGames(){$("#gameBody").innerHTML=`<div class="coco" style="margin-bottom:14px">${owl(76)}<div class="bubble">Pick a game! Every win gives you a <b>star</b> ⭐</div></div><div class="ghub">${GAMES.map(([k,t,d,e],i)=>`<button class="tile t${i+1}" data-g="${k}"><img src="${emo(e)}" alt=""><b>${t}</b><small>${d}</small></button>`).join("")}</div>`;
  $("#gameBody").querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{sfx.tap();({listen:gListen,first:gFirst,balloon:gBalloon,memory:gMemory})[b.dataset.g]()})}
function gameShell(title,inner){$("#gameBody").innerHTML=`<div class="card"><div class="gstat"><button class="sbtn w" id="gBack" style="padding:6px 14px;font-size:16px">‹ Games</button><span>${title}</span><div class="dots" id="gd">${"<i></i>".repeat(5)}</div></div>${inner}</div>`;$("#gBack").onclick=()=>{stopAll();renderGames()}}
function roundDots(n){document.querySelectorAll("#gd i").forEach((d,i)=>d.classList.toggle("y",i<n))}
function gameWin(name,again){addStars(2);toast(emo("trophy"),"You win!",`+2 stars in ${name}!`,again)}
function roundGame(name,makeRound){let score=0;
  const next=()=>{if(score>=5){gameWin(name,()=>roundGame(name,makeRound));return}makeRound(ok=>{if(ok){score++;roundDots(score)}setTimeout(next,ok?900:600)})};next()}
function gListen(){gameShell("Listen & Pick",`<div class="gq">Which letter makes this sound?</div><div class="center"><button class="sbtn g" id="rep">${SPK}Hear the sound</button></div><div class="opts" id="op"></div>`);
  roundGame("Listen & Pick",done=>{const t=pick(L),opts=shuffle([t,...shuffle(L.filter(o=>o.u!==t.u)).slice(0,2)]);const sp=()=>say(t.u==="X"?"ks, ks, like box":`${t.snd}. ${t.snd}. Like ${t.w1}.`,{rate:.8});$("#rep").onclick=sp;sp();
    $("#op").innerHTML=opts.map(o=>`<button class="opt" data-u="${o.u}">${Math.random()<.5?o.u:o.l}</button>`).join("");let tried=false;
    $("#op").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(b.dataset.u===t.u){b.classList.add("right");sfx.ok();say(`Yes! ${t.name} says ${t.snd}!`);done(!tried)}else{b.classList.add("wrong");sfx.no();tried=true;say(`That's ${L.find(o=>o.u===b.dataset.u).name}. Try again!`)}})})}
function gFirst(){gameShell("First Sound",`<div class="gq">What sound does it start with?</div><img class="gpic" id="gp" alt=""><div class="center" style="font-size:28px;font-weight:700" id="gw"></div><div class="opts" id="op"></div>`);
  roundGame("First Sound",done=>{const pool=L.filter(o=>o.u!=="X"),t=pick(pool),w=Math.random()<.5?t.w1:t.w2,opts=shuffle([t,...shuffle(pool.filter(o=>o.u!==t.u)).slice(0,2)]);
    $("#gp").src=emo(w);$("#gw").textContent="?"+w.slice(1);$("#gp").onclick=()=>say(w);say(`${w}. What letter does ${w} start with?`);
    $("#op").innerHTML=opts.map(o=>`<button class="opt" data-u="${o.u}">${o.l}</button>`).join("");let tried=false;
    $("#op").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(b.dataset.u===t.u){b.classList.add("right");sfx.ok();$("#gw").innerHTML=`<b style="color:#7a2435">${w[0]}</b>${w.slice(1)}`;say(`${t.snd}, ${t.snd}, ${w}! It starts with ${t.name}!`);done(!tried)}else{b.classList.add("wrong");sfx.no();tried=true;say(`Listen: ${w}. Try again!`)}})})}
let balloonRAF=0;
function gBalloon(){const t=pick(L);gameShell("Balloon Pop",`<div class="gq">Pop the <span class="tgt">${t.u}</span> and <span class="tgt">${t.l}</span> balloons!</div><div class="gstat"><span>Popped: <b id="bp">0</b> / 8</span><span>⏱ <b id="bt">40</b>s</span></div><div class="sky" id="sky"></div>`);
  document.getElementById("gd").style.display="none";say(`Pop every ${t.name} balloon!`);
  const sky=$("#sky"),cols=["#7a2435","#c9566a","#e2bd62","#4f9f84","#4a8fc1","#b0842c"];let bs=[],got=0,last=0,start=performance.now(),over=false;
  function spawn(){const H=sky.clientHeight,W=sky.clientWidth,isT=Math.random()<.42,o=isT?t:pick(L.filter(z=>z.u!==t.u)),c=Math.random()<.5?o.u:o.l,el=document.createElement("button");el.className="balloon";const bg=pick(cols);el.style.background=bg;el.style.borderBottomColor=bg;el.style.color=bg==="#e2bd62"?"#3d0c14":"#fff";el.textContent=c;const b={el,x:Math.random()*(W-90)+3,y:H+10,v:.9+Math.random()*.9,w:Math.random()*6,t:isT};el.style.left=b.x+"px";
    el.onpointerdown=e=>{e.preventDefault();if(over)return;const r=document.createElement("div");r.className="boom";r.textContent=b.t?"✨":"💨";r.style.left=(b.x+18)+"px";r.style.top=(b.y+20)+"px";sky.appendChild(r);setTimeout(()=>r.remove(),500);
      if(b.t){sfx.pop();got++;$("#bp").textContent=got;el.remove();bs=bs.filter(z=>z!==b);if(got>=8){over=true;cancelAnimationFrame(balloonRAF);say(`Amazing! ${t.name} says ${t.snd}!`);gameWin("Balloon Pop",gBalloon)}}else{sfx.no();say(L.find(z=>z.u===c.toUpperCase()).name)}};
    sky.appendChild(el);bs.push(b)}
  function loop(now){if(over)return;if(now-last>850){spawn();last=now}bs.forEach(b=>{b.y-=b.v*2.1;b.w+=.04;b.el.style.transform=`translate(${Math.sin(b.w)*10}px,${b.y}px)`;b.el.style.top="0"});bs=bs.filter(b=>{if(b.y<-130){b.el.remove();return false}return true});
    const left=40-Math.floor((now-start)/1000);$("#bt").textContent=Math.max(0,left);if(left<=0){over=true;say("Time's up! Let's try again.");toast(emo("balloon"),"Good try!",`You popped ${got} balloons.`,gBalloon);return}balloonRAF=requestAnimationFrame(loop)}
  balloonRAF=requestAnimationFrame(loop)}
function gMemory(){const set=shuffle(L).slice(0,4),cards=shuffle(set.flatMap(x=>[{u:x.u,c:x.u},{u:x.u,c:x.l}]));
  gameShell("Big & Little",`<div class="gq">Find the big and little pairs!</div><div class="memgrid">${cards.map((c,i)=>`<div class="mcard" data-i="${i}"><div class="in"><div class="f"><img src="${LOGO}" style="border-radius:50%" alt=""></div><div class="b">${c.c}</div></div></div>`).join("")}</div>`);
  document.getElementById("gd").style.display="none";say("Find the big letter and the little letter that match!");
  let open=[],pairs=0,lock=false;
  document.querySelectorAll(".mcard").forEach(el=>el.onclick=()=>{if(lock||el.classList.contains("flip"))return;const c=cards[el.dataset.i];el.classList.add("flip");sfx.tap();say(L.find(x=>x.u===c.u).name,{rate:1.1});open.push([el,c]);
    if(open.length===2){lock=true;const[[a,ca],[b,cb]]=open;if(ca.u===cb.u){setTimeout(()=>{a.classList.add("got");b.classList.add("got");sfx.ok();pairs++;open=[];lock=false;if(pairs===4)gameWin("Big & Little",gMemory)},500)}else setTimeout(()=>{a.classList.remove("flip");b.classList.remove("flip");open=[];lock=false},1000)}})}

if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude/.test(location.host)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
