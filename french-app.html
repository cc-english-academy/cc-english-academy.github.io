<style>
/* Layout: burgundy masthead like the book cover, then a level path, then a grid of lesson tiles; a lesson opens as its own page. */
:root{
  --bg:#FBF3EC; --paper:#FFFDFB; --cream:#F6E4D6; --wine:#6A1330; --wine-2:#8E2647;
  --on-wine:#FBEDE2; --fg:#2A1218; --muted:#7B5B62; --line:#EBD6CB; --gold:#C38A2E;
  --ok:#23824B; --ok-bg:#E3F4EA; --bad:#B8322C; --bad-bg:#FBE6E3; --accent:#8E2647;
  --display:"Playfair Display", Georgia, "Times New Roman", serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1A0D11; --paper:#251419; --cream:#331C23; --wine:#4C0C21; --wine-2:#E07A98;
  --on-wine:#FBE7EA; --fg:#F6E7EA; --muted:#C4A3AB; --line:#43272F; --gold:#E3B15A;
  --ok:#5CCB8A; --ok-bg:#163223; --bad:#F08178; --bad-bg:#3A1716; --accent:#F097B1; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1A0D11; --paper:#251419; --cream:#331C23; --wine:#4C0C21; --wine-2:#E07A98;
  --on-wine:#FBE7EA; --fg:#F6E7EA; --muted:#C4A3AB; --line:#43272F; --gold:#E3B15A;
  --ok:#5CCB8A; --ok-bg:#163223; --bad:#F08178; --bad-bg:#3A1716; --accent:#F097B1; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.emo,.pic{font-family:var(--emoji)}

/* Masthead */
.mast{background:var(--wine);color:var(--on-wine)}
.mast .wrap{padding-block:30px 52px}
.hero{display:flex;align-items:center;justify-content:center;gap:clamp(20px,5vw,56px)}
.htxt{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
.cover{width:clamp(150px,22vw,230px);height:auto;aspect-ratio:768/1376;max-width:100%;border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.35),0 0 0 3px color-mix(in srgb,var(--on-wine) 30%,transparent);transform:rotate(-2deg);flex:none}
@media (max-width:640px){.hero{flex-direction:column;gap:18px}.cover{width:150px}}
.logo{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;letter-spacing:.06em;font-size:13px}
.logo svg{width:56px;height:46px}
.mast h1{font-family:var(--display);font-weight:900;font-size:clamp(48px,11vw,92px);line-height:1;margin:6px 0 0;letter-spacing:.01em}
.mast p{margin:0;font-family:var(--display);font-size:clamp(17px,3.4vw,22px);max-width:30ch;text-wrap:balance;opacity:.92}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.tool{background:transparent;border:1.5px solid color-mix(in srgb,var(--on-wine) 45%,transparent);color:var(--on-wine);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
.tool[aria-pressed="true"]{background:var(--on-wine);color:var(--wine)}
.voice-warn{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 14px;margin-top:16px;font-weight:700;font-size:14px}

/* Levels path */
.levels{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:-22px}
.lv{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center;min-width:0}
.lv b{font-family:var(--display);font-size:26px;line-height:1;color:var(--accent)}
.lv small{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.lv span{font-size:12.5px;font-weight:700;line-height:1.2}
.lv[aria-pressed="true"]{background:var(--wine);border-color:var(--wine);color:var(--on-wine)}
.lv[aria-pressed="true"] b,.lv[aria-pressed="true"] small{color:var(--on-wine)}
@media (max-width:700px){.levels{grid-template-columns:repeat(4,minmax(0,1fr))}}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 14px}
.tab{border:none;background:var(--cream);border-radius:999px;padding:8px 16px;font-weight:800;font-size:15px}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tab i{font-style:normal;opacity:.6;font-weight:700;margin-left:4px}

.secname{font-family:var(--display);font-size:24px;margin:22px 0 10px;display:flex;align-items:baseline;gap:10px}
.secname small{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{display:flex;gap:12px;align-items:center;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:12px;min-width:0;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card .ic{flex:none;width:52px;height:52px;border-radius:14px;background:var(--cream);display:grid;place-items:center;font-size:28px}
.card .tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.card .tt{font-weight:800;line-height:1.25}
.card .mt{font-size:12.5px;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:center}
.stars{color:var(--gold);letter-spacing:1px}
.empty{color:var(--muted);padding:30px 0}
footer{color:var(--muted);font-size:13px;text-align:center;padding-block:40px 30px}

/* Lesson */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--wine);color:var(--on-wine)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--wine)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.top .tool,.back{white-space:nowrap;flex:none}
.back{border:none;background:color-mix(in srgb,var(--on-wine) 16%,transparent);border-radius:999px;padding:6px 14px;font-weight:800}
.top .crumb{font-weight:800;font-size:14px;opacity:.85;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sp{flex:1}
.lhead{display:flex;gap:16px;align-items:center;padding-block:26px 8px}
.lhead .big{font-size:58px;line-height:1;flex:none}
.lhead h2{font-family:var(--display);font-size:clamp(28px,6vw,44px);line-height:1.1;margin:0;text-wrap:balance}
.lhead .meta{color:var(--muted);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.say{border:none;background:var(--cream);border-radius:999px;width:40px;height:40px;display:inline-grid;place-items:center;font-size:18px;flex:none}
.say:hover{background:var(--line)}
.intro{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;font-size:18px;font-weight:700;max-width:760px}
.intro p{margin:0;flex:1;min-width:0}
.block{margin-top:34px}
.bh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.bh h3{font-family:var(--display);font-size:26px;margin:0}
.play{border:none;background:var(--wine);color:var(--on-wine);border-radius:999px;padding:8px 16px;font-weight:800;font-size:14px}
.play.stop{background:var(--bad)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.word{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:16px 10px 12px;text-align:center;min-width:0}
.word:hover{border-color:var(--accent)}
.word.on{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 35%,transparent)}
.word .pic{font-size:46px;line-height:1.1;min-height:56px;display:grid;place-items:center}
.word .w{font-weight:900;font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.word .s{font-size:13.5px;color:var(--muted);font-weight:600;line-height:1.3}
.swatch{display:inline-block;width:52px;height:52px;border-radius:50%;border:2px solid var(--line)}
.num{font-family:var(--display);font-weight:900;font-size:44px;color:var(--accent)}
.letter .w{font-family:var(--display);font-size:34px}

/* scene for prepositions */
.scene{position:relative;width:96px;height:64px;font-size:30px;display:block}
.scene .bx,.scene .ct{position:absolute;line-height:1}
.scene .bx{left:33px;top:26px}
.scene .ct{left:33px;top:26px;transition:all .2s}
.s-dans .ct{font-size:18px;left:39px;top:34px;z-index:2}
.s-sur .ct{top:-2px}
.s-sous .ct{top:42px;font-size:20px;left:38px}
.s-sous .bx{top:6px}
.s-devant .ct{left:42px;top:34px;z-index:2;font-size:34px}
.s-derriere .ct{left:22px;top:12px;font-size:22px;z-index:0}.s-derriere .bx{z-index:1}
.s-cote .bx{left:14px}.s-cote .ct{left:52px}
.s-entre .bx{left:0}.s-entre .b2{left:64px}.s-entre .ct{left:32px}
.s-loin .bx{left:-6px}.s-loin .ct{left:74px;font-size:20px;top:34px}

/* rules */
.rules{display:grid;gap:12px;max-width:820px}
.rule{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:16px}
.rule h4{margin:0 0 4px;font-size:18px;font-weight:900;color:var(--accent)}
.rule .rp{display:flex;gap:10px;align-items:flex-start}
.rule .rp p{margin:0;flex:1;min-width:0;font-size:16.5px;font-weight:600}
.exs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:8px;border:none;background:var(--cream);border-radius:12px;padding:8px 12px;font-weight:800;text-align:left}
.chip .pic{font-size:22px}
.chip:hover{background:var(--line)}
.tbl{overflow-x:auto;margin-top:14px;max-width:820px}
table{border-collapse:separate;border-spacing:0;min-width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:16px}
th{background:var(--cream);font-weight:900}
tr:last-child td{border-bottom:none}
td button{border:none;background:none;padding:0;font-weight:700;text-align:left}
td button:hover{color:var(--accent)}
td:first-child{color:var(--muted);font-weight:800}

/* dialogue */
.dlg{display:flex;flex-direction:column;gap:10px;max-width:760px}
.line{display:flex;gap:10px;align-items:flex-end;border:none;background:none;padding:0;text-align:left;max-width:88%}
.line.r{align-self:flex-end;flex-direction:row-reverse;text-align:right}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--cream);display:grid;place-items:center;font-size:24px}
.bub{background:var(--paper);border:1.5px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 14px;min-width:0}
.line.r .bub{border-radius:18px 18px 4px 18px;background:var(--cream)}
.bub small{display:block;font-size:12px;font-weight:900;color:var(--accent);letter-spacing:.04em}
.bub span{font-weight:700;font-size:17px}
.line.on .bub{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 35%,transparent)}
.bub .pic{font-size:26px;margin-right:6px}

/* quiz */
.quiz{background:var(--paper);border:1.5px solid var(--line);border-radius:22px;padding:20px;max-width:760px}
.qbar{height:8px;border-radius:99px;background:var(--cream);overflow:hidden;margin-bottom:16px}
.qbar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.qtop{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.qprompt{display:flex;flex-direction:column;align-items:center;gap:10px;margin:14px 0 18px;text-align:center}
.qprompt .pic{font-size:72px;line-height:1.1}
.qprompt .qt{font-size:22px;font-weight:800;text-wrap:balance}
.qprompt .bigsay{width:72px;height:72px;font-size:32px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:14px 12px;font-weight:800;font-size:18px;min-height:64px;display:grid;place-items:center;text-align:center}
.opt .pic{font-size:44px}
.opt:hover{border-color:var(--accent)}
.opt.good{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);animation:shake .35s}
.opt:disabled{cursor:default}
.fb{min-height:28px;text-align:center;font-weight:900;font-size:18px;margin-top:12px}
.fb.good{color:var(--ok)}.fb.bad{color:var(--bad)}
.qnav{display:flex;justify-content:center;margin-top:8px}
.result{text-align:center;padding:10px 0}
.result .rs{font-size:46px;color:var(--gold);letter-spacing:4px}
.result h4{font-family:var(--display);font-size:30px;margin:6px 0}
.start{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:10px}
.start .pic{font-size:54px}
.next-lesson{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:40px;padding-bottom:50px}
.nl{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 14px;font-weight:800;max-width:48%;text-align:left}
.nl small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.nl.n{text-align:right;margin-left:auto}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.lhead .big{font-size:44px}.words{grid-template-columns:repeat(2,minmax(0,1fr))}.word .pic{font-size:40px}.line{max-width:96%}.nl{max-width:100%}}
</style>

<script>
// J'ADORE — Code Cademy · contenu A0 → A2

const SECTIONS = [
  {id:"bases", t:"Les bases", e:"🧩"},

  {id:"conv", t:"Conversation", e:"💬"}
];
const LEVELS = [
  {n:1, cefr:"A1.1", t:"Premiers pas"},
  {n:2, cefr:"A1.1", t:"Je découvre"},
  {n:3, cefr:"A1.2", t:"Je parle"},
  {n:4, cefr:"A1.2", t:"Je me débrouille"},
  {n:5, cefr:"A2.1", t:"Je raconte"},
  {n:6, cefr:"A2.2", t:"Je voyage"}
];
const LESSONS = [
// ───────────── LES BASES ─────────────
{id:"alphabet", sec:"bases", lvl:1, e:"🔤", t:"L'alphabet", intro:"Il y a 26 lettres. Les voyelles sont : a, e, i, o, u, y. Les autres lettres sont des consonnes.", q:"txt",
 items:["A|🍍|A comme ananas","B|🚤|B comme bateau","C|🥕|C comme carotte","D|🐬|D comme dauphin","E|🐘|E comme éléphant","F|🌸|F comme fleur","G|🦒|G comme girafe","H|🚁|H comme hélicoptère","I|🏝️|I comme île","J|🧃|J comme jus","K|🥝|K comme kiwi","L|🦁|L comme lion","M|🏠|M comme maison","N|☁️|N comme nuage","O|🍊|O comme orange","P|🍎|P comme pomme","Q|4️⃣|Q comme quatre","R|🤖|R comme robot","S|🐍|S comme serpent","T|🐢|T comme tortue","U|🏭|U comme usine","V|🚲|V comme vélo","W|🚃|W comme wagon","X|🎹|X comme xylophone","Y|🧘|Y comme yoga","Z|🦓|Z comme zèbre"]},
{id:"accents", sec:"bases", lvl:2, e:"🎵", t:"Les accents", intro:"Les accents changent le son ou le sens d'un mot. Écoute bien !", q:"txt",

{id:"salutations", sec:"bases", lvl:1, e:"👋", t:"Les salutations", intro:"Pour dire bonjour et au revoir.",

 sp:{"Léa":"👧","Adam":"👦"},

<script>
(() => {
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem("jadore:"+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem("jadore:"+k, JSON.stringify(v)); }catch(e){} }
};
const state = { level: store.get("level", 0), sec: store.get("sec", "all"), slow: store.get("slow", false) };
const byId = Object.fromEntries(LESSONS.map(l => [l.id, l]));
const secOf = id => SECTIONS.find(s => s.id === id);

// ───── voix ─────
let voice = null, voicesReady = false;
const synth = window.speechSynthesis;
function pickVoice(){
  if(!synth) return;
  const vs = synth.getVoices();
  if(!vs.length) return;
  voicesReady = true;
  const fr = vs.filter(v => /^fr/i.test(v.lang));
  const pref = fr.filter(v => /fr[-_]FR/i.test(v.lang));
  const pool = pref.length ? pref : fr;
  voice = pool.find(v => /google|natural|online|amélie|amelie|thomas|denise|henri/i.test(v.name)) || pool[0] || null;
  const w = $("#voicewarn"); if(w) w.hidden = !!voice;
}
if(synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }
function clean(t){
  return String(t)
    .replace(/\(e\)/g,"")
    .replace(/_{2,}/g," … ")
    .replace(/[→\/·]/g,", ")
    .replace(/\p{Extended_Pictographic}|️|⃣|‍/gu,"")
    .replace(/\s+/g," ").trim();
}
let seqToken = 0;
function speak(text, {pitch=1, onend}={}){
  if(!synth){ onend && onend(); return; }
  const u = new SpeechSynthesisUtterance(clean(text));
  u.lang = "fr-FR"; if(voice) u.voice = voice;
  u.rate = state.slow ? 0.62 : 0.88; u.pitch = pitch;
  if(onend){ u.onend = onend; u.onerror = onend; }
  synth.speak(u);
}
function say(text, pitch){ if(synth) synth.cancel(); seqToken++; stopPlayButtons(); speak(text, {pitch}); }
function sequence(list, onStep, onDone){
  if(synth) synth.cancel();
  const tok = ++seqToken; let i = 0;
  const next = () => {
    if(tok !== seqToken) return;
    if(i >= list.length){ onStep && onStep(-1); onDone && onDone(); return; }
    const it = list[i]; onStep && onStep(i);
    speak(it.text, {pitch: it.pitch || 1, onend: () => { i++; setTimeout(next, 380); }});
  };
  next();
}
function stopPlayButtons(){ document.querySelectorAll(".play.stop").forEach(b => { b.classList.remove("stop"); b.textContent = b.dataset.label; }); document.querySelectorAll(".on").forEach(e => e.classList.remove("on")); }

// ───── helpers ─────
function parseItem(s){ const [w, p="", x=""] = s.split("|"); return {w, p, x}; }
function pic(p, cls="pic"){
  if(!p) return "";
  if(p.startsWith("#")) return `<span class="swatch" style="background:${p}"></span>`;
  if(p.startsWith("scene:")){
    const k = p.slice(6);
    return `<span class="scene s-${k}" aria-hidden="true"><span class="bx emo">📦</span>${k==="entre"?'<span class="bx b2 emo">📦</span>':''}<span class="ct emo">🐱</span></span>`;
  }
  if(/^\d+$/.test(p)) return `<span class="num">${p}</span>`;
  return `<span class="${cls}">${esc(p)}</span>`;
}
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const starsTxt = n => "★".repeat(n) + "☆".repeat(3-n);
const best = id => store.get("best:"+id, 0);

// ───── accueil ─────
function filtered(){
  return LESSONS.filter(l => (!state.level || l.lvl === state.level) && (state.sec === "all" || l.sec === state.sec));
}
function renderHome(){
  document.title = "J'ADORE Français";
  const counts = Object.fromEntries(SECTIONS.map(s => [s.id, LESSONS.filter(l => (!state.level || l.lvl===state.level) && l.sec===s.id).length]));
  const total = LESSONS.filter(l => !state.level || l.lvl===state.level).length;
  const list = filtered();
  const groups = SECTIONS.filter(s => state.sec==="all" || s.id===state.sec)
    .map(s => ({s, ls: list.filter(l => l.sec===s.id).sort((a,b)=>a.lvl-b.lvl)})).filter(g => g.ls.length);
  $("#app").innerHTML = `
  <header class="mast"><div class="wrap hero">
    <img class="cover" src="${COVER}" alt="Couverture du livre J'ADORE : un garçon devant la tour Eiffel" width="768" height="1376">
    <div class="htxt">
    <div class="logo">${LOGO}<span>CODE CADEMY</span></div>
    <h1>J'ADORE</h1>
    <p>Vivre le français, l'aimer et l'apprendre avec plaisir !</p>
    <div class="tools">
      <button class="tool" id="slow" aria-pressed="${state.slow}">🐢 Voix lente</button>
      <button class="tool" id="test">🔊 Tester la voix</button>
    </div>
    <div class="voice-warn" id="voicewarn" hidden>Pas de voix française sur cet appareil. Ajoute une voix « Français » dans les réglages de ton appareil, ou ouvre la page dans Chrome.</div>
  </div></div></header>
  <main class="wrap">
    <nav class="levels" aria-label="Niveaux">
      <button class="lv" data-lv="0" aria-pressed="${!state.level}"><small>Niveaux 1 à 6</small><b>✦</b><span>Tous les niveaux</span></button>
      ${LEVELS.map(L => `<button class="lv" data-lv="${L.n}" aria-pressed="${state.level===L.n}"><small>Niveau</small><b>${L.n}</b><span>${L.t}</span></button>`).join("")}
    </nav>
    <div class="tabs" role="group" aria-label="Parties">
      <button class="tab" data-sec="all" aria-pressed="${state.sec==="all"}">Tout <i>${total}</i></button>
      ${SECTIONS.map(s => `<button class="tab" data-sec="${s.id}" aria-pressed="${state.sec===s.id}"><span class="emo">${s.e}</span> ${s.t} <i>${counts[s.id]}</i></button>`).join("")}
    </div>
    ${groups.length ? groups.map(g => `
      <h2 class="secname"><span class="emo">${g.s.e}</span> ${g.s.t} <small>${g.ls.length} leçons</small></h2>
      <div class="grid">${g.ls.map(l => `
        <button class="card" data-go="${l.id}">
          <span class="ic emo">${l.e}</span>
          <span class="tx"><span class="tt">${esc(l.t)}</span>
          <span class="mt">Niveau ${l.lvl} <span class="stars" aria-label="${best(l.id)} étoiles sur 3">${starsTxt(best(l.id))}</span></span></span>
        </button>`).join("")}</div>`).join("") : `<p class="empty">Aucune leçon ici.</p>`}
  </main>
  <footer class="wrap">Tous droits réservés © Code Cademy</footer>`;
  pickVoice();
  document.querySelectorAll(".lv").forEach(b => b.onclick = () => { state.level = +b.dataset.lv; store.set("level", state.level); renderHome(); });
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { state.sec = b.dataset.sec; store.set("sec", state.sec); renderHome(); });
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { location.hash = b.dataset.go; });
  $("#slow").onclick = () => { state.slow = !state.slow; store.set("slow", state.slow); $("#slow").setAttribute("aria-pressed", state.slow); say("Bonjour ! Je parle lentement ?"); };
  $("#test").onclick = () => say("Bonjour ! Bienvenue à Code Cademy. On apprend le français ensemble !");
}

// ───── leçon ─────
function renderLesson(l){
  document.title = l.t + " · J'ADORE";
  const items = (l.items||[]).map(parseItem);
  const sec = secOf(l.sec);
  const order = LESSONS.slice().sort((a,b)=> a.lvl-b.lvl || SECTIONS.findIndex(s=>s.id===a.sec)-SECTIONS.findIndex(s=>s.id===b.sec));
  const idx = order.indexOf(l), prev = order[idx-1], next = order[idx+1];
  const speakers = l.sp ? Object.keys(l.sp) : [];
  const isLetters = l.id === "alphabet" || l.id === "accents";
  $("#app").innerHTML = `
  <div class="top"><div class="wrap">
    <button class="back" id="back">← Accueil</button>

  </div></div>
  <main class="wrap">
    <div class="lhead"><span class="big emo">${l.e}</span>
      <div><div class="meta">${sec.t} · Niveau ${l.lvl}</div>
      <h2>${esc(l.t)}</h2></div>
      <button class="say" data-say="${esc(l.t)}" aria-label="Écouter le titre">🔊</button>
    </div>
    ${l.intro ? `<div class="intro"><p>${esc(l.intro)}</p><button class="say" data-say="${esc(l.intro)}" aria-label="Écouter">🔊</button></div>` : ""}

    ${l.rules ? `<section class="block"><div class="bh"><h3>La règle</h3></div><div class="rules">
      ${l.rules.map(r => `<div class="rule"><h4>${esc(r.h)}</h4>
        <div class="rp"><p>${esc(r.p)}</p><button class="say" data-say="${esc(r.p)}" aria-label="Écouter la règle">🔊</button></div>
        <div class="exs">${r.ex.map(e => { const it = parseItem(e); return `<button class="chip" data-say="${esc(it.w)}">${pic(it.p)}<span>${esc(it.w)}</span></button>`; }).join("")}</div>
      </div>`).join("")}
    </div>
    ${l.table ? `<div class="tbl"><table><thead><tr>${l.table[0].map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>
      ${l.table.slice(1).map(r => `<tr>${r.map((c,i)=> i===0 ? `<td>${esc(c)}</td>` : `<td><button data-say="${esc(tableSay(r, i, l))}">${esc(c)}</button></td>`).join("")}</tr>`).join("")}
    </tbody></table></div>` : ""}
    </section>` : ""}

    ${l.dlg ? `<section class="block"><div class="bh"><h3>${l.id==="c-histoire" ? "L'histoire" : "Le dialogue"}</h3>
      <button class="play" id="playdlg" data-label="▶ Écouter ${l.id==="c-histoire"?"l'histoire":"le dialogue"}">▶ Écouter ${l.id==="c-histoire"?"l'histoire":"le dialogue"}</button></div>
      <div class="dlg">${l.dlg.map((d,i) => { const [s, t, p] = d.split("|"); const right = speakers.indexOf(s) % 2 === 1;
        return `<button class="line ${right?"r":""}" data-i="${i}"><span class="av emo">${l.sp[s]}</span><span class="bub"><small>${esc(s)}</small>${p?pic(p):""}<span>${esc(t)}</span></span></button>`; }).join("")}</div>
    </section>` : ""}

    ${items.length ? `<section class="block"><div class="bh"><h3>${l.sec==="conv" ? "Phrases utiles" : l.sec==="gram" ? "Les mots" : "Écoute et répète"}</h3>
      <button class="play" id="playall" data-label="▶ Tout écouter">▶ Tout écouter</button></div>
      <div class="words ${isLetters?"letter":""}">${items.map((it,i) => `
        <button class="word" data-i="${i}">${pic(it.p)}<span class="w">${esc(it.w)}</span>${it.x && it.x!==it.w ? `<span class="s">${esc(it.x)}</span>` : ""}</button>`).join("")}</div>
    </section>` : ""}

    <section class="block"><div class="bh"><h3>À toi de jouer !</h3></div>
      <div class="quiz" id="quiz"></div></section>

    <nav class="next-lesson">
      ${prev ? `<button class="nl" data-go="${prev.id}"><small>← Leçon précédente</small>${esc(prev.t)}</button>` : ""}
      ${next ? `<button class="nl n" data-go="${next.id}"><small>Leçon suivante →</small>${esc(next.t)}</button>` : ""}
    </nav>
  </main>`;
  window.scrollTo(0,0);
  $("#back").onclick = () => { location.hash = ""; };
  $("#slow").onclick = () => { state.slow = !state.slow; store.set("slow", state.slow); $("#slow").setAttribute("aria-pressed", state.slow); };
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { location.hash = b.dataset.go; });
  document.querySelectorAll("[data-say]").forEach(b => b.onclick = () => say(b.dataset.say));
  const words = [...document.querySelectorAll(".word")];
  words.forEach(b => b.onclick = () => { const it = items[+b.dataset.i]; say(it.x && it.x!==it.w ? it.w + ". " + it.x : it.w); });
  const pitchOf = s => [1.08, 0.9, 1.2][Math.max(0, speakers.indexOf(s)) % 3];
  const lines = [...document.querySelectorAll(".line")];
  lines.forEach(b => b.onclick = () => { const [s,t] = l.dlg[+b.dataset.i].split("|"); say(t, pitchOf(s)); });
  const wirePlay = (btn, list, els) => { if(!btn) return; btn.onclick = () => {
    if(btn.classList.contains("stop")){ synth && synth.cancel(); seqToken++; stopPlayButtons(); return; }
    stopPlayButtons(); btn.classList.add("stop"); btn.textContent = "■ Arrêter";
    sequence(list, i => { els.forEach(e => e.classList.remove("on")); if(i>=0){ els[i].classList.add("on"); els[i].scrollIntoView({block:"nearest", behavior:"smooth"}); } },
      () => { btn.classList.remove("stop"); btn.textContent = btn.dataset.label; });
  };};
  wirePlay($("#playall"), items.map(it => ({text: it.w})), words);
  if(l.dlg) wirePlay($("#playdlg"), l.dlg.map(d => { const [s,t] = d.split("|"); return {text:t, pitch:pitchOf(s)}; }), lines);
  quiz(l, items);
}
function tableSay(row, ci, l){
  const cell = row[ci], p = row[0].split(" · ")[0];
  if(!/^(je|j'|tu|il|nous|vous|ils)$/.test(p) || ["pronoms","possessifs"].includes(l.id)) return cell;
  const verb = (l.id==="futur" || l.id==="passe") ? row[1] + " " + row[2] : cell;
  const jj = (p==="je"||p==="j'");
  return jj ? (/^[aeiouhéè]/i.test(verb) ? "j'" + verb : "je " + verb) : p + " " + verb;
}

// ───── exercices ─────
function buildQuestions(l, items){
  const qs = [];
  const n = Math.min(items.length >= 4 ? 6 : 0, items.length);
  if(n){
    const txt = l.q === "txt" || l.sec === "conv";
    shuffle(items).slice(0, n).forEach((it, k) => {
      const others = shuffle(items.filter(o => o !== it && o.p !== it.p)).slice(0, 2 + (items.length > 5 ? 1 : 0));
      if(txt){
        qs.push({kind:"listen-word", audio: it.w, answer: it.w, opts: shuffle([it, ...others]).map(o => ({label: esc(o.w), val: o.w}))});
      } else if(k % 2 === 0){
        qs.push({kind:"listen-pic", audio: it.w, answer: it.w, opts: shuffle([it, ...others]).map(o => ({label: pic(o.p), val: o.w, pic:true}))});
      } else {
        qs.push({kind:"pic-word", pic: it.p, audio: null, answer: it.w, opts: shuffle([it, ...others]).map(o => ({label: esc(o.w), val: o.w}))});
      }
    });
  }
  (l.ex || []).forEach(e => {
    const [q, p, good, ...bad] = e;
    qs.push({kind:"mcq", q, pic: p, answer: good, opts: shuffle([good, ...bad]).map(o => ({label: esc(o), val: o}))});
  });
  return qs;
}
const PRAISE = ["Bravo !","Super !","Excellent !","Très bien !","Génial !","Parfait !"];
function quiz(l, items){
  const box = $("#quiz");
  const total = buildQuestions(l, items).length;
  box.innerHTML = `<div class="start"><span class="pic">🎯</span><div style="font-weight:800;font-size:18px">${total} questions pour gagner tes étoiles</div>
    <span class="stars" style="font-size:26px">${starsTxt(best(l.id))}</span>
    <button class="play" id="go">▶ Commencer</button></div>`;
  $("#go").onclick = () => run(buildQuestions(l, items));
  function run(qs){
    let i = 0, score = 0;
    const show = () => {
      if(i >= qs.length) return end();
      const q = qs[i]; let tries = 0, done = false;
      const title = {"listen-pic":"Écoute et choisis l'image","pic-word":"Comment dit-on ?","listen-word":"Écoute et choisis","mcq":"Choisis la bonne réponse"}[q.kind];
      box.innerHTML = `<div class="qbar"><i style="width:${i/qs.length*100}%"></i></div>
        <div class="qtop"><span>${title}</span><span>${i+1} / ${qs.length}</span></div>
        <div class="qprompt">
          ${q.audio ? `<button class="say bigsay" id="qsay" aria-label="Réécouter">🔊</button>` : ""}
          ${q.pic ? pic(q.pic) : ""}
          ${q.kind==="mcq" ? `<div class="qt">${esc(q.q)}</div><button class="say" id="qsay2" aria-label="Écouter la question">🔊</button>` : ""}
        </div>
        <div class="opts">${q.opts.map((o,k) => `<button class="opt" data-k="${k}">${o.label}</button>`).join("")}</div>
        <div class="fb" id="fb" aria-live="polite"></div><div class="qnav" id="qnav"></div>`;
      const playQ = () => q.audio ? say(q.audio) : (q.kind==="mcq" ? say(q.q) : null);
      if($("#qsay")) $("#qsay").onclick = () => say(q.audio);
      if($("#qsay2")) $("#qsay2").onclick = () => say(q.q);
      setTimeout(playQ, 250);
      box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
        if(done) return;
        const o = q.opts[+b.dataset.k];
        if(o.val === q.answer){
          done = true; if(tries === 0) score++;
          b.classList.add("good"); box.querySelectorAll(".opt").forEach(x => x.disabled = true);
          const praise = PRAISE[Math.floor(Math.random()*PRAISE.length)];
          $("#fb").className = "fb good"; $("#fb").textContent = "✓ " + praise;
          const full = q.kind==="mcq" && q.q.includes("___") ? q.q.replace("___", q.answer).replace(/^(\p{Ll})/u, c=>c) : q.answer;
          if(synth) synth.cancel(); seqToken++;
          speak(praise, {onend: () => speak(full)});
          $("#qnav").innerHTML = `<button class="play" id="nx">${i+1 < qs.length ? "Question suivante →" : "Voir mon score →"}</button>`;
          $("#nx").onclick = () => { i++; show(); };
          $("#nx").focus({preventScroll:true});
        } else {
          tries++; b.classList.add("bad"); b.disabled = true;
          $("#fb").className = "fb bad"; $("#fb").textContent = "Essaie encore !";
          say("Essaie encore !");
        }
      });
    };
    const end = () => {
      const pct = score / qs.length;
      const st = pct >= .9 ? 3 : pct >= .7 ? 2 : pct >= .4 ? 1 : 0;
      if(st > best(l.id)) store.set("best:"+l.id, st);
      const msg = st===3 ? "Magnifique !" : st===2 ? "Très bien !" : st===1 ? "Bon travail !" : "Continue, tu vas y arriver !";
      box.innerHTML = `<div class="result"><div class="rs">${starsTxt(st)}</div><h4>${msg}</h4>
        <p style="font-weight:800;font-size:18px">${score} bonnes réponses du premier coup sur ${qs.length}</p>
        <button class="play" id="again">↻ Recommencer</button></div>`;
      say(msg + " Tu as " + score + " bonnes réponses sur " + qs.length + ".");
      $("#again").onclick = () => run(buildQuestions(l, items));
    };
    show();
  }
}
