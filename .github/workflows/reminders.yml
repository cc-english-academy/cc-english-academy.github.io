name: Reminders

# Reminds students, parents and teachers about classes, homework and plans, every 10 minutes
# (so the "class starts in 15 minutes" notification arrives on time).
# Run it by hand any time: Actions → Reminders → Run workflow.
on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the push notification library
        run: npm install --no-save --no-package-lock --no-audit --no-fund web-push@3.6.7
      - name: Send reminders
        run: node scripts/reminders.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REMINDER_FROM: ${{ secrets.REMINDER_FROM }}
          ACADEMY_TZ: ${{ secrets.ACADEMY_TZ }}
