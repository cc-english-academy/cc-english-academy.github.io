name: Deploy Coco

# Puts Coco (the AI teacher, supabase/functions/tutor) live on Supabase:
# every time its code changes on main, or by hand: Actions → Deploy Coco → Run workflow.
# Needs two secrets (GitHub → Settings → Secrets and variables → Actions) — see AI-TUTOR.md:
#   SUPABASE_ACCESS_TOKEN  a personal access token from supabase.com/dashboard/account/tokens
#   ANTHROPIC_API_KEY      the Claude API key from console.anthropic.com (sent to Supabase, never to the website)
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'orpknmkgfwmtroiqljzp' }}
    steps:
      - name: Check the secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Add the SUPABASE_ACCESS_TOKEN secret to deploy Coco (see AI-TUTOR.md) — skipped."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v5
        if: env.SKIP != '1'
      - uses: supabase/setup-cli@v1
        if: env.SKIP != '1'
        with:
          version: latest
      - name: Give Coco its Claude key
        if: env.SKIP != '1' && env.ANTHROPIC_API_KEY != ''
        run: supabase secrets set --project-ref "$PROJECT_REF" ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"
      - name: Deploy the tutor function
        if: env.SKIP != '1'
        run: supabase functions deploy tutor --project-ref "$PROJECT_REF" --use-api
      - name: Done
        if: env.SKIP != '1'
        run: |
          echo "Coco is live. Open the website, press Ctrl+F5, sign in and tap the robot."
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::warning::ANTHROPIC_API_KEY is not set here — make sure it is saved in Supabase → Edge Functions → Secrets."; fi
